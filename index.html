 وعلاليه بغير حق الذي يستخدم صاحبه مجانا ولا يعطيه اجرته.","القائل أبني لنفسي بيتا وسيعا وعلالي فسيحة ويشق لنفسه كوى ويسقف بارز ويدهن بمغرة.","هل تملك لانك انت تحاذي الارز. أما اكل ابوك وشرب واجرى حقا وعدلا. حينئذ كان له خير.","قضى قضاء الفقير والمسكين حينئذ كان خير. أليس ذلك معرفتي يقول الرب.","لان عينيك وقلبك ليست الا على خطفك وعلى الدم الزكي لتسفكه وعلى الاغتصاب والظلم لتعملهما.","لذلك هكذا قال الرب عن يهوياقيم بن يوشيا ملك يهوذا. لا يندبونه قائلين آه يا اخي او آه يا اخت. لا يندبونه قائلين آه يا سيد او آه يا جلاله.","يدفن دفن حمار مسحوبا ومطروحا بعيدا عن ابواب اورشليم"]},"29":{"o":1,"v":["هذا كلام الرسالة التي ارسلها ارميا النبي من اورشليم الى بقية شيوخ السبي والى الكهنة والانبياء والى كل الشعب الذين سباهم نبوخذناصّر من اورشليم الى بابل","بعد خروج يكنيا الملك والملكة والخصيان ورؤساء يهوذا واورشليم والنجارين والحدادين من اورشليم","بيد العاسة بن شافان وجمريا بن حلقيا اللذين ارسلهما صدقيا ملك يهوذا الى نبوخذناصّر ملك بابل الى بابل قائلا","هكذا قال رب الجنود اله اسرائيل لكل السبي الذي سبيته من اورشليم الى بابل.","ابنوا بيوتا واسكنوا واغرسوا جنات وكلوا ثمرها.","خذوا نساء ولدوا بنين وبنات وخذوا لبنيكم نساء واعطوا بناتكم لرجال فيلدن بنين وبنات واكثروا هناك ولا تقلوا.","واطلبوا سلام المدينة التي سبيتكم اليها وصلّوا لاجلها الى الرب لانه بسلامها يكون لكم سلام.","لانه هكذا قال رب الجنود اله اسرائيل. لا تغشكم انبياؤكم الذين في وسطكم وعرافوكم ولا تسمعوا لاحلامكم التي تتحلمونها.","لانهم انما يتنبأون لكم باسمي بالكذب. انا لم ارسلهم يقول الرب","لانه هكذا قال الرب. اني عند تمام سبعين سنة لبابل اتعهدكم واقيم لكم كلامي الصالح بردكم الى هذا الموضع.","لاني عرفت الافكار التي انا مفتكر بها عنكم يقول الرب افكار سلام لا شر لاعطيكم آخرة ورجاء.","فتدعونني وتذهبون وتصلّون اليّ فاسمع لكم.","وتطلبونني فتجدونني اذ تطلبونني بكل قلبكم.","فأوجد لكم يقول الرب وارد سبيكم واجمعكم من كل الامم ومن كل المواضع التي طردتكم اليها يقول الرب واردكم الى الموضع الذي سبيتكم منه"]},"36":{"o":1,"v":["وكان في السنة الرابعة ليهوياقيم بن يوشيا ملك يهوذا ان هذه الكلمة صارت الى ارميا من قبل الرب قائلة.","خذ لنفسك درج سفر واكتب فيه كل الكلام الذي كلمتك به على اسرائيل وعلى يهوذا وعلى كل الشعوب من اليوم الذي كلمتك فيه من ايام يوشيا الى هذا اليوم.","لعل بيت يهوذا يسمعون كل الشر الذي انا مفكر ان اصنعه بهم فيرجعوا كل واحد عن طريقه الرديء فاغفر ذنبهم وخطيتهم.","فدعا ارميا باروخ بن نيريا فكتب باروخ عن فم ارميا كل كلام الرب الذي كلمه به في درج السفر.","واوصى ارميا باروخ قائلا. انا محبوس لا اقدر ان ادخل بيت الرب","فادخل انت واقرأ في الدرج الذي كتبت عن فمي كل كلام الرب في آذان الشعب في بيت الرب في يوم الصوم واقرأه ايضا في آذان كل يهوذا القادمين من مدنهم.","لعل تضرعهم يقع امام الرب فيرجعوا كل واحد عن طريقه الرديء لانه عظيم الغضب والغيظ اللذان تكلم بهما الرب على هذا الشعب.","ففعل باروخ بن نيريا حسب كل ما اوصاه به ارميا النبي بقراءته في السفر كلام الرب في بيت الرب","وكان في السنة الخامسة ليهوياقيم بن يوشيا ملك يهوذا في الشهر التاسع انهم نادوا لصوم امام الرب كل الشعب في اورشليم وكل الشعب القادمين من مدن يهوذا الى اورشليم.","فقرأ باروخ في السفر كلام ارميا في بيت الرب في مخدع جمريا بن شافان الكاتب في الدار العليا في مدخل باب بيت الرب الجديد في آذان كل الشعب","فلما سمع ميخايا بن جمريا بن شافان كل كلام الرب من السفر","نزل الى بيت الملك الى مخدع الكاتب واذا كل الرؤساء جلوس هناك. اليشاماع الكاتب ودلايا بن شمعيا والناثان بن عكبور وجمريا بن شافان وصدقيا بن حننيا وكل الرؤساء.","واخبرهم ميخايا بكل الكلام الذي سمعه عندما قرأ باروخ السفر في آذان الشعب.","فارسل كل الرؤساء الى باروخ يهودي بن نثنيا بن شلميا بن كوشي قائلين. الدرج الذي قرأت فيه في آذان الشعب خذه بيدك وتعال. فاخذ باروخ بن نيريا الدرج بيده واتى اليهم.","فقالوا له اجلس واقرأه في آذاننا. فقرأ باروخ في آذانهم.","فكان لما سمعوا كل الكلام انهم خافوا ناظرين بعضهم الى بعض وقالوا لباروخ إخبارا نخبر الملك بكل هذا الكلام.","ثم سألوا باروخ قائلين اخبرنا كيف كتبت كل هذا الكلام عن فمه.","فقال لهم باروخ بفمه كان يقرأ لي كل هذا الكلام وانا كنت اكتب في السفر بالحبر.","فقال الرؤساء لباروخ اذهب واختبئ انت وارميا ولا يعلم انسان اين انتما","ثم دخلوا الى الملك الى الدار واودعوا الدرج في مخدع اليشاماع الكاتب واخبروا في اذني الملك بكل الكلام.","فارسل الملك يهودي لياخذ الدرج فاخذه من مخدع اليشاماع الكاتب وقرأه يهودي في اذني الملك وفي آذان كل الرؤساء الواقفين لدى الملك.","وكان الملك جالسا في بيت الشتاء في الشهر التاسع. والكانون قدامه متقد.","وكان لما قرأ يهودي ثلاثة شطور او اربعة انه شقه بمبراة الكاتب والقاه الى النار التي في الكانون حتى فني كل الدرج في النار التي في الكانون.","ولم يخف الملك ولا كل عبيده السامعين كل هذا الكلام ولا شققوا ثيابهم.","ولكن الناثان ودلايا وجمريا ترجوا الملك ان لا يحرق الدرج فلم يسمع لهم.","بل أمر الملك يرحمئيل ابن الملك وسرايا بن عزرئيل وشلميا بن عبدئيل ان يقبضوا على باروخ الكاتب وارميا النبي ولكن الرب خبأهما","ثم صارت كلمة الرب الى ارميا بعد احراق الملك الدرج والكلام الذي كتبه باروخ عن فم ارميا قائلة","عد فخذ لنفسك درجا آخر واكتب فيه كل الكلام الاول الذي كان في الدرج الاول الذي احرقه يهوياقيم ملك يهوذا.","وقل ليهوياقيم ملك يهوذا. هكذا قال الرب. انت قد احرقت ذلك الدرج قائلا لماذا كتبت فيه قائلا مجيئا يجيء ملك بابل ويهلك هذه الارض ويلاشي منها الانسان والحيوان.","لذلك هكذا قال الرب عن يهوياقيم ملك يهوذا. لا يكون له جالس على كرسي داود وتكون جثته مطروحة للحر نهارا وللبرد ليلا.","واعاقبه ونسله وعبيده على اثمهم واجلب عليهم وعلى سكان اورشليم وعلى رجال يهوذا كل الشر الذي كلمتهم عنه ولم يسمعوا","فاخذ ارميا درجا آخر ودفعه لباروخ بن نيريا الكاتب فكتب فيه عن فم ارميا كل كلام السفر الذي احرقه يهوياقيم ملك يهوذا بالنار وزيد عليه ايضا كلام كثير مثله"]},"46":{"o":2,"v":["عن مصر عن جيش فرعون نخو ملك مصر الذي كان على نهر الفرات في كركميش الذي ضربه نبوخذراصر ملك بابل في السنة الرابعة ليهوياقيم بن يوشيا ملك يهوذا"]},"52":{"o":31,"v":["وفي السنة السابعة والثلاثين لسبي يهوياكين في الشهر الثاني عشر في الخامس والعشرين من الشهر رفع اويل مرودخ ملك بابل في سنة تملكه راس يهوياكين ملك يهوذا وأخرجه من السجن","وكلمه بخير وجعل كرسيه فوق كراسي الملوك الذين معه في بابل.","وغيّر ثياب سجنه وكان يأكل دائما الخبز امامه كل ايام حياته.","ووظيفته وظيفة دائمة تعطى له من عند ملك بابل امر كل يوم بيومه الى يوم وفاته كل ايام حياته"]},"39":{"o":1,"v":["في السنة التاسعة لصدقيا ملك يهوذا في الشهر العاشر اتى نبوخذراصر ملك بابل وكل جيشه الى اورشليم وحاصروها.","وفي السنة الحادية عشرة لصدقيا في الشهر الرابع في تاسع الشهر فتحت المدينة.","ودخل كل رؤساء ملك بابل وجلسوا في الباب الاوسط نرجل شراصر وسمجرنبو وسرسخيم رئيس الخصيان ونرجل شراصر رئيس المجوس وكل بقية رؤساء ملك بابل.","فلما رآهم صدقيا ملك يهوذا وكل رجال الحرب هربوا وخرجوا ليلا من المدينة في طريق جنة الملك من الباب بين السورين وخرج هو في طريق العربة.","فسعى جيش الكلدانيين وراءهم فادركوا صدقيا في عربات اريحا فاخذوه واصعدوه الى نبوخذناصّر ملك بابل الى ربلة في ارض حماة فكلمه بالقضاء عليه.","فقتل ملك بابل بني صدقيا في ربلة امام عينيه وقتل ملك بابل كل اشراف يهوذا.","واعمى عيني صدقيا وقيده بسلاسل نحاس لياتى به الى بابل.","اما بيت الملك وبيوت الشعب فاحرقها الكلدانيون بالنار ونقضوا اسوار اورشليم.","وبقية الشعب الذين بقوا في المدينة والهاربون الذين سقطوا له وبقية الشعب الذين بقوا سباهم نبوزرادان رئيس الشرط الى بابل.","ولكن بعض الشعب الفقراء الذين لم يكن لهم شيء تركهم نبوزرادان رئيس الشرط في ارض يهوذا واعطاهم كروما وحقولا في ذلك اليوم"]}},"ISA":{"39":{"o":1,"v":["في ذلك الزمان ارسل مرودخ بلادان بن بلادان ملك بابل رسائل وهدية الى حزقيا لانه سمع انه مرض ثم صحّ.","ففرح بهم حزقيا واراهم بيت ذخائره الفضة والذهب والاطياب والزيت الطيب وكل بيت اسلحته وكل ما وجد في خزائنه. لم يكن شيء لم يرهم اياه حزقيا في بيته وفي كل ملكه","فجاء اشعياء النبي الى الملك حزقيا وقال له. ماذا قال هؤلاء الرجال ومن اين جاءوا اليك. فقال حزقيا جاءوا اليّ من ارض بعيدة من بابل.","فقال ماذا رأوا في بيتك. فقال حزقيا رأوا كل ما في بيتي. ليس في خزائني شيء لم أرهم اياه.","فقال اشعياء لحزقيا اسمع قول رب الجنود.","هوذا تأتي ايام يحمل فيها كل ما في بيتك وما خزنه آباؤك الى هذا اليوم الى بابل. لا يترك شيء يقول الرب.","ومن بنيك الذين يخرجون منك الذين تلدهم ياخذون فيكونون خصيانا في قصر ملك بابل.","فقال حزقيا لاشعياء جيد هو قول الرب الذي تكلمت به. وقال فانه يكون سلام وامان في ايامي"]},"45":{"o":1,"v":["هكذا يقول الرب لمسيحه لكورش الذي امسكت بيمينه لادوس امامه امما واحقاء ملوك احل لافتح امامه المصراعين والابواب لا تغلق.","انا اسير قدامك والهضاب امهد. اكسر مصراعي النحاس ومغاليق الحديد اقصف.","واعطيك ذخائر الظلمة وكنوز المخابئ لكي تعرف اني انا الرب الذي يدعوك باسمك اله اسرائيل.","لاجل عبدي يعقوب واسرائيل مختاري دعوتك باسمك. لقبتك وانت لست تعرفني"]},"44":{"o":24,"v":["هكذا يقول الرب فاديك وجابلك من البطن. انا الرب صانع كل شيء ناشر السموات وحدي باسط الارض. من معي.","مبطل آيات المخادعين ومحمق العرافين. مرجع الحكماء الى الوراء ومجهل معرفتهم.","مقيم كلمة عبده ومتمم رأي رسله. القائل عن اورشليم ستعمر ولمدن يهوذا ستبنين وخربها اقيم.","القائل للجة انشفي وانهارك اجفف","القائل عن كورش راعيّ فكل مسرتي يتمم ويقول عن اورشليم ستبنى وللهيكل ستؤسس"]}},"EZK":{"1":{"o":1,"v":["كان في سنة الثلاثين في الشهر الرابع في الخامس من الشهر وانا بين المسبيين عند نهر خابور ان السموات انفتحت فرأيت رؤى الله.","في الخامس من الشهر وهي السنة الخامسة من سبي يوياكين الملك","صار كلام الرب الى حزقيال الكاهن ابن بوزي في ارض الكلدانيين عند نهر خابور. وكانت عليه هناك يد الرب."]},"14":{"o":12,"v":["وكانت اليّ كلمة الرب قائلة.","يا ابن آدم ان اخطأت اليّ ارض وخانت خيانة فمددت يدي عليها وكسرت لها قوام الخبز وارسلت عليها الجوع وقطعت منها الانسان والحيوان","وكان فيها هؤلاء الرجال الثلاثة نوح ودانيال وايوب فانهم انما يخلصون انفسهم ببرهم يقول السيد الرب.","ان عبّرت في الارض وحوشا رديئة فاثكلوها وصارت خرابا بلا عابر بسبب الوحوش","وفي وسطها هؤلاء الثلاثة الرجال فحيّ انا يقول السيد الرب انهم لا يخلصون بنين ولا بنات. هم وحدهم يخلصون والارض تصير خربة.","او ان جلبت سيفا على تلك الارض وقلت يا سيف اعبر في الارض وقطعت منها الانسان والحيوان","وفي وسطها هؤلاء الرجال الثلاثة فحيّ انا يقول السيد الرب انهم لا يخلّصون بنين ولا بنات بل هم وحدهم يخلصون.","او ان ارسلت وبأ على تلك الارض وسكبت غضبي عليها بالدم لاقطع منها الانسان والحيوان","وفي وسطها نوح ودانيال وايوب فحيّ انا يقول السيد الرب انهم لا يخلصون ابنا ولا ابنة. انما يخلصون انفسهم ببرهم"]}}};

  Josiah:["يوشيا","ملك يهوذا · 640–609 ق.م","آخر ملك صالح. سفر الشريعة اتلاقى في أيامه، ومات في مجدّو (ملوك الثاني 22–23). وابنه يهوآحاز حكم بعده تلات شهور."],
  Jehoiakim:["يهوياقيم","ملك يهوذا · 609–598 ق.م","مصر قعّدته على العرش، وبعدين بقى عبد لبابل. هو الملك المذكور في دانيال 1: 1. وابنه يهوياكين حكم بعده تلات شهور."],
  Zedekiah:["صدقيا","ملك يهوذا · 597–586 ق.م","آخر ملوك يهوذا. أورشليم وقعت والهيكل اتحرق في السنة الحداشر من حكمه (ملوك الثاني 25)."],
  Nebuchadnezzar:["نبوخذنصر","ملك بابل · 605–562 ق.م","ملك دانيال 1 لحد 4. هو اللي سبى دانيال لبابل، وحلم بالتمثال وبالشجرة، وربنا وضعه."],
  Evil:["أويل مرودخ","ملك بابل · 562–560 ق.م","ابن نبوخذنصر. هو اللي خرّج الملك يهوياكين من السجن (ملوك الثاني 25: 27–30). ومش مذكور في سفر دانيال."],
  Neri:["نريجلاسر","ملك بابل · 560–556 ق.م","خد العرش بعد أويل مرودخ. وابنه الصغير لاباشي مردوخ حكم بعده كام شهر سنة 556 ق.م. والاتنين مش مذكورين في سفر دانيال."],
  "Nabonidus · Belshazzar":["نبونيد وبيلشاصر","ملوك بابل · 556–539 ق.م","نبونيد كان آخر ملوك بابل. وابنه بيلشاصر كان بيحكم المدينة مكانه، وهو ملك دانيال 5 و7 و8."],
  Cyrus:["كورش","ملك فارس · خد بابل سنة 539 ق.م","جيشه خد بابل. سفر دانيال بيقول إن داريوس المادي خد المملكة (دانيال 5: 31)، وكورش رجّع المسبيين (عزرا 1)."],
  empJ:["مملكة يهوذا","لحد 586 ق.م","المملكة الجنوبية، وعاصمتها أورشليم. بقت تابعة لبابل سنة 605 ق.م واتخربت سنة 586 ق.م."],
  empB:["الإمبراطورية البابلية","605–539 ق.م","بابل بقت القوة الأولى بعد ما هزمت مصر في كركميش، ووقعت في إيد مادي وفارس في ليلة واحدة (دانيال 5)."],
  empP:["فارس","من 539 ق.م","مادي وفارس خدوا بابل. ودانيال خدم أيام داريوس المادي وكورش الفارسي (دانيال 6: 28)."],
  life:["دانيال في بابل","حوالي 605 – 536 ق.م","من وصوله شاب مسبي لحد آخر رؤيا مؤرخة له في السنة التالتة لكورش. ميلاده وموته مش مكتوبين."]
 },
 kings:{Hezekiah:"حزقيا",Manasseh:"منسى",Josiah:"يوشيا",Jehoiakim:"يهوياقيم",Zedekiah:"صدقيا",Nebuchadnezzar:"نبوخذنصر","Nabonidus · Belshazzar":"نبونيد · بيلشاصر",Cyrus:"كورش"},
 books:{"2KI":"ملوك الثاني","2CH":"أخبار الأيام الثاني","ISA":"إشعياء","JER":"إرميا","EZK":"حزقيال","DAN":"دانيال","EZR":"عزرا"},
 foot:[
  ["إزاي تقرا الصفحة دي.","كل نقطة في القصة بتقول اللي نص الكتاب المقدس بيقوله. كل مشهد معاه آياته، ولينكات بتفتح النص في الترجمة الإنجليزية (NLT) وترجمة فاندايك العربية (AVD)."],
  ["التواريخ.","الكتاب المقدس بيأرّخ الأحداث دي بسنة حكم الملك. السنين قبل الميلاد اللي هنا تقريبية وجاية من التاريخ المعروف، مش من النص نفسه."],
  ["من برّه نص الكتاب.","أي حاجة جاية من التاريخ أو من التفسير مكتوبة باختصار وفي مربع عليه عنوان واضح، ومش جوه نقط القصة أبدًا."]
 ]
},

m:{
hezekiah:{date:"حوالي 701 ق.م",title:"حزقيا بيفتح خزاينه لبابل",
 hook:"لحظة كبرياء في أورشليم، وأول نبوة بتشاور على دانيال.",
 thread:"دانيال 1: 2–3 هو تحقيق النبوة دي: كنوز الهيكل بتروح بابل، وشباب من النسل الملكي بيخدموا في قصر الملك.",
 s:[
  ["رُسل جايين من بابل",["مرودخ بلادان ملك بابل بيبعت رسايل وهدية لحزقيا، عشان سمع إنه كان عيان.","سفر الأخبار بيضيف إن الرسل جُم كمان يسألوا عن الأعجوبة اللي حصلت في الأرض."]],
  ["حزقيا بيورّيهم كل حاجة",["حزقيا بيرحّب بيهم وبيورّيهم الفضة والدهب والأطياب والزيت الطيب ومخزن السلاح وكل اللي في خزاينه.","مفيش حاجة في قصره ولا في كل مملكته ما ورّاهاش لهم."]],
  ["ربنا كان بيمتحن قلبه",["بعد ما اتشفى، قلب حزقيا اتكبّر، وما ردّش على الإحسان اللي اتعمل معاه.","في موضوع الرسل، ربنا سابه لنفسه عشان يمتحنه ويعرف كل اللي في قلبه."]],
  ["إشعياء بيسأل الملك",["إشعياء بيسأله: «الرجالة دول قالوا إيه، وجايين منين؟» وحزقيا بيرد: «من أرض بعيدة، من بابل.»","إشعياء بيسأل هم شافوا إيه في القصر. حزقيا بيقول: «شافوا كل حاجة. مفيش حاجة في خزايني ما ورّيتهاش لهم.»"]],
  ["النبوة اللي بتوصل لدانيال",["إشعياء بيقول كلام الرب: هييجي وقت كل اللي في القصر، وكل اللي آباؤه خزّنوه، هيتاخد لبابل. مش هيفضل حاجة.","وناس من نسل حزقيا نفسه هيتاخدوا، ويبقوا خصيان في قصر ملك بابل."]],
  ["«المهم في أيامي أنا»",["حزقيا بيرد إن كلام الرب كويس.","وكان بيفكر إن هيبقى فيه سلام وأمان في أيامه هو."]]
 ]},
manasseh:{date:"حوالي 697 – 642 ق.م",title:"منسى بيملا أورشليم شر",
 hook:"ابن حزقيا بيهدّ كل حاجة، والحكم على يهوذا بيتنطق.",
 thread:"لما غزاة بابل جُم في الآخر أيام يهوياقيم، ملوك الثاني 24: 3–4 بيقول إن ده حصل بسبب خطايا منسى.",
 s:[
  ["ابن بيعكس اللي أبوه عمله",["منسى بيملك وهو عنده اتناشر سنة، وبيحكم خمسة وخمسين سنة في أورشليم.","بيرجّع بنا المرتفعات اللي أبوه حزقيا هدّها، وبيعمل مذابح للبعل وسارية، وبيسجد للنجوم.","بيبني مذابح وثنية جوه هيكل الرب، وبيعدّي ابنه في النار، وبيمارس السحر والعرافة وبيسأل الجان."]],
  ["صنم في بيت ربنا",["بيحط تمثال السارية في الهيكل، المكان اللي الرب قال إن اسمه هيبقى فيه للأبد.","الشعب ما سمعش. ومنسى خلّاهم يعملوا شر أكتر من الأمم اللي الرب أبادهم من قدام إسرائيل."]],
  ["الحكم بيتنطق",["الرب بيعلن على لسان أنبيائه مصيبة على أورشليم ويهوذا، كل اللي يسمع بيها ودانه تطنّ.","هيمسح أورشليم زي ما الواحد بيمسح الطبق، يمسحه ويقلبه على وشه.","وهيسيب بقية شعبه ويسلّمهم لإيد أعدائهم."]],
  ["دم بريء",["منسى كمان سفك دم بريء كتير جدًا، لحد ما ملا أورشليم بيه من أولها لآخرها."]],
  ["أسير بيصلي",["الرب كلّم منسى وشعبه، بس هم ما اهتموش.","قادة جيش ملك أشور مسكوه، وحطوا له خزامة في مناخيره، وربطوه بسلاسل نحاس، وودّوه بابل.","في ضيقه اتواضع جدًا وصلى. وربنا سمع له ورجّعه أورشليم، ومنسى عرف إن الرب هو الله."]],
  ["حكم لسه قايم",["بعد سنين، لما المصيبة وصلت يهوذا، سفر الملوك بيقول إنها جت بأمر الرب عشان يبعدهم من قدامه بسبب خطايا منسى.","وبيذكر الدم البريء اللي سفكه في أورشليم، واللي الرب ما رضيش يغفره."]]
 ]},
josiah:{date:"640 – 609 ق.م",title:"يوشيا، آخر إصلاح",
 hook:"ملك قلبه رقيق بيرجّع الشعب لربنا، بس المصيبة اتأجلت بس.",
 note:"ميلاد دانيال مش مكتوب. بما إنه اتاخد لبابل وهو شاب حوالي سنة 605 ق.م، فالأغلب إنه اتولد أيام حكم يوشيا.",
 s:[
  ["ملك صغير بيطلب ربنا",["يوشيا بيملك وهو عنده تمن سنين، وبيحكم واحد وتلاتين سنة.","بيعمل المستقيم في عينين الرب، وما بيحيدش يمين ولا شمال."]],
  ["سفر الشريعة بيتلاقى",["في السنة التمنتاشر من ملكه، وهم بيرمّموا الهيكل، حلقيا الكاهن العظيم بيلاقي سفر الشريعة في بيت الرب.","شافان الكاتب بيجيبه للملك وبيقراه قدامه."]],
  ["الملك بيشق هدومه",["لما يوشيا سمع كلام الشريعة، شق هدومه.","بيبعت رجالة يسألوا الرب، لأن غضب الرب مشتعل عليهم: آباؤهم ما سمعوش لكلام السفر ده."]],
  ["رد خلدة النبية",["خلدة النبية بتأكد: الرب هيجيب شر على المكان ده وعلى سكانه، كل اللي مكتوب في السفر.","وعشان قلب يوشيا رقّ واتواضع وبكى، هيندفن بسلام، وعينيه مش هتشوف المصيبة."]],
  ["عهد وتطهير",["يوشيا بيقرا السفر قدام كل الشعب وبيجدد العهد قدام الرب.","بيشيل الأصنام والمرتفعات والعرافين وآلهة البيوت من يهوذا وأورشليم.","بيعمل فصح ما اتعملش زيه من أيام القضاة. مفيش ملك قبله ولا بعده رجع للرب زيه بكل قلبه."]],
  ["بس الغضب لسه موجود",["مع كده، الرب ما رجعش عن غضبه الشديد على يهوذا، بسبب كل اللي منسى عمله.","الرب بيقول إنه هيبعد يهوذا من قدامه زي ما بعد إسرائيل، ويرفض أورشليم، المدينة اللي اختارها."]],
  ["موته في مجدّو",["فرعون نخو ملك مصر بيطلع ناحية نهر الفرات. يوشيا بيخرج يحاربه وبيتقتل في مجدّو.","عبيده بيجيبوا جثته أورشليم في مركبة. وسفر الأخبار بيقول إن إرميا رثاه.","شعب الأرض بيمسحوا ابنه يهوآحاز ملك."]]
 ]},
jehoiakim:{date:"609 ق.م",title:"مصر بتقعّد يهوياقيم على العرش",
 hook:"يهوذا بتخسر استقلالها، وملك دانيال 1: 1 بياخد مكانه.",
 thread:"ده يهوياقيم اللي اسمه مكتوب في أول آية في سفر دانيال.",
 s:[
  ["تلات شهور على العرش",["يهوآحاز بيملك وهو عنده تلاتة وعشرين سنة. بيحكم تلات شهور وبيعمل الشر في عينين الرب.","فرعون نخو بيقيّده في ربلة، وبيفرض على يهوذا غرامة ميت وزنة فضة ووزنة دهب."]],
  ["مصر هي اللي بتختار الملك",["نخو بيخلّي ألياقيم، ابن تاني ليوشيا، ملك مكان أبوه، وبيغيّر اسمه ليهوياقيم.","يهوآحاز بيتاخد لمصر، وبيموت هناك."]],
  ["أرض عليها ضرايب",["يهوياقيم بيدفع لفرعون الفضة والدهب اللي طلبهم.","وعشان يدفع، بيفرض ضريبة على الأرض وبيلمّ من الشعب، كل واحد على قد تقديره."]],
  ["حداشر سنة من الشر",["يهوياقيم بيملك وهو عنده خمسة وعشرين سنة، وبيحكم حداشر سنة في أورشليم.","بيعمل الشر في عينين الرب، زي ما آباؤه عملوا."]],
  ["حكم إرميا على الملك",["إرميا بيدينه إنه بنى قصره بالظلم، وشغّل جاره من غير أجرة.","أبوه يوشيا عمل العدل والحق ودافع عن الفقير، وكان خير له. الرب بيقول: «مش دي معرفتي؟»","عينين يهوياقيم وقلبه على المكسب الحرام بس، وعلى سفك الدم البريء، وعلى الظلم.","محدش هيبكي عليه. هيندفن دفنة حمار، مسحوب ومرمي برّه أبواب أورشليم."]]
 ]},
year605:{date:"605 – 604 ق.م",title:"كركميش، سبعين سنة، ودَرج محروق",
 hook:"بابل بتبقى القوة الأولى في العالم، وإرميا بيحدد رقم لمدة السبي.",
 thread:"بعد عشرات السنين، دانيال بيقرا نبوة السبعين سنة دي نفسها وبيحوّلها لصلاة (دانيال 9: 2).",
 s:[
  ["بابل بتهزم مصر",["في السنة الرابعة ليهوياقيم، نبوخذنصر ملك بابل بيهزم جيش فرعون نخو في كركميش على نهر الفرات."]],
  ["تلاتة وعشرين سنة تحذير",["في نفس السنة، أول سنة لنبوخذنصر، إرميا بيكلم كل شعب يهوذا.","بقاله تلاتة وعشرين سنة، من السنة التلاتاشر ليوشيا، كلمة الرب بتجيله وهو بيقولها مرة ورا مرة، وهم ما سمعوش.","الرب بعت كل عبيده الأنبياء بنفس الدعوة: ارجعوا عن طريقكم الردي واسكنوا في الأرض."]],
  ["«عبدي نبوخذنصر»",["عشان ما سمعوش، الرب هيبعت يجيب نبوخذنصر، اللي بيسميه «عبدي»، على الأرض دي.","صوت الفرح والبهجة، صوت العريس والعروسة، صوت الطاحونة ونور السراج، كله هيتشال.","الأرض كلها هتبقى خراب، والأمم دي هتخدم ملك بابل سبعين سنة."]],
  ["ميعاد بابل نفسها",["لما السبعين سنة يكملوا، الرب هيعاقب ملك بابل وأمته على ذنبهم.","كل اللي مكتوب في السفر ده على الأرض دي هييجي عليها."]],
  ["الدَّرج بيتكتب",["في السنة الرابعة ليهوياقيم، الرب بيقول لإرميا يكتب في دَرج كل الكلام اللي كلمه بيه من أيام يوشيا.","يمكن لما يهوذا يسمعوا بالشر اللي جاي، كل واحد يرجع عن طريقه الردي، والرب يغفر لهم.","باروخ بيكتب الكلام من بُق إرميا. وإرميا ممنوع يدخل الهيكل، فبيبعت باروخ يقرا الدَّرج هناك."]],
  ["الملك بيحرقه",["في السنة الخامسة، في يوم صوم، باروخ بيقرا الدَّرج في الهيكل. الرؤساء بيسمعوا وبيخافوا وبيودّوه للملك.","يهوياقيم قاعد في بيت الشتا وقدامه كانون نار. كل ما يتقرا تلات أو أربع أعمدة، بيقطعهم بالمطوة ويرميهم في النار، لحد ما الدَّرج كله اتحرق.","لا الملك ولا عبيده خافوا، ولا شقوا هدومهم. وأمر بالقبض على باروخ وإرميا، بس الرب خبّاهم."]],
  ["الكلام بيتكتب تاني",["الرب بيقول لإرميا ياخد دَرج تاني ويكتب فيه كل الكلام اللي كان في الأول.","باروخ بيكتبهم تاني، وبيتزاد عليهم كلام كتير زيهم.","يهوياقيم مش هيبقى له حد يقعد على كرسي داود."]],
  ["يهوياقيم بيبقى عبد لبابل",["في أيامه طلع نبوخذنصر ملك بابل، ويهوياقيم بقى عبد له تلات سنين."]]
 ]},
dan1:{date:"حوالي 605 – 602 ق.م",title:"السبي لبابل",
 hook:"شاب مسبي بيحط في قلبه قرار، وربنا بيديله نعمة وعلم ومكان قدام الملك.",
 note:"دانيال 1: 1 بيقول السنة التالتة ليهوياقيم، وإرميا 25: 1 بيسمي نفس الفترة السنة الرابعة. التفسير المعروف إن بابل ويهوذا كانوا بيحسبوا أول سنة في الحكم بطريقتين مختلفتين.",
 s:[
  ["أورشليم بتتحاصر",["في السنة التالتة ليهوياقيم ملك يهوذا، نبوخذنصر ملك بابل بييجي أورشليم وبيحاصرها.","الرب بيسلّم يهوياقيم لإيده، ومعاه بعض آنية بيت الله.","نبوخذنصر بياخدهم لأرض شنعار وبيحطهم في خزانة بيت إلهه."]],
  ["اختيار أحسن شباب يهوذا",["الملك بيأمر أشفنز رئيس خصيانه يجيب ناس من بني إسرائيل، من النسل الملكي ومن الأشراف.","شباب مفيهمش عيب، شكلهم حلو، فاهمين في كل حكمة، عندهم معرفة وفهم، ويقدروا يقفوا في قصر الملك.","يعلّمهم لغة الكلدانيين وكتابتهم. والملك بيحدد لهم نصيب كل يوم من أكله ومن خمره، وتلات سنين تدريب قبل ما يخدموا قدامه."]],
  ["أربع أسامي بتتغير",["كان منهم أربعة من يهوذا: دانيال وحننيا وميشائيل وعزريا.","رئيس الخصيان بيديهم أسامي جديدة: بلطشاصر وشدرخ وميشخ وعبدنغو."]],
  ["دانيال بيحط في قلبه",["دانيال بيحط في قلبه إنه ما يتنجسش بأكل الملك ولا بالخمر اللي بيشربه، وبيطلب إذن من رئيس الخصيان.","ربنا كان مدّي دانيال نعمة ورحمة قدام رئيس الخصيان.","بس الراجل خايف: «لو الملك شاف وشوشكم أضعف من الشباب اللي في سنكم، هتخلّوا راسي في خطر.»"]],
  ["امتحان العشر أيام",["دانيال بيكلم الحارس المسؤول عن الأربعة: «جرّب عبيدك عشر أيام. ادّينا خضار بس ناكله ومية نشربها.»","«وبعدين قارن شكلنا بشكل الشباب اللي بياكلوا أكل الملك، واعمل معانا حسب اللي تشوفه.»","بعد عشر أيام طلع شكلهم أحسن وأسمن من كل التانيين. فالحارس شال أكلهم الفاخر وخمرهم واداهم خضار."]],
  ["ربنا هو اللي بيدي العلم",["الأربع شباب دول ربنا اداهم معرفة وفهم في كل كتابة وحكمة.","ودانيال كان بيفهم كل الرؤى والأحلام."]],
  ["امتحان قدام الملك",["في آخر المدة، رئيس الخصيان بيدخّلهم كلهم قدام نبوخذنصر.","الملك بيتكلم معاهم وما بيلاقيش حد زي دانيال وحننيا وميشائيل وعزريا، فبيقفوا في خدمة الملك.","في كل أمر حكمة وفهم سألهم عنه، لقاهم أحسن عشر مرات من كل المجوس والسحرة اللي في مملكته."]],
  ["خدمة بتعيش أكتر من الإمبراطورية",["دانيال فضل هناك لحد السنة الأولى لكورش الملك."]]
 ]},
dan2:{date:"حوالي 603 ق.م",title:"حلم الملك اللي ما قالوش",
 hook:"حكم بالموت، وليلة صلاة، وتمثال بيحكي قصة الإمبراطوريات.",
 vision:{text:"دانيال بيقول للملك بوضوح: «إنت الراس الدهب» (2: 38). والحجر هو مملكة بيقيمها إله السما، وما بتنتهيش أبدًا (2: 44).",
  hist:"التلات ممالك التانيين مش مذكورين بالاسم في الأصحاح ده. الرأي عند أغلب المفسرين المحافظين إنهم مادي وفارس (الفضة)، واليونان (النحاس)، وروما (الحديد). وسفر دانيال نفسه بيدعم أول خطوتين: 5: 28 بيدي بابل لمادي وفارس، و8: 20–21 بيسمي مادي وفارس وبعدهم اليونان. والمسيحيين بيفهموا الحجر على إنه مملكة المسيح."},
 s:[
  ["حلم بيطيّر النوم من عين الملك",["في السنة التانية من ملكه، نبوخذنصر بيحلم أحلام. روحه بتنزعج والنوم بيطير منه.","بيستدعي المجوس والسحرة والعرافين والكلدانيين وبيقول: «حلمت حلم، وروحي منزعجة عايز أفهمه.»"]],
  ["طلب مستحيل",["الحكما بيردوا: «قول لعبيدك الحلم، واحنا نقول التفسير.»","الملك بيرفض. لازم هم اللي يقولوا له الحلم ومعناه. لو فشلوا هيتقطعوا حتت وبيوتهم تبقى خرابة. ولو نجحوا هياخدوا هدايا وكرامة عظيمة.","لما طلبوا تاني، اتهمهم إنهم بيكسبوا وقت ومتفقين يقولوا له كلام كدب لحد ما الحال يتغير."]],
  ["«مفيش حد على الأرض يقدر»",["الكلدانيين بيردوا إن مفيش ملك، مهما كان عظيم، طلب حاجة زي دي من أي مجوسي.","الآلهة بس هم اللي يقدروا يبيّنوها، وهم مش ساكنين مع البشر.","الملك بيغضب جدًا وبيأمر بإعدام كل حكما بابل. وبيدوّروا على دانيال وأصحابه عشان يقتلوهم."]],
  ["دانيال بيرد بحكمة",["دانيال بيكلم أريوخ رئيس حرس الملك بحكمة وعقل: «ليه أمر الملك شديد كده؟»","أريوخ بيشرح له، ودانيال بيدخل ويطلب من الملك وقت عشان يقول له التفسير."]],
  ["أربع أصحاب بيصلوا",["دانيال بيروح بيته وبيحكي لحننيا وميشائيل وعزريا.","بيطلب منهم يطلبوا رحمة من إله السما في السر ده، عشان ما يموتوش مع باقي الحكما.","وفي الليل السر بيتكشف لدانيال في رؤيا."]],
  ["دانيال بيبارك إله السما",["«ليكن اسم الله مبارك من الأزل وإلى الأبد، لأن له الحكمة والجبروت.»","هو بيغيّر الأوقات والأزمنة، بيعزل ملوك وينصّب ملوك، وبيكشف العمايق والأسرار.","دانيال بيشكر إله آبائه إنه اداه حكمة وعرّفه اللي طلبوه."]],
  ["«فيه إله في السما»",["دانيال بيطلب من أريوخ ما يهلكش الحكما، وأريوخ بيدخّله للملك بسرعة.","الملك بيسأل: «تقدر تعرّفني الحلم ومعناه؟»","دانيال بيرد إن مفيش حكيم يقدر يبيّن السر، «لكن فيه إله في السما بيكشف الأسرار.»","وبيضيف إن السر ما اتكشفش له عشان عنده حكمة أكتر من غيره."]],
  ["التمثال",["الملك شاف تمثال عظيم بيلمع: راسه دهب نقي، صدره ودراعاته فضة، بطنه وفخاده نحاس، رجليه حديد، وقدميه حديد على خزف.","حجر اتقطع، مش بإيد إنسان. خبط التمثال على قدميه وكسّرهم.","التمثال كله اتسحق وبقى زي العصافة في جرن الصيف، والريح شالته.","والحجر بقى جبل كبير وملا الأرض كلها."]],
  ["المعنى",["«إنت أيها الملك الراس الدهب ده.» إله السما اداله مملكة وقدرة وسلطان ومجد.","بعده هتقوم مملكة تانية أقل منه. وبعدين تالتة من نحاس تتسلط على كل الأرض. ورابعة قوية زي الحديد، بتسحق وتكسّر كل اللي قبلها.","القدمين الحديد والخزف مملكة منقسمة، جزء قوي وجزء هش، وناسها مش هيتماسكوا.","في أيام الملوك دول، إله السما هيقيم مملكة ما تنقرضش أبدًا ولا تتساب لشعب تاني. هتسحق كل الممالك دي وهي تثبت للأبد."]],
  ["الملك بيسجد",["نبوخذنصر بيقع على وشه قدام دانيال وبيقول: «حقًا إلهكم إله الآلهة ورب الملوك وكاشف الأسرار.»","بيخلّي دانيال حاكم على كل ولاية بابل ورئيس على كل حكماها.","وبطلب من دانيال، شدرخ وميشخ وعبدنغو بيتعيّنوا على شغل الولاية، ودانيال بيفضل في باب الملك."]]
 ]},
exile597:{date:"597 – 591 ق.م",title:"السبي التاني",
 hook:"ودانيال بيخدم في القصر، عشرة آلاف كمان بيوصلوا من أورشليم، ومنهم حزقيال.",
 note:"أغلب المفسرين المحافظين بيفهموا إن دانيال اللي حزقيال ذكره هو دانيال بتاع بابل، وإنه كان معروف وسط المسبيين ببره وحكمته.",
 s:[
  ["يهوياقيم بيتمرد",["بعد تلات سنين عبد لنبوخذنصر، يهوياقيم بيرجع ويتمرد عليه.","الرب بيبعت عليه غزاة من الكلدانيين والأراميين والموآبيين وبني عمون عشان يبيدوا يهوذا، زي ما قال على لسان عبيده الأنبياء."]],
  ["نهاية يهوياقيم",["نبوخذنصر بيطلع عليه وبيقيّده بسلاسل نحاس عشان ياخده لبابل.","وبياخد كمان من آنية بيت الرب لبابل وبيحطها في قصره هناك.","يهوياكين ابنه بيملك مكانه."]],
  ["تلات شهور وبعدين استسلام",["يهوياكين بيملك وهو عنده تمنتاشر سنة. بيحكم تلات شهور وبيعمل الشر في عينين الرب.","جيش نبوخذنصر بيحاصر أورشليم، وملك بابل نفسه بيوصل والحصار شغال.","يهوياكين بيخرج ويسلّم نفسه هو وأمه وعبيده ورؤساؤه وخصيانه. ودي كانت السنة التامنة لملك نبوخذنصر."]],
  ["أورشليم بتفضى من قوتها",["نبوخذنصر بياخد كل خزاين بيت الرب وبيت الملك، وبيكسّر آنية الدهب اللي سليمان عملها، زي ما الرب قال.","بيسبي عشرة آلاف: الرؤساء وجبابرة الحرب والصنايعية والحدادين.","ما فضلش غير مساكين شعب الأرض."]],
  ["ملك جديد واسم جديد",["ملك بابل بيخلّي متّنيا، عم يهوياكين، ملك مكانه.","وبيغيّر اسمه لصدقيا."]],
  ["رسالة إرميا للمسبيين",["إرميا بيبعت رسالة من أورشليم للشيوخ والكهنة والأنبياء وكل الشعب اللي اتسبى لبابل.","ابنوا بيوت واسكنوا فيها. ازرعوا جناين. اتجوزوا وخلّفوا بنين وبنات. اكتروا هناك وما تقلّوش.","اطلبوا سلام المدينة اللي الرب سباكم ليها وصلّوا عشانها، لأن بسلامها يبقى لكم سلام.","لما يكملوا سبعين سنة لبابل، الرب هيرجّعهم. أفكاره من ناحيتهم أفكار سلام مش شر، عشان يديهم آخرة ورجاء.","«وتطلبونني فتجدونني إذ تطلبونني بكل قلبكم.»"]],
  ["حزقيال بيشوف رؤى وسط المسبيين",["حزقيال الكاهن وسط المسبيين عند نهر خابور في أرض الكلدانيين.","في السنة الخامسة من سبي الملك يهوياكين، السموات بتتفتح وبيشوف رؤى الله."]],
  ["اسم دانيال جنب نوح وأيوب",["الرب بيقول لحزقيال إن لو أرض أخطأت له وبعت عليها دينونة، حتى نوح ودانيال وأيوب مش هيقدروا ينقذوها.","لو التلاتة دول كانوا فيها، هيخلّصوا نفسهم بس ببرّهم."]]
 ]},
dan3:{date:"السنة مش مذكورة",yr:"~590",title:"أتون النار",
 hook:"تلات رجالة بيرفضوا يسجدوا، وواحد رابع بيمشي معاهم في النار.",
 note:"الأصحاح ما بيذكرش سنة، ودانيال نفسه مش مذكور فيه. النص ما بيقولش هو كان فين. الأصحاح محطوط هنا عشان بييجي بعد أصحاح 2 في ملك نبوخذنصر.",
 s:[
  ["تمثال دهب في بقعة دورا",["نبوخذنصر بيعمل تمثال دهب، طوله ستين دراع وعرضه ست أدرع، وبينصبه في بقعة دورا.","بيستدعي المرازبة والشحن والولاة والقضاة والخزنة وكل حكام الولايات لتدشينه."]],
  ["اسجد أو اتحرق",["منادي بينادي: لما الشعوب والأمم والألسنة يسمعوا صوت القرن والناي والعود والرباب والسنطير والمزمار وكل أنواع العزف، لازم يخرّوا ويسجدوا للتمثال.","واللي ما يخرّش ويسجد، في ساعتها يترمي في أتون نار متقدة.","أول ما المزيكا اشتغلت، كل الشعوب خرّوا وسجدوا."]],
  ["اتهام تلات يهود",["رجالة كلدانيين اتقدموا واشتكوا على اليهود.","«فيه رجالة يهود إنت وكّلتهم على شغل ولاية بابل: شدرخ وميشخ وعبدنغو. دول ما عملوش لك اعتبار أيها الملك. آلهتك ما بيعبدوهاش، وتمثال الدهب ما بيسجدوش له.»"]],
  ["فرصة تانية",["نبوخذنصر بغضب شديد بيجيب التلات رجالة قدامه وبيسأل: «صحيح الكلام ده؟»","بيديهم فرصة تانية يسجدوا لما المزيكا تشتغل.","لو رفضوا، هيترموا في الأتون في ساعتها. «ومين هو الإله اللي ينقذكم من إيديا؟»"]],
  ["«وإلا فليكن معلومًا»",["بيردوا إنهم مش محتاجين يجاوبوه عن الأمر ده.","«إلهنا اللي بنعبده قادر ينجينا من أتون النار المتقدة، وهينقذنا من إيدك أيها الملك.»","«ولو ما حصلش، فليكن معلوم عندك إننا مش هنعبد آلهتك ولا هنسجد لتمثال الدهب اللي نصبته.»"]],
  ["سبع مرات أسخن",["نبوخذنصر بيمتلي غيظ ومنظر وشه بيتغير عليهم. بيأمر يحمّوا الأتون سبع مرات أكتر من العادة.","أقوى رجالة في جيشه بيربطوهم، وبيترموا بسراويلهم وأقمصتهم وأرديتهم وباقي لبسهم.","الأتون كان حامي لدرجة إن اللهيب قتل الرجالة اللي شالوهم. والتلاتة وقعوا مربوطين في وسط النار."]],
  ["أربع رجالة ماشيين في النار",["الملك بيقوم بسرعة مذهول وبيسأل مشيريه: «مش احنا رمينا تلات رجالة مربوطين في النار؟»","«أنا شايف أربع رجالة محلولين ماشيين في وسط النار وما فيهمش ضرر، ومنظر الرابع شبه ابن الآلهة.»"]],
  ["«اخرجوا!»",["نبوخذنصر بيقرّب من باب الأتون وبينادي: «يا عبيد الله العلي، اخرجوا وتعالوا!»","الرؤساء بيتلمّوا حواليهم وبيشوفوا إن النار ما كانش ليها قوة على أجسامهم.","شعرة من راسهم ما اتحرقتش، هدومهم ما اتغيرتش، وريحة النار ما جتش عليهم."]],
  ["أمر الملك",["«تبارك إله شدرخ وميشخ وعبدنغو، اللي بعت ملاكه وأنقذ عبيده.»","هم اتكلوا عليه، وخالفوا كلمة الملك، وسلّموا أجسادهم عشان ما يعبدوش ولا يسجدوا لإله غير إلههم.","بيأمر إن أي حد يتكلم غلط على إلههم يتقطع حتت، «لأن مفيش إله تاني يقدر ينجي كده.» وبعدين بيرقّي التلات رجالة في ولاية بابل."]]
 ]},
fall586:{date:"588 – 586 ق.م",title:"أورشليم بتقع والهيكل بيتحرق",
 hook:"المدينة اللي دانيال بيصلي ناحيتها بتتهدّ، وسبعين سنة راحة للأرض بيبدأوا.",
 thread:"دي الخرايب اللي دانيال بيعترف وبيتوسل عشانها في دانيال 9.",
 s:[
  ["صدقيا ما بيتواضعش",["صدقيا بيملك وهو عنده واحد وعشرين سنة، وبيحكم حداشر سنة.","ما بيتواضعش قدام إرميا النبي، وبيتمرد على نبوخذنصر اللي حلّفه بالله.","الرؤساء والكهنة والشعب بيزوّدوا الخيانة وبينجّسوا الهيكل.","الرب بيبعت لهم رسله مرة ورا مرة عشان شفق على شعبه. وهم بيهزّأوهم وبيحتقروا كلامه، لحد ما ما بقاش فيه علاج."]],
  ["الحصار",["في السنة التاسعة لصدقيا، في عاشر يوم من الشهر العاشر، نبوخذنصر بييجي بكل جيشه وبيبني أبراج حوالين أورشليم.","المدينة بتفضل محاصرة لحد السنة الحداشر لصدقيا.","في تاسع يوم من الشهر الرابع، الجوع اشتد لدرجة إن ما بقاش فيه أكل للشعب."]],
  ["السور بيتفتح",["سور المدينة بيتفتح، وكل رجالة الحرب بيهربوا بالليل.","الكلدانيين بيجروا ورا الملك وبيمسكوه في سهول أريحا. وبياخدوه لملك بابل في ربلة.","بيقتلوا ولاد صدقيا قدام عينيه. وبعدين بيقلعوا عينيه، وبيقيّدوه بسلاسل نحاس، وبياخدوه لبابل."]],
  ["الهيكل بيتحرق",["في الشهر الخامس، في السنة التسعتاشر لنبوخذنصر، نبوزرادان رئيس الشرطة بييجي أورشليم.","بيحرق بيت الرب وبيت الملك وكل بيوت أورشليم.","والجيش بيهدّ أسوار المدينة."]],
  ["الشعب بيتسبي",["نبوزرادان بيسبي بقية الشعب اللي فضلوا في المدينة، واللي هربوا لملك بابل.","وبيسيب من مساكين الأرض ناس يشتغلوا في الكروم والغيطان."]],
  ["الهيكل بيتجرّد",["الكلدانيين بيكسّروا أعمدة النحاس والقواعد وبحر النحاس، وبياخدوا النحاس لبابل.","وبياخدوا القدور والرفوش والصحون وكل اللي من دهب وفضة."]],
  ["الأرض بتستوفي سبوتها",["اللي نجوا من السيف بيتسبوا لبابل، وبيبقوا عبيد للملك ولولاده لحد ما مملكة فارس تملك.","الأرض بتستوفي سبوتها. كل أيام خرابها بتستريح، لحد ما السبعين سنة يكملوا، عشان يتم كلام الرب بفم إرميا."]]
 ]},
dan4:{date:"السنة مش مذكورة، في آخر حكمه",yr:"~570",title:"الملك اللي بقى زي الحيوان",
 hook:"نبوخذنصر بيحكي بكلامه هو إزاي العلي نزّله ورفعه.",
 s:[
  ["رسالة مفتوحة من ملك",["نبوخذنصر بيكتب لكل الشعوب والأمم والألسنة اللي في الأرض كلها.","عايز يحكي لهم عن الآيات والعجايب اللي الله العلي عملها معاه.","«ملكوته ملكوت أبدي، وسلطانه إلى دور فدور.»"]],
  ["خوف في القصر",["كان مستريح في بيته ومبسوط في قصره، لما حلم خوّفه.","المجوس والسحرة والكلدانيين والمنجمين جُم، بس ما قدروش يفسّروه.","في الآخر دخل دانيال، اللي اسمه بلطشاصر. الملك بيقول إن فيه روح الآلهة القدوسين، وإن مفيش سر يصعب عليه."]],
  ["الشجرة العظيمة",["شاف شجرة في وسط الأرض، كبيرة وقوية، علوها واصل السما ومنظرها لآخر الأرض.","ورقها جميل وثمرها كتير، وفيها أكل للكل.","حيوانات البر بتستضل تحتها، والطيور ساكنة في أغصانها."]],
  ["أمر الساهر",["ساهر وقدوس بينزل من السما وبينادي: «اقطعوا الشجرة وقصّوا أغصانها. انثروا ورقها وبعزقوا ثمرها.»","بس أصل جذورها يتساب في الأرض، بقيد من حديد ونحاس، في عشب الحقل.","يتبلّ بندى السما ويعيش مع الحيوانات. قلبه يتغير من قلب إنسان لقلب حيوان، لحد ما تعدّي عليه سبع أزمنة.","والهدف مذكور: عشان الأحياء يعرفوا إن العلي متسلط في مملكة الناس، وبيديها للي هو عايزه."]],
  ["دانيال بيتلخبط",["دانيال بيتحيّر ساعة، وأفكاره بتفزعه.","الملك بيقول له ما يخليش الحلم ولا تفسيره يفزعه.","دانيال بيرد: «يا سيدي، ياريت الحلم لمبغضيك وتفسيره لأعدائك!»"]],
  ["«إنت أيها الملك الشجرة دي»",["الشجرة هي الملك: كبر وقوي، وسلطانه وصل لآخر الأرض.","هيتطرد من بين الناس ويسكن مع حيوانات البر. هياكل عشب زي التيران ويتبلّ بالندى.","سبع أزمنة هتعدّي عليه لحد ما يعرف إن العلي متسلط في مملكة الناس.","وأصل الشجرة اتساب: مملكته هترجع له لما يعرف إن السما هي اللي بتحكم."]],
  ["نصيحة دانيال",["«لذلك أيها الملك، فلتكن مشورتي مقبولة عندك.»","يفارق خطاياه بالبر، وآثامه بالرحمة للمساكين.","يمكن اطمئنانه يطول."]],
  ["بعد اتناشر شهر",["الملك كان بيتمشى على سطح قصر مملكة بابل.","بيقول: «مش دي بابل العظيمة اللي أنا بنيتها لبيت الملك، بقوة اقتداري ولجلال مجدي؟»","والكلمة لسه في بُقه، نزل صوت من السما: «المُلك زال عنك.»","في ساعتها الكلام اتحقق. اتطرد من بين الناس وكل عشب زي التيران. جسمه اتبلّ بالندى، وشعره طول زي ريش النسور وضوافره زي مخالب الطيور."]],
  ["بيرفع عينيه للسما",["في آخر المدة، نبوخذنصر رفع عينيه للسما، وعقله رجع له.","بارك العلي وسبّح وحمد الحي إلى الأبد.","«هو بيعمل زي ما هو عايز في جند السما وسكان الأرض. ومفيش حد يمنع إيده أو يقول له: إنت بتعمل إيه؟»"]],
  ["رجع واتواضع",["عقله وجلال مملكته ومجده وبهاؤه رجعوا له. مشيروه وعظماؤه طلبوه، واتثبّت على مملكته وازداد عظمة.","«فالآن أنا نبوخذنصر أسبّح وأعظّم وأحمد ملك السما، اللي كل أعماله حق وطرقه عدل.»","«واللي بيسلكوا بالكبرياء هو قادر يذلّهم.»"]]
 ]},
jehoiachin:{date:"حوالي 561 ق.م",title:"ملك جديد بيرفع راس يهوياكين",
 hook:"بعد نبوخذنصر، ملك يهوذا المسبي بيخرج من السجن.",
 note:"التاريخ بيسجل إن نبوخذنصر مات سنة 562 ق.م وجه بعده ابنه أويل مرودخ. وسفر دانيال ساكت عن السنين اللي بين أصحاح 4 وحكم بيلشاصر.",
 s:[
  ["خروج من السجن",["في السنة السبعة وتلاتين لسبي يهوياكين ملك يهوذا، أويل مرودخ بقى ملك بابل.","وفي السنة دي خرّج يهوياكين من السجن."]],
  ["كرسي فوق كراسي الملوك",["كلّمه بخير وخلّى كرسيه فوق كراسي الملوك اللي معاه في بابل.","يهوياكين غيّر هدوم سجنه وبقى ياكل دايمًا على سفرة الملك كل أيام حياته.","والملك خصص له مصروف دايم، نصيب كل يوم بيومه، طول ما هو عايش."]]
 ]},
dan7:{date:"حوالي 553 ق.م",title:"أربع حيوانات والقديم الأيام",
 hook:"أول رؤيا لدانيال نفسه: إمبراطوريات طالعة من البحر، ومحكمة قاعدة في السما.",
 vision:{text:"الأربع حيوانات هم أربع ملوك، أو ممالك، بيقوموا على الأرض (7: 17، 23). المحكمة بتاخد سلطان آخر حاكم، والمملكة بتتدّي لشعب قديسي العلي للأبد (7: 26–27).",
  hist:"أغلب المفسرين المحافظين بيقروها على إنها نفس الأربع إمبراطوريات بتوع التمثال في أصحاح 2: بابل، ومادي وفارس، واليونان، وروما. الأربع روس بتوع النمر ماشيين مع تقسيم إمبراطورية اليونان لأربعة بعد الإسكندر. والقرن الصغير بيتفهم عند كتير على إنه حاكم أخير بيقاوم ربنا، مع اختلاف الآراء في التفاصيل. وفي الأناجيل، يسوع بيطبّق على نفسه لقب «ابن الإنسان آتيًا على سحاب السماء» (متى 26: 64)."},
 s:[
  ["حلم بيتكتب",["في السنة الأولى لبيلشاصر ملك بابل، دانيال شاف حلم ورؤى راسه وهو على سريره.","وكتب الحلم وحكى راس الكلام."]],
  ["أربع حيوانات طالعة من البحر",["أربع رياح السما هجمت على البحر الكبير.","وطلع من البحر أربع حيوانات عظيمة، كل واحد مختلف عن التاني."]],
  ["الأسد والدب والنمر",["الأول زي الأسد وله جناحين نسر. جناحيه اتنتفوا، واتوقّف على رجلين زي إنسان، واتدّى قلب إنسان.","التاني شبه الدب، مرفوع على جنب واحد، وفي بُقه تلات ضلوع. واتقال له: «قوم كُل لحم كتير!»","التالت زي النمر وعلى ضهره أربع جناحات طير، وله أربع روس. واتدّى سلطان."]],
  ["الحيوان الرابع",["الرابع هايل وقوي وشديد جدًا، وله سنان كبيرة من حديد. بياكل ويسحق ويدوس الباقي برجليه.","مختلف عن كل اللي قبله، وله عشر قرون.","وطلع بينهم قرن صغير، واتقلع قدامه تلاتة من القرون الأولانية. فيه عيون زي عيون إنسان وبُق بيتكلم بعظايم."]],
  ["القديم الأيام بيقعد",["اتحطت عروش، وقعد القديم الأيام. لبسه أبيض زي التلج، وشعر راسه زي الصوف النقي.","عرشه لهيب نار وعجلاته نار متقدة. ونهر نار جاري وخارج من قدامه.","ألوف ألوف بتخدمه، وربوات ربوات واقفين قدامه. القضا قعد، والأسفار اتفتحت."]],
  ["الحيوان بيتحاكم",["دانيال فضل يتفرج بسبب صوت الكلام العظيم اللي القرن بيقوله.","الحيوان اتقتل وجسمه هلك واترمى لوقيد النار.","وباقي الحيوانات اتشال منهم سلطانهم، بس اتدّوا طول حياة لزمان ووقت."]],
  ["مثل ابن إنسان",["دانيال شاف مثل ابن إنسان جاي مع سحب السما. وصل للقديم الأيام وقرّبوه قدامه.","اتدّى سلطان ومجد وملكوت، عشان كل الشعوب والأمم والألسنة تتعبد له.","سلطانه سلطان أبدي ما يزولش، وملكوته ما ينقرضش."]],
  ["دانيال بيسأل عن المعنى",["روح دانيال حزنت، ورؤى راسه أفزعته. قرّب من واحد من الواقفين وسأله عن الحقيقة.","الأربع حيوانات العظيمة هم أربع ملوك هيقوموا على الأرض.","بس قديسين العلي هياخدوا المملكة ويمتلكوها للأبد."]],
  ["أكتر عن الحيوان الرابع",["دانيال عايز يعرف عن الحيوان الرابع، وعن العشر قرون، وعن القرن التاني اللي منظره أشد من أصحابه.","وهو بيتفرج، القرن ده كان بيحارب القديسين وغلبهم، لحد ما جه القديم الأيام والحكم اتدّى للقديسين.","الحيوان الرابع مملكة رابعة مختلفة عن كل الممالك، هتاكل الأرض كلها. العشر قرون عشر ملوك، وبعدهم يقوم واحد تاني ويذل تلات ملوك.","هيتكلم ضد العلي، ويبلي قديسيه، ويظن إنه يغيّر الأوقات والسنّة. وهيتسلّموا لإيده لزمان وأزمنة ونص زمان."]],
  ["الحكم الأخير",["القضا هيقعد، وهينزعوا منه سلطانه عشان يفنى ويبيد للنهاية.","المملكة والسلطان وعظمة الممالك اللي تحت كل السما هتتدّي لشعب قديسي العلي.","أفكار دانيال أفزعته جدًا ووشه اتغير، بس حفظ الأمر في قلبه."]]
 ]},
dan8:{date:"حوالي 551 ق.م",title:"الكبش والتيس",
 hook:"رؤيا تانية، والمرة دي الممالك مذكورة بالاسم.",
 vision:{text:"جبرائيل بيسمّي الممالك: الكبش أبو قرنين هو ملوك مادي وفارس، والتيس هو ملك اليونان، والقرن العظيم هو الملك الأول (8: 20–21). والأربع قرون أربع ممالك هتقوم من أمته (8: 22).",
  hist:"الإسكندر الأكبر غزا فارس بين سنة 334 و331 ق.م، ومات سنة 323 ق.م وهو في عز قوته. وإمبراطوريته اتقسمت بين أربعة من قواده. والقرن الصغير بيتفهم عند كتير على إنه أنطيوخس الرابع إبيفانس (175–164 ق.م)، اللي وقّف ذبايح الهيكل ونجّس المقدس سنة 167 ق.م. الهيكل اتدشن من تاني سنة 164 ق.م، وأنطيوخس مات بمرض، مش في حرب."},
 s:[
  ["رؤيا في شوشن",["في السنة التالتة لملك بيلشاصر، دانيال شاف رؤيا تانية، بعد اللي ظهرت له في الأول.","في الرؤيا شاف نفسه في شوشن القصر في ولاية عيلام، عند نهر أولاي."]],
  ["كبش بقرنين",["كبش واقف عند النهر وله قرنين طوال. واحد أطول من التاني، والأطول طلع في الآخر.","بينطح ناحية الغرب والشمال والجنوب. مفيش حيوان يقف قدامه، ومفيش منقذ من إيده.","عمل اللي على كيفه وعظم."]],
  ["تيس جاي من الغرب",["تيس له قرن واضح بين عينيه جه من الغرب، على وش كل الأرض ومن غير ما يلمس الأرض.","هجم على الكبش بشدة قوته، وضربه وكسّر قرنيه.","الكبش ما كانش فيه قوة. التيس رماه على الأرض وداسه، وما كانش للكبش منقذ."]],
  ["القرن العظيم بيتكسر",["التيس عظم جدًا، بس وهو في عز قوته القرن العظيم اتكسر.","وطلع مكانه أربع قرون واضحة ناحية رياح السما الأربعة."]],
  ["قرن صغير بيكبر",["من واحد منهم طلع قرن صغير، وعظم جدًا ناحية الجنوب والشرق وفخر الأراضي.","كبر لحد جند السما، ورمى من الجند ومن النجوم على الأرض وداسهم.","اتعظم لحد رئيس الجند. شال المحرقة الدايمة، ومسكن مقدسه اتهدّ.","طرح الحق على الأرض، وعمل ونجح."]],
  ["«إلى متى؟»",["دانيال سمع قدوس بيسأل قدوس تاني الرؤيا هتاخد قد إيه: المحرقة الدايمة، ومعصية الخراب، ودوس القدس.","والجواب: ألفين وتلتمية صباح ومسا. وبعدين القدس يتبرّأ."]],
  ["جبرائيل بيتبعت",["ودانيال بيحاول يفهم، وقف قدامه واحد شبه منظر راجل.","وصوت إنسان نادى من بين أولاي: «يا جبرائيل، فهّم الراجل ده الرؤيا.»","دانيال خاف ووقع على وشه. وجبرائيل قال: «افهم يا ابن آدم إن الرؤيا لوقت المنتهى.»","دانيال وقع في نوم تقيل ووشه على الأرض. فلمسه جبرائيل ووقّفه على رجليه."]],
  ["الممالك بتتسمّى",["الكبش أبو قرنين هو ملوك مادي وفارس.","التيس أبو شعر هو ملك اليونان، والقرن العظيم اللي بين عينيه هو الملك الأول.","والأربع قرون اللي قاموا مكانه أربع ممالك هتقوم من أمته، بس مش بقوته."]],
  ["الملك الجافي الوش",["في آخر مملكتهم هيقوم ملك جافي الوش وفاهم الحيل.","قوته هتعظم، بس مش بقوته هو. هيهلك هلاك عجيب، ويبيد العظما وشعب القديسين.","بحيلته هينجّح المكر في إيده، ويتعظم في قلبه. وهيقوم حتى على رئيس الرؤساء.","بس هينكسر من غير إيد إنسان."]],
  ["دانيال بيتهدّ",["رؤيا المسا والصباح حق، بس دانيال يكتم الرؤيا، لأنها لأيام كتيرة.","دانيال ضعف وعيي كام يوم. وبعدين قام وباشر شغل الملك.","كان متحيّر من الرؤيا، ومحدش فاهمها."]]
 ]},
dan5:{date:"539 ق.م",title:"الكتابة على الحيطة",
 hook:"وليمة، وإيد، وتلات كلمات، وبابل بتقع في نفس الليلة.",
 note:"التاريخ بيحدد سقوط بابل في أكتوبر 539 ق.م. والسجلات البابلية بتبيّن إن بيلشاصر كان بيحكم المدينة بالنيابة عن أبوه نبونيد، وده ماشي مع عرض المركز التالت في المملكة. وكلمة «أب» في الأصحاح ده ممكن تبقى معناها جد أو ملك سابق.",
 s:[
  ["وليمة لألف",["بيلشاصر الملك بيعمل وليمة عظيمة لألف من عظمائه وبيشرب خمر قدامهم.","وهو بيشرب، بيأمر يجيبوا آنية الدهب والفضة اللي نبوخذنصر خدها من الهيكل اللي في أورشليم.","الملك وعظماؤه وزوجاته وسراريه بيشربوا بيها، وبيسبّحوا آلهة الدهب والفضة والنحاس والحديد والخشب والحجر."]],
  ["الإيد",["في الساعة دي ظهرت أصابع إيد إنسان، وكتبت على بياض حيطة قصر الملك، قصاد المنارة.","والملك شايف طرف الإيد وهي بتكتب.","وشه اتغير، ورجليه سابت، وركبه خبطت في بعض."]],
  ["الحكما بيفشلوا",["الملك بيصرخ يجيبوا السحرة والكلدانيين والمنجمين.","اللي يقرا الكتابة ويبيّن تفسيرها هيلبس أرجوان، وطوق دهب في رقبته، ويبقى تالت واحد متسلط في المملكة.","كل حكما الملك ما قدروش يقروا الكتابة ولا يعرّفوه تفسيرها. بيلشاصر فزع أكتر، وعظماؤه اتلخبطوا."]],
  ["الملكة بتفتكر دانيال",["الملكة سمعت الكلام ودخلت بيت الوليمة.","«في مملكتك راجل فيه روح الآلهة القدوسين.» في أيام نبوخذنصر اتلقى فيه نور وفطنة وحكمة.","نبوخذنصر خلّاه كبير المجوس. «فلينادوا دانيال، وهو هيبيّن التفسير.»"]],
  ["دانيال بيرفض المكافأة",["الملك بيسأل: «إنت دانيال اللي من بني سبي يهوذا، اللي جابه أبويا الملك من يهوذا؟»","وبيكرر عرض الأرجوان وطوق الدهب والمركز التالت في المملكة.","دانيال بيرد: «عطاياك خلّيها لك، وهداياك اديها لغيري. بس أنا هقرا الكتابة للملك.»"]],
  ["الدرس اللي بيلشاصر طنّشه",["الله العلي ادّى نبوخذنصر ملكوت وعظمة وجلال وبهاء.","لما قلبه اتكبّر، نزل عن كرسي ملكه، واتطرد من بين الناس وكل عشب زي التيران، لحد ما عرف إن الله العلي متسلط.","«وإنت يا بيلشاصر ابنه ما وضعتش قلبك، مع إنك عرفت كل ده.»","اتعظم على رب السما، وشرب بآنية بيته، وسبّح آلهة ما بتشوفش ولا بتسمع. والله اللي في إيده نسمته وكل طرقه ما مجّدهوش."]],
  ["منا منا تقيل وفرسين",["منا: ربنا أحصى ملكوته وأنهاه.","تقيل: اتوزن بالموازين واتلقى ناقص.","فرس: مملكته اتقسمت واتدّت لمادي وفارس."]],
  ["في نفس الليلة",["بأمر بيلشاصر، دانيال بيلبس أرجوان وطوق دهب في رقبته، وبينادوا إنه التالت المتسلط في المملكة.","في نفس الليلة اتقتل بيلشاصر ملك الكلدانيين.","وداريوس المادي خد المملكة، وهو عنده حوالي اتنين وستين سنة."]]
 ]},
dan9:{date:"حوالي 539 – 538 ق.م",title:"صلاة دانيال والسبعين أسبوع",
 hook:"دانيال بيقرا إرميا، وبيعترف عن شعبه، وجبرائيل بيوصل قبل ما يخلّص.",
 vision:{text:"سبعين «أسبوع» اتحددوا على شعب دانيال والمدينة المقدسة، بست أهداف بتنتهي بالبر الأبدي (9: 24). المسيح بييجي بعد تسعة وستين أسبوع وبعدين بيتقطع، والمدينة والقدس بيتخربوا (9: 25–26).",
  hist:"الأسابيع بتتفهم في العموم على إنها أسابيع سنين، يعني 490 سنة. مفسرين محافظين كتير بيحسبوا التسعة وستين أسبوع من أمر فارسي بتجديد أورشليم (عزرا 7 أو نحميا 2) لحد مجي يسوع المسيح، وبيشوفوا صلبه في قطع المسيح، وخراب أورشليم على إيد الرومان سنة 70 م في خراب المدينة والقدس. والآراء مختلفة في الأسبوع الأخير: فيه اللي شايفه اتحقق في القرن الأول، وكتير شايفينه لسه في المستقبل. ويسوع اتكلم عن «رجسة الخراب التي قال عنها دانيال النبي» (متى 24: 15)."},
 s:[
  ["دانيال بيقرا إرميا",["دي السنة الأولى لداريوس بن أحشويروش، من نسل الماديين، اللي اتملّك على مملكة الكلدانيين.","دانيال فهم من الكتب، حسب كلمة الرب لإرميا، إن خراب أورشليم هيكمل سبعين سنة."]],
  ["صوم ومسح ورماد",["فدانيال وجّه وشه للرب الإله، وطلب بالصلاة والتضرعات، بالصوم والمسح والرماد.","صلى واعترف: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وحافظي وصاياه.»"]],
  ["«أخطأنا»",["«أخطأنا وأثمنا وعملنا الشر وتمردنا.» ما سمعوش للأنبياء اللي كلموهم باسم ربنا.","«لك يا سيد البر، أما لنا فخزي الوجوه»: رجالة يهوذا وسكان أورشليم وكل إسرائيل، القريبين والبعيدين.","كل إسرائيل تعدّى على شريعته، فاتصبّت عليهم اللعنة المكتوبة في شريعة موسى."]],
  ["ربنا عمل اللي قاله",["هو أقام كلامه اللي اتكلم بيه عليهم وجاب عليهم شر عظيم. ما اتعملش تحت السموات كلها زي اللي اتعمل في أورشليم.","ومع كده ما اتضرعوش لوجه الرب عشان يرجعوا عن آثامهم ويفطنوا لحقه.","«الرب إلهنا بار في كل أعماله اللي عملها.»"]],
  ["توسل عشان المدينة",["دانيال بيتوسل للإله اللي خرّج شعبه من مصر بإيد قوية: اصرف غضبك عن أورشليم، جبل قدسك.","«أضئ بوجهك على مقدسك الخرب.»","«مش لأجل برّنا بنطرح تضرعاتنا قدامك، لكن لأجل مراحمك العظيمة.»","«يا سيد اسمع. يا سيد اغفر. يا سيد أصغِ واصنع. لا تؤخر من أجل نفسك يا إلهي.»"]],
  ["جبرائيل بيوصل في نص الصلاة",["ودانيال لسه بيتكلم وبيصلي وبيعترف، جبرائيل جاله طاير بسرعة، عند وقت تقدمة المسا.","«يا دانيال، أنا خرجت دلوقتي عشان أعلّمك الفهم.»","«في أول تضرعاتك خرج الأمر، وأنا جيت أخبّرك، لأنك إنت محبوب.»"]],
  ["سبعين أسبوع اتحددوا",["سبعين أسبوع اتحددوا على شعب دانيال وعلى مدينته المقدسة.","الهدف: تكميل المعصية، وتتميم الخطايا، وكفارة الإثم، وإنه يتجاب البر الأبدي، وختم الرؤيا والنبوة، ومسح قدوس القدوسين."]],
  ["لحد المسيح الرئيس",["من خروج الأمر بتجديد أورشليم وبناها لحد المسيح الرئيس، سبع أسابيع واتنين وستين أسبوع.","المدينة هترجع وتتبني بسوق وخليج، بس في ضيق الأزمنة."]],
  ["بيتقطع، ومدينة بتتخرب",["بعد الاتنين وستين أسبوع، المسيح بيتقطع وليس له.","وشعب رئيس آتٍ بيخرب المدينة والقدس. انتهاؤه بغمارة، وحرب وخرب لحد النهاية.","وبيثبّت عهد مع كتيرين في أسبوع واحد، وفي نص الأسبوع بيبطّل الذبيحة والتقدمة.","وعلى جناح الأرجاس مخرِّب، لحد ما يتم ويتصبّ المقضي على المخرِّب."]]
 ]},
dan6:{date:"حوالي 538 ق.م، السنة مش مذكورة",title:"جب الأسود",
 hook:"قانون معمول ضد صلاة راجل واحد، وليلة وسط الأسود، وأمر من الملك.",
 note:"الأصحاح ما بيذكرش سنة. ولو حسبنا من وصوله لبابل وهو شاب حوالي 605 ق.م، دانيال يبقى عدّى التمانين في الوقت ده.",
 s:[
  ["دانيال بيتميز",["داريوس بيعيّن مية وعشرين مرزبان على المملكة كلها، وعليهم تلات وزرا. ودانيال واحد من التلاتة.","دانيال اتفوّق عليهم لأن فيه روح فاضلة، والملك فكّر يولّيه على المملكة كلها."]],
  ["مفيش عيب يتلاقى",["الوزرا والمرازبة بيدوّروا على علّة على دانيال من ناحية شغل المملكة.","ما قدروش يلاقوا علّة ولا ذنب، لأنه كان أمين ومفيش فيه خطأ ولا ذنب.","فقالوا: «مش هنلاقي على دانيال ده علّة، إلا لو لقيناها من ناحية شريعة إلهه.»"]],
  ["الفخ",["بيدخلوا للملك مجموعة وبيقولوا إن كل الرؤسا اتفقوا على أمر.","أي حد يطلب طلبة من أي إله أو إنسان لمدة تلاتين يوم، غير من الملك، يترمي في جب الأسود.","بيطلبوا منه يمضي الكتابة عشان ما تتغيرش، زي شريعة مادي وفارس اللي ما بتتنسخش. وداريوس بيمضي."]],
  ["شبابيك مفتوحة ناحية أورشليم",["لما دانيال عرف إن الكتابة اتمضت، راح بيته، وشبابيك عُليته مفتوحة ناحية أورشليم.","وتلات مرات في اليوم بيركع على ركبه ويصلي ويحمد قدام إلهه، زي ما كان بيعمل قبل كده."]],
  ["اتمسك وهو بيصلي",["الرجالة راحوا مجموعة ولقوا دانيال بيطلب وبيتضرع قدام إلهه.","راحوا للملك وفكّروه بأمره. وهو أكد إن الأمر ثابت وما بيتنسخش.","فقالوا: «دانيال اللي من بني سبي يهوذا ما عملش لك اعتبار أيها الملك، ولا للأمر اللي مضيته. لسه بيطلب طلبته تلات مرات في اليوم.»"]],
  ["ملك واقع في قانونه",["لما الملك سمع الكلام ده اغتاظ على نفسه جدًا. حط قلبه على دانيال عشان ينجيه، واجتهد لحد غروب الشمس عشان ينقذه.","الرجالة رجعوا وفكّروه إن كل نهي أو أمر الملك بيحطه ما بيتغيرش."]],
  ["في الجب",["الملك أمر، فجابوا دانيال ورموه في جب الأسود. والملك قال له: «إلهك اللي بتعبده دايمًا هو ينجيك!»","اتحط حجر على بُق الجب، والملك ختمه بختمه وختم عظمائه.","الملك رجع قصره وبات صايم، وما دخّلوش قدامه أي تسلية. والنوم طار منه."]],
  ["مع أول نور",["في الفجر، مع أول نور، الملك قام وراح بسرعة لجب الأسود.","نادى بصوت حزين: «يا دانيال عبد الله الحي، هل إلهك اللي بتعبده دايمًا قدر ينجيك من الأسود؟»","دانيال رد: «أيها الملك عِش إلى الأبد! إلهي بعت ملاكه وسد بُق الأسود.»","«ما ضرّونيش، لأني اتلقيت بريء قدامه. وقدامك كمان أيها الملك ما عملتش ذنب.»"]],
  ["طلع من غير جرح",["الملك فرح جدًا وأمر يطلّعوا دانيال من الجب.","ما اتلقاش فيه أي ضرر، لأنه آمن بإلهه.","والرجالة اللي اشتكوا على دانيال اترموا في الجب هم وولادهم وستاتهم. والأسود مسكتهم وسحقت عضمهم قبل ما يوصلوا لقاع الجب."]],
  ["أمر داريوس",["داريوس بيكتب لكل الشعوب والأمم والألسنة: في كل سلطان مملكته الناس لازم يرتعدوا ويخافوا قدام إله دانيال.","«هو الإله الحي القيوم إلى الأبد. ملكوته ما يزولش. هو بينجي وينقذ. هو اللي نجّى دانيال من إيد الأسود.»","ودانيال نجح في ملك داريوس وفي ملك كورش الفارسي."]]
 ]},
cyrus:{date:"حوالي 538 ق.م",title:"كورش بيرجّع المسبيين",
 hook:"السبعين سنة بيخلصوا، والآنية اللي اتاخدت في دانيال 1 بترجع أورشليم.",
 thread:"آنية الهيكل اللي اتاخدت في دانيال 1: 2 بتتعدّ وترجع في عزرا 1: 7–11.",
 s:[
  ["اسمه اتقال من قبلها",["على لسان إشعياء، الرب قال عن كورش: «راعيّ، فكل مسرتي يتمم.» وهيقول عن أورشليم: «ستُبنى»، وللهيكل: «ستؤسَّس.»","الرب بيسمي كورش مسيحه، اللي ماسك بيمينه عشان يدوس قدامه أمم.","بيدعيه باسمه عشان إسرائيل مختاره، مع إن كورش ما يعرفوش."]],
  ["الرب بينبّه قلب ملك",["في السنة الأولى لكورش ملك فارس، الرب نبّه روح كورش، عشان يتم كلام الرب بفم إرميا.","كورش أطلق ندا في كل مملكته، وكمان بالكتابة."]],
  ["الأمر",["«الرب إله السما اداني كل ممالك الأرض، وهو أوصاني أبني له بيت في أورشليم اللي في يهوذا.»","أي حد من شعبه يقدر يطلع أورشليم ويبني بيت الرب، «ليكن إلهه معه.»","وأهل مكانهم يساعدوهم بفضة ودهب وأمتعة وبهايم، مع تبرع لبيت الله."]],
  ["قلوب اتحركت تروح",["رؤوس آباء يهوذا وبنيامين والكهنة واللاويين قاموا يطلعوا: كل واحد ربنا نبّه روحه.","وكل اللي حواليهم ساعدوهم بآنية فضة ودهب وأمتعة وبهايم وتحف."]],
  ["الآنية بترجع بيتها",["الملك كورش خرّج آنية بيت الرب، اللي نبوخذنصر خرّجها من أورشليم وحطها في بيت آلهته.","واتعدّت لشيشبصر رئيس يهوذا.","كل الآنية من دهب وفضة خمس آلاف وأربعمية، طلعت مع المسبيين من بابل لأورشليم."]],
  ["دانيال لسه في فارس",["بعدها بسنتين، في السنة التالتة لكورش، دانيال لسه بياخد إعلان وهو واقف على شط نهر دجلة.","والكتاب المقدس ما بيسجلش إن دانيال رجع أورشليم."]]
 ]},
dan10:{date:"حوالي 536 ق.م",title:"الراجل اللابس كتان",
 hook:"تلات أسابيع نوح، ورسول اتأخر، ولمحة من الحرب اللي ورا الممالك.",
 s:[
  ["رسالة عن جهاد عظيم",["في السنة التالتة لكورش ملك فارس، اتكشف أمر لدانيال اللي اسمه بلطشاصر.","الأمر حق، والجهاد عظيم. وهو فهم الأمر وكان له معرفة بالرؤيا."]],
  ["تلات أسابيع نوح",["في الأيام دي دانيال كان نايح تلات أسابيع كاملة.","ما كلش أكل شهي، ولا دخل بُقه لحم ولا خمر، ولا ادّهن، لحد ما التلات أسابيع خلصوا."]],
  ["الراجل اللابس كتان",["في اليوم الرابع والعشرين من الشهر الأول، دانيال كان واقف جنب النهر العظيم، دجلة.","رفع عينيه وشاف راجل لابس كتان، ووسطه متحزم بدهب أوفاز.","جسمه زي الزبرجد، ووشه زي منظر البرق، وعينيه زي مصابيح نار، ودراعاته ورجليه زي النحاس المصقول، وصوت كلامه زي صوت جمهور."]],
  ["دانيال بيفضل لوحده",["دانيال بس اللي شاف الرؤيا. الرجالة اللي معاه ما شافوش، بس وقعت عليهم رعدة عظيمة فهربوا يستخبوا.","فضل لوحده، وما بقاش فيه قوة، ونضارته اتحولت فيه لفساد.","ولما سمع صوت كلامه، وقع في نوم تقيل ووشه على الأرض."]],
  ["«أيها الرجل المحبوب»",["إيد لمسته وقوّمته مرتعش على ركبه وكفوف إيديه.","«يا دانيال، أيها الرجل المحبوب، افهم الكلام اللي بكلمك بيه، وقوم على مقامك.» فقام وهو بيرتعد.","«لا تخف يا دانيال. من أول يوم حطيت فيه قلبك للفهم ولإذلال نفسك قدام إلهك، كلامك اتسمع، وأنا جيت عشان كلامك.»"]],
  ["واحد وعشرين يوم مقاومة",["«رئيس مملكة فارس وقف قصادي واحد وعشرين يوم.»","«وميخائيل، واحد من الرؤساء الأولين، جه يعينني.»","ودلوقتي جه يفهّمه اللي هيحصل لشعبه في الأيام الأخيرة، لأن الرؤيا لأيام لسه جاية."]],
  ["قوة لراجل مش قادر يتكلم",["دانيال حط وشه للأرض وسكت. وواحد شبه بني آدم لمس شفايفه، ففتح بُقه.","«إزاي عبد سيدي ده يقدر يتكلم مع سيدي؟ ما فضلش فيّ قوة، وما بقاش فيّ نَفَس.»","اللي زي منظر إنسان رجع لمسه وقوّاه: «لا تخف أيها الرجل المحبوب. سلام لك. تشدد. تقوَّ.»","دانيال اتقوى وقال: «ليتكلم سيدي لأنك قويتني.»"]],
  ["المعركة اللي ورا الستار",["«دلوقتي هرجع أحارب رئيس فارس، ولما أخرج، رئيس اليونان هييجي.»","بس الأول هيخبّره بالمرسوم في كتاب الحق.","ومحدش بيتمسك معاه على دول غير ميخائيل «رئيسكم»."]]
 ]},
dan11:{date:"حوالي 536 ق.م",title:"ملوك الشمال والجنوب",
 hook:"الرسول بيحكي قرون من الحروب اللي هتعدّي على شعب دانيال.",
 vision:{text:"الملاك بيسمي فارس واليونان (11: 2) وبيوصف ملك جبار مملكته بتتقسم لرياح السما الأربعة (11: 3–4). والباقي محكي كسلسلة ملوك للشمال والجنوب من غير أسامي، والأرض البهية بينهم.",
  hist:"المؤرخين بيطابقوا الآيات دي بدقة: ملوك فارس لحد أحشويروش (زركسيس)، اللي غزا اليونان سنة 480 ق.م (آية 2)؛ والإسكندر الأكبر وتقسيم إمبراطوريته (آيات 3–4)؛ والبطالمة في مصر في الجنوب والسلوقيين في سوريا في الشمال (آيات 5–20)؛ وأنطيوخس الرابع إبيفانس، اللي أسطول روماني رجّعه من مصر سنة 168 ق.م ونجّس الهيكل سنة 167 ق.م، وده اللي أدّى لمقاومة المكابيين (آيات 21–35). وفي الآيات 36–45 المفسرين منقسمين. فيه اللي بيكمّل مع أنطيوخس. ومفسرين محافظين كتير شايفين حاكم أخير في وقت النهاية، لأن التفاصيل مش ماشية مع طريقة موت أنطيوخس."},
 s:[
  ["فارس، وبعدين ملك جبار",["تلات ملوك كمان هيقوموا في فارس، والرابع هيبقى أغنى منهم كلهم بكتير. وبغناه هيهيّج الكل على مملكة اليونان.","وبعدين يقوم ملك جبار، يتسلط تسلط عظيم ويعمل اللي على كيفه.","وأول ما يقوم، مملكته تتكسر وتتقسم لرياح السما الأربعة. ومش هتروح لنسله."]],
  ["بداية الجنوب والشمال",["ملك الجنوب هيتقوى، بس واحد من رؤسائه هيقوى عليه ويتسلط على مملكته هو.","بعد سنين هيتعاهدوا. بنت ملك الجنوب هتروح لملك الشمال عشان تعمل اتفاق، بس مش هتحتفظ بقوتها، وهتتسلّم.","وواحد من فرع أصولها هيهجم على جيش ملك الشمال، ويدخل حصنه ويغلب. وهياخد آلهتهم وآنيتهم الثمينة سبي لمصر."]],
  ["أجيال من الحرب",["ولاد ملك الشمال هيجمعوا جيوش عظيمة تغمر وتطمّ. وملك الجنوب هيطلع بغيظ ويغلب جمهور عظيم، بس مش هيعتز.","ملك الشمال هيرجع بجيش أكبر. ورجالة عتاة من شعب دانيال نفسه هيقوموا عشان يثبّتوا الرؤيا، بس هيعثروا.","هياخد مدينة حصينة ويقف في الأرض البهية. وهيدّي بنته جواز عشان يخرب المملكة، بس خطته مش هتنجح.","هيحوّل وشه للجزاير، بس قائد هيبطّل تعييره. وهيعثر ويقع وما يتلاقاش."]],
  ["راجل محتقر بياخد العرش",["اللي بعده هيبعت جابي ضرايب، وفي أيام قليلة هينكسر، بس مش بغضب ولا بحرب.","وهيقوم مكانه واحد محتقر ما ادّوهوش فخر المملكة. هياخد المملكة بالتملقات.","جيش جارف هينجرف من قدامه، ومعاه رئيس العهد. هيتصرف بمكر ويوزّع النهب على أتباعه."]],
  ["حروب ضد الجنوب",["هينهّض قوته على ملك الجنوب، اللي مش هيثبت بسبب التدابير اللي بيدبّروها عليه اللي بياكلوا من أكله.","الملكين هيقعدوا على سفرة واحدة ويكدبوا على بعض، ومش هينفع.","هيرجع أرضه بغنى عظيم، بس قلبه على العهد المقدس.","في الميعاد هيرجع ويدخل الجنوب تاني، بس سفن من كتّيم هتيجي عليه، فييأس."]],
  ["الهيكل بيتنجس",["هيرجع ويغتاظ على العهد المقدس، ويصغي للي سابوا العهد.","جيوشه هتنجّس المقدس الحصين، وتشيل المحرقة الدايمة، وتحط الرجس المخرِّب.","بالتملقات هيغوي اللي تعدّوا على العهد، بس الشعب اللي يعرفوا إلههم يقووا ويعملوا."]],
  ["الفاهمين بيتنقّوا",["الفاهمين من الشعب هيعلّموا كتيرين، مع إنهم هيعثروا أيام بالسيف واللهيب والسبي والنهب.","لما يعثروا هيتعانوا عون قليل، وكتير هيتصلوا بيهم بالتملقات.","وبعض الفاهمين هيعثروا، عشان يتمحّصوا ويتطهّروا ويتبيّضوا لحد وقت النهاية."]],
  ["الملك اللي بيرفع نفسه",["الملك هيعمل اللي على كيفه. هيرتفع ويتعظم على كل إله، ويتكلم بأمور عجيبة على إله الآلهة.","هينجح لحد ما الغضب يتم، لأن المقضي بيه لازم يحصل.","مش هيبالي بآلهة آبائه. وهيكرم إله الحصون، ويقسّم الأرض أجرة."]],
  ["نهايته",["في وقت النهاية ملك الجنوب هيحاربه، وملك الشمال هيثور عليه بمركبات وفرسان وسفن كتيرة.","هيدخل الأرض البهية. بلاد كتير هتعثر، وهيتسلط على كنوز مصر.","أخبار من الشرق ومن الشمال هتفزعه، فيخرج بغضب عظيم عشان يخرب كتيرين.","هينصب خيام قصره بين البحور وجبل بهاء القدس. بس هيوصل لنهايته، ومحدش هيعينه."]]
 ]},
dan12:{date:"حوالي 536 ق.م",title:"استريح، وقوم في النهاية",
 hook:"آخر كلام اتقال لدانيال: قيامة، وسفر مختوم، ووعد شخصي.",
 note:"السفر ما بيسجلش موت دانيال. آخر جملة فيه وعد اتقال له.",
 vision:{text:"الملاك بيتكلم عن زمان ضيق ما حصلش زيه، ونجاة كل اللي اسمه مكتوب في السفر، وقيامة للحياة الأبدية أو للعار والازدراء الأبدي (12: 1–2). والكلام مختوم لوقت النهاية (12: 9).",
  hist:"أرقام الـ 1290 يوم والـ 1335 يوم مش متفسّرة في النص، والمفسرين مش متفقين عليها."},
 s:[
  ["ميخائيل بيقوم",["في الوقت ده يقوم ميخائيل، الرئيس العظيم القايم لبني شعب دانيال.","وهيبقى زمان ضيق ما حصلش زيه من ساعة ما كانت أمة لحد الوقت ده.","بس في الوقت ده شعب دانيال هينجّى: كل اللي اسمه مكتوب في السفر."]],
  ["الراقدين هيصحوا",["كتيرين من الراقدين في تراب الأرض هيصحوا، دول للحياة الأبدية، ودول للعار وللازدراء الأبدي.","الفاهمين هيضوّوا زي ضيا الجلد.","واللي ردّوا كتيرين للبر هيبقوا زي الكواكب لأبد الدهور."]],
  ["اختم السفر",["دانيال اتقال له يخفي الكلام ويختم السفر لحد وقت النهاية.","كتيرين هيتصفّحوه، والمعرفة هتزيد."]],
  ["«إلى متى؟»",["دانيال شاف اتنين تانيين واقفين، واحد على كل شط من النهر.","واحد سأل الراجل اللابس كتان اللي فوق مية النهر: «إلى متى انتهاء العجايب؟»","الراجل رفع إيديه الاتنين للسما وحلف بالحي إلى الأبد: لزمان وزمانين ونص. ولما يتم تفريق إيد الشعب المقدس، كل ده يتم."]],
  ["«سمعت وما فهمتش»",["دانيال سأل: «يا سيدي، إيه آخر الأمور دي؟»","فقال: «اذهب يا دانيال، لأن الكلام مخفي ومختوم لوقت النهاية.»","كتيرين هيتطهّروا ويتبيّضوا ويتمحّصوا، والأشرار هيعملوا شر. ولا واحد من الأشرار هيفهم، بس الفاهمين هيفهموا."]],
  ["الأيام المعدودة",["من وقت شيل المحرقة الدايمة وإقامة رجس المخرِّب، ألف ومتين وتسعين يوم.","طوبى للي ينتظر ويوصل للألف وتلتمية وخمسة وتلاتين يوم."]],
  ["استريح، وبعدين قوم",["«أما أنت فاذهب إلى النهاية.»","«فتستريح، وتقوم لقرعتك في نهاية الأيام.»"]]
 ]}
}
};

AR.m={"hezekiah":{"date":"حوالي 701 ق.م","title":"حزقيا بيفتح خزاينه لبابل","hook":"لحظة كبرياء في أورشليم، وأول نبوة بتشاور على دانيال.","thread":"دانيال 1: 2–3 هو تحقيق النبوة دي: كنوز الهيكل بتروح بابل، وشباب من النسل الملكي بيخدموا في قصر الملك.","s":[["رُسل جايين من بابل",["مرودخ بلادان ملك بابل بيبعت رسايل وهدية لحزقيا، عشان سمع إنه كان عيان.","سفر الأخبار بيضيف إن الرسل جُم كمان يسألوا عن الأعجوبة اللي حصلت في الأرض."]],["حزقيا بيورّيهم كل حاجة",["حزقيا بيرحّب بيهم وبيورّيهم الفضة والدهب والأطياب والزيت الطيب ومخزن السلاح وكل اللي في خزاينه.","مفيش حاجة في قصره ولا في كل مملكته ما ورّاهاش لهم."]],["ربنا كان بيمتحن قلبه",["بعد ما اتشفى، قلب حزقيا اتكبّر، وما ردّش على الإحسان اللي اتعمل معاه.","في موضوع الرسل، ربنا سابه لنفسه عشان يمتحنه ويعرف كل اللي في قلبه."]],["إشعياء بيسأل الملك",["إشعياء بيسأله: «الرجالة دول قالوا إيه، وجايين منين؟» وحزقيا بيرد: «من أرض بعيدة، من بابل.»","إشعياء بيسأل هم شافوا إيه في القصر. حزقيا بيقول: «شافوا كل حاجة. مفيش حاجة في خزايني ما ورّيتهاش لهم.»"]],["النبوة اللي بتوصل لدانيال",["إشعياء بيقول كلام الرب: هييجي وقت كل اللي في القصر، وكل اللي آباؤه خزّنوه، هيتاخد لبابل. مش هيفضل حاجة.","وناس من نسل حزقيا نفسه هيتاخدوا، ويبقوا خصيان في قصر ملك بابل."]],["«المهم في أيامي أنا»",["حزقيا بيرد إن كلام الرب كويس.","وكان بيفكر إن هيبقى فيه سلام وأمان في أيامه هو."]]]},"manasseh":{"date":"حوالي 697 – 642 ق.م","title":"منسى بيملا أورشليم شر","hook":"ابن حزقيا بيهدّ كل حاجة، والحكم على يهوذا بيتنطق.","thread":"لما غزاة بابل جُم في الآخر أيام يهوياقيم، ملوك الثاني 24: 3–4 بيقول إن ده حصل بسبب خطايا منسى.","s":[["ابن بيعكس اللي أبوه عمله",["منسى بيملك وهو عنده اتناشر سنة، وبيحكم خمسة وخمسين سنة في أورشليم.","بيرجّع بنا المرتفعات اللي أبوه حزقيا هدّها، وبيعمل مذابح للبعل وسارية، وبيسجد للنجوم.","بيبني مذابح وثنية جوه هيكل الرب، وبيعدّي ابنه في النار، وبيمارس السحر والعرافة وبيسأل الجان."]],["صنم في بيت ربنا",["بيحط تمثال السارية في الهيكل، المكان اللي الرب قال إن اسمه هيبقى فيه للأبد.","الشعب ما سمعش. ومنسى خلّاهم يعملوا شر أكتر من الأمم اللي الرب أبادهم من قدام إسرائيل."]],["الحكم بيتنطق",["الرب بيعلن على لسان أنبيائه مصيبة على أورشليم ويهوذا، كل اللي يسمع بيها ودانه تطنّ.","هيمسح أورشليم زي ما الواحد بيمسح الطبق، يمسحه ويقلبه على وشه.","وهيسيب بقية شعبه ويسلّمهم لإيد أعدائهم."]],["دم بريء",["منسى كمان سفك دم بريء كتير جدًا، لحد ما ملا أورشليم بيه من أولها لآخرها."]],["أسير بيصلي",["الرب كلّم منسى وشعبه، بس هم ما اهتموش.","قادة جيش ملك أشور مسكوه، وحطوا له خزامة في مناخيره، وربطوه بسلاسل نحاس، وودّوه بابل.","في ضيقه اتواضع جدًا وصلى. وربنا سمع له ورجّعه أورشليم، ومنسى عرف إن الرب هو الله."]],["حكم لسه قايم",["بعد سنين، لما المصيبة وصلت يهوذا، سفر الملوك بيقول إنها جت بأمر الرب عشان يبعدهم من قدامه بسبب خطايا منسى.","وبيذكر الدم البريء اللي سفكه في أورشليم، واللي الرب ما رضيش يغفره."]]]},"josiah":{"date":"640 – 609 ق.م","title":"يوشيا، آخر إصلاح","hook":"ملك قلبه رقيق بيرجّع الشعب لربنا، بس المصيبة اتأجلت بس.","note":"ميلاد دانيال مش مكتوب. بما إنه اتاخد لبابل وهو شاب حوالي سنة 605 ق.م، فالأغلب إنه اتولد أيام حكم يوشيا.","s":[["ملك صغير بيطلب ربنا",["يوشيا بيملك وهو عنده تمن سنين، وبيحكم واحد وتلاتين سنة.","بيعمل المستقيم في عينين الرب، وما بيحيدش يمين ولا شمال."]],["سفر الشريعة بيتلاقى",["في السنة التمنتاشر من ملكه، وهم بيرمّموا الهيكل، حلقيا الكاهن العظيم بيلاقي سفر الشريعة في بيت الرب.","شافان الكاتب بيجيبه للملك وبيقراه قدامه."]],["الملك بيشق هدومه",["لما يوشيا سمع كلام الشريعة، شق هدومه.","بيبعت رجالة يسألوا الرب، لأن غضب الرب مشتعل عليهم: آباؤهم ما سمعوش لكلام السفر ده."]],["رد خلدة النبية",["خلدة النبية بتأكد: الرب هيجيب شر على المكان ده وعلى سكانه، كل اللي مكتوب في السفر.","وعشان قلب يوشيا رقّ واتواضع وبكى، هيندفن بسلام، وعينيه مش هتشوف المصيبة."]],["عهد وتطهير",["يوشيا بيقرا السفر قدام كل الشعب وبيجدد العهد قدام الرب.","بيشيل الأصنام والمرتفعات والعرافين وآلهة البيوت من يهوذا وأورشليم.","بيعمل فصح ما اتعملش زيه من أيام القضاة. مفيش ملك قبله ولا بعده رجع للرب زيه بكل قلبه."]],["بس الغضب لسه موجود",["مع كده، الرب ما رجعش عن غضبه الشديد على يهوذا، بسبب كل اللي منسى عمله.","الرب بيقول إنه هيبعد يهوذا من قدامه زي ما بعد إسرائيل، ويرفض أورشليم، المدينة اللي اختارها."]],["موته في مجدّو",["فرعون نخو ملك مصر بيطلع ناحية نهر الفرات. يوشيا بيخرج يحاربه وبيتقتل في مجدّو.","عبيده بيجيبوا جثته أورشليم في مركبة. وسفر الأخبار بيقول إن إرميا رثاه.","شعب الأرض بيمسحوا ابنه يهوآحاز ملك."]]]},"jehoiakim":{"date":"609 ق.م","title":"مصر بتقعّد يهوياقيم على العرش","hook":"يهوذا بتخسر استقلالها، وملك دانيال 1: 1 بياخد مكانه.","thread":"ده يهوياقيم اللي اسمه مكتوب في أول آية في سفر دانيال.","s":[["تلات شهور على العرش",["يهوآحاز بيملك وهو عنده تلاتة وعشرين سنة. بيحكم تلات شهور وبيعمل الشر في عينين الرب.","فرعون نخو بيقيّده في ربلة، وبيفرض على يهوذا غرامة ميت وزنة فضة ووزنة دهب."]],["مصر هي اللي بتختار الملك",["نخو بيخلّي ألياقيم، ابن تاني ليوشيا، ملك مكان أبوه، وبيغيّر اسمه ليهوياقيم.","يهوآحاز بيتاخد لمصر، وبيموت هناك."]],["أرض عليها ضرايب",["يهوياقيم بيدفع لفرعون الفضة والدهب اللي طلبهم.","وعشان يدفع، بيفرض ضريبة على الأرض وبيلمّ من الشعب، كل واحد على قد تقديره."]],["حداشر سنة من الشر",["يهوياقيم بيملك وهو عنده خمسة وعشرين سنة، وبيحكم حداشر سنة في أورشليم.","بيعمل الشر في عينين الرب، زي ما آباؤه عملوا."]],["حكم إرميا على الملك",["إرميا بيدينه إنه بنى قصره بالظلم، وشغّل جاره من غير أجرة.","أبوه يوشيا عمل العدل والحق ودافع عن الفقير، وكان خير له. الرب بيقول: «مش دي معرفتي؟»","عينين يهوياقيم وقلبه على المكسب الحرام بس، وعلى سفك الدم البريء، وعلى الظلم.","محدش هيبكي عليه. هيندفن دفنة حمار، مسحوب ومرمي برّه أبواب أورشليم."]]]},"year605":{"date":"605 – 604 ق.م","title":"كركميش، سبعين سنة، ودَرج محروق","hook":"بابل بتبقى القوة الأولى في العالم، وإرميا بيحدد رقم لمدة السبي.","thread":"بعد عشرات السنين، دانيال بيقرا نبوة السبعين سنة دي نفسها وبيحوّلها لصلاة (دانيال 9: 2).","s":[["بابل بتهزم مصر",["في السنة الرابعة ليهوياقيم، نبوخذنصر ملك بابل بيهزم جيش فرعون نخو في كركميش على نهر الفرات."]],["تلاتة وعشرين سنة تحذير",["في نفس السنة، أول سنة لنبوخذنصر، إرميا بيكلم كل شعب يهوذا.","بقاله تلاتة وعشرين سنة، من السنة التلاتاشر ليوشيا، كلمة الرب بتجيله وهو بيقولها مرة ورا مرة، وهم ما سمعوش.","الرب بعت كل عبيده الأنبياء بنفس الدعوة: ارجعوا عن طريقكم الردي واسكنوا في الأرض."]],["«عبدي نبوخذنصر»",["عشان ما سمعوش، الرب هيبعت يجيب نبوخذنصر، اللي بيسميه «عبدي»، على الأرض دي.","صوت الفرح والبهجة، صوت العريس والعروسة، صوت الطاحونة ونور السراج، كله هيتشال.","الأرض كلها هتبقى خراب، والأمم دي هتخدم ملك بابل سبعين سنة."]],["ميعاد بابل نفسها",["لما السبعين سنة يكملوا، الرب هيعاقب ملك بابل وأمته على ذنبهم.","كل اللي مكتوب في السفر ده على الأرض دي هييجي عليها."]],["الدَّرج بيتكتب",["في السنة الرابعة ليهوياقيم، الرب بيقول لإرميا يكتب في دَرج كل الكلام اللي كلمه بيه من أيام يوشيا.","يمكن لما يهوذا يسمعوا بالشر اللي جاي، كل واحد يرجع عن طريقه الردي، والرب يغفر لهم.","باروخ بيكتب الكلام من بُق إرميا. وإرميا ممنوع يدخل الهيكل، فبيبعت باروخ يقرا الدَّرج هناك."]],["الملك بيحرقه",["في السنة الخامسة، في يوم صوم، باروخ بيقرا الدَّرج في الهيكل. الرؤساء بيسمعوا وبيخافوا وبيودّوه للملك.","يهوياقيم قاعد في بيت الشتا وقدامه كانون نار. كل ما يتقرا تلات أو أربع أعمدة، بيقطعهم بالمطوة ويرميهم في النار، لحد ما الدَّرج كله اتحرق.","لا الملك ولا عبيده خافوا، ولا شقوا هدومهم. وأمر بالقبض على باروخ وإرميا، بس الرب خبّاهم."]],["الكلام بيتكتب تاني",["الرب بيقول لإرميا ياخد دَرج تاني ويكتب فيه كل الكلام اللي كان في الأول.","باروخ بيكتبهم تاني، وبيتزاد عليهم كلام كتير زيهم.","يهوياقيم مش هيبقى له حد يقعد على كرسي داود."]],["يهوياقيم بيبقى عبد لبابل",["في أيامه طلع نبوخذنصر ملك بابل، ويهوياقيم بقى عبد له تلات سنين."]]]},"dan1a":{"date":"حوالي 605 – 602 ق.م","title":"أورشليم بتتحاصر وآنية الهيكل بتتاخد","hook":"الرب بيسلّم يهوياقيم لإيد نبوخذنصر، وآنية من بيت الله بتروح بيت إله بابل.","s":[["أورشليم بتتحاصر",["في السنة التالتة ليهوياقيم ملك يهوذا، نبوخذنصر ملك بابل بييجي أورشليم وبيحاصرها.","الرب بيسلّم يهوياقيم لإيده، ومعاه بعض آنية بيت الله.","نبوخذنصر بياخدهم لأرض شنعار وبيحطهم في خزانة بيت إلهه."]]],"note":"دانيال 1: 1 بيقول السنة التالتة ليهوياقيم، وإرميا 25: 1 بيسمي نفس الفترة السنة الرابعة. التفسير المعروف إن بابل ويهوذا كانوا بيحسبوا أول سنة في الحكم بطريقتين مختلفتين."},"dan1b":{"date":"حوالي 605 – 602 ق.م","title":"بابل بتختار أحسن شباب يهوذا","hook":"شباب من النسل الملكي والأشراف، متختارين عشان حكمتهم وشكلهم، وبيتدربوا تلات سنين لقصر الملك.","s":[["اختيار أحسن شباب يهوذا",["الملك بيأمر أشفنز رئيس خصيانه يجيب ناس من بني إسرائيل، من النسل الملكي ومن الأشراف.","شباب مفيهمش عيب، شكلهم حلو، فاهمين في كل حكمة، عندهم معرفة وفهم، ويقدروا يقفوا في قصر الملك.","يعلّمهم لغة الكلدانيين وكتابتهم. والملك بيحدد لهم نصيب كل يوم من أكله ومن خمره، وتلات سنين تدريب قبل ما يخدموا قدامه."]]]},"dan1c":{"date":"حوالي 605 – 602 ق.م","title":"أربع أسامي جديدة","hook":"دانيال وحننيا وميشائيل وعزريا بيتسموا بلطشاصر وشدرخ وميشخ وعبدنغو.","s":[["أربع أسامي بتتغير",["كان منهم أربعة من يهوذا: دانيال وحننيا وميشائيل وعزريا.","رئيس الخصيان بيديهم أسامي جديدة: بلطشاصر وشدرخ وميشخ وعبدنغو."]]],"note":"الأسامي العبرية بتمجّد إله إسرائيل: دانيال معناه «الله قاضيّ»، وحننيا «الرب حنّان»، وميشائيل «مين زي الله؟»، وعزريا «الرب بيعين». ودانيال 4: 8 بيقول إن بلطشاصر اتسمّى على اسم إله نبوخذنصر، وعبدنغو بيتفهم عادةً «عبد نبو». مفسرين كتير شايفين إن تغيير الأسامي كان محاولة لتغيير هويتهم؛ بس النص نفسه ما بيقولش سبب الملك."},"dan1d":{"date":"حوالي 605 – 602 ق.م","title":"دانيال بيحط في قلبه: أكل الملك وامتحان العشر أيام","hook":"دانيال بيرفض أكل الملك وخمره، وبيطلب عشر أيام خضار ومية.","s":[["دانيال بيحط في قلبه",["دانيال بيحط في قلبه إنه ما يتنجسش بأكل الملك ولا بالخمر اللي بيشربه، وبيطلب إذن من رئيس الخصيان.","ربنا كان مدّي دانيال نعمة ورحمة قدام رئيس الخصيان.","بس الراجل خايف: «لو الملك شاف وشوشكم أضعف من الشباب اللي في سنكم، هتخلّوا راسي في خطر.»"]],["امتحان العشر أيام",["دانيال بيكلم الحارس المسؤول عن الأربعة: «جرّب عبيدك عشر أيام. ادّينا خضار بس ناكله ومية نشربها.»","«وبعدين قارن شكلنا بشكل الشباب اللي بياكلوا أكل الملك، واعمل معانا حسب اللي تشوفه.»","بعد عشر أيام طلع شكلهم أحسن وأسمن من كل التانيين. فالحارس شال أكلهم الفاخر وخمرهم واداهم خضار."]]]},"dan1e":{"date":"حوالي 605 – 602 ق.م","title":"ربنا بيدي حكمة: أحسن عشر مرات","hook":"ربنا بيدي الأربعة معرفة وفهم، والملك بيلاقيهم أحسن عشر مرات من كل حكماه.","s":[["ربنا هو اللي بيدي العلم",["الأربع شباب دول ربنا اداهم معرفة وفهم في كل كتابة وحكمة.","ودانيال كان بيفهم كل الرؤى والأحلام."]],["امتحان قدام الملك",["في آخر المدة، رئيس الخصيان بيدخّلهم كلهم قدام نبوخذنصر.","الملك بيتكلم معاهم وما بيلاقيش حد زي دانيال وحننيا وميشائيل وعزريا، فبيقفوا في خدمة الملك.","في كل أمر حكمة وفهم سألهم عنه، لقاهم أحسن عشر مرات من كل المجوس والسحرة اللي في مملكته."]],["خدمة بتعيش أكتر من الإمبراطورية",["دانيال فضل هناك لحد السنة الأولى لكورش الملك."]]]},"dan2a":{"date":"حوالي 603 ق.م","title":"حلم وحكم بالموت","hook":"الملك بيطلب الحلم ومعناه، وبيأمر بقتل كل حكما بابل.","s":[["حلم بيطيّر النوم من عين الملك",["في السنة التانية من ملكه، نبوخذنصر بيحلم أحلام. روحه بتنزعج والنوم بيطير منه.","بيستدعي المجوس والسحرة والعرافين والكلدانيين وبيقول: «حلمت حلم، وروحي منزعجة عايز أفهمه.»"]],["طلب مستحيل",["الحكما بيردوا: «قول لعبيدك الحلم، واحنا نقول التفسير.»","الملك بيرفض. لازم هم اللي يقولوا له الحلم ومعناه. لو فشلوا هيتقطعوا حتت وبيوتهم تبقى خرابة. ولو نجحوا هياخدوا هدايا وكرامة عظيمة.","لما طلبوا تاني، اتهمهم إنهم بيكسبوا وقت ومتفقين يقولوا له كلام كدب لحد ما الحال يتغير."]],["«مفيش حد على الأرض يقدر»",["الكلدانيين بيردوا إن مفيش ملك، مهما كان عظيم، طلب حاجة زي دي من أي مجوسي.","الآلهة بس هم اللي يقدروا يبيّنوها، وهم مش ساكنين مع البشر.","الملك بيغضب جدًا وبيأمر بإعدام كل حكما بابل. وبيدوّروا على دانيال وأصحابه عشان يقتلوهم."]]]},"dan2b":{"date":"حوالي 603 ق.م","title":"حكمة وعقل واجتماع صلاة","hook":"دانيال بيطلب وقت من الملك، وبيطلب من أصحابه التلاتة يصلّوا. والسر بيتكشف بالليل.","s":[["دانيال بيرد بحكمة",["دانيال بيكلم أريوخ رئيس حرس الملك بحكمة وعقل: «ليه أمر الملك شديد كده؟»","أريوخ بيشرح له، ودانيال بيدخل ويطلب من الملك وقت عشان يقول له التفسير."]],["أربع أصحاب بيصلوا",["دانيال بيروح بيته وبيحكي لحننيا وميشائيل وعزريا.","بيطلب منهم يطلبوا رحمة من إله السما في السر ده، عشان ما يموتوش مع باقي الحكما.","وفي الليل السر بيتكشف لدانيال في رؤيا."]]]},"dan2c":{"date":"حوالي 603 ق.م","title":"دانيال بيبارك إله السما","hook":"قبل ما يروح للملك، دانيال بيسبّح الإله اللي بيعزل ملوك وينصّب ملوك.","s":[["دانيال بيبارك إله السما",["«ليكن اسم الله مبارك من الأزل وإلى الأبد، لأن له الحكمة والجبروت.»","هو بيغيّر الأوقات والأزمنة، بيعزل ملوك وينصّب ملوك، وبيكشف العمايق والأسرار.","دانيال بيشكر إله آبائه إنه اداه حكمة وعرّفه اللي طلبوه."]]]},"dan2d":{"date":"حوالي 603 ق.م","title":"التمثال والحجر","hook":"دهب وفضة ونحاس وحديد وخزف، وحجر اتقطع من غير إيد بيضربهم.","s":[["«فيه إله في السما»",["دانيال بيطلب من أريوخ ما يهلكش الحكما، وأريوخ بيدخّله للملك بسرعة.","الملك بيسأل: «تقدر تعرّفني الحلم ومعناه؟»","دانيال بيرد إن مفيش حكيم يقدر يبيّن السر، «لكن فيه إله في السما بيكشف الأسرار.»","وبيضيف إن السر ما اتكشفش له عشان عنده حكمة أكتر من غيره."]],["التمثال",["الملك شاف تمثال عظيم بيلمع: راسه دهب نقي، صدره ودراعاته فضة، بطنه وفخاده نحاس، رجليه حديد، وقدميه حديد على خزف.","حجر اتقطع، مش بإيد إنسان. خبط التمثال على قدميه وكسّرهم.","التمثال كله اتسحق وبقى زي العصافة في جرن الصيف، والريح شالته.","والحجر بقى جبل كبير وملا الأرض كلها."]],["المعنى",["«إنت أيها الملك الراس الدهب ده.» إله السما اداله مملكة وقدرة وسلطان ومجد.","بعده هتقوم مملكة تانية أقل منه. وبعدين تالتة من نحاس تتسلط على كل الأرض. ورابعة قوية زي الحديد، بتسحق وتكسّر كل اللي قبلها.","القدمين الحديد والخزف مملكة منقسمة، جزء قوي وجزء هش، وناسها مش هيتماسكوا.","في أيام الملوك دول، إله السما هيقيم مملكة ما تنقرضش أبدًا ولا تتساب لشعب تاني. هتسحق كل الممالك دي وهي تثبت للأبد."]]],"vision":{"text":"دانيال بيقول للملك بوضوح: «إنت الراس الدهب» (2: 38). والحجر هو مملكة بيقيمها إله السما، وما بتنتهيش أبدًا (2: 44).","hist":"التلات ممالك التانيين مش مذكورين بالاسم في الأصحاح ده. الرأي عند أغلب المفسرين المحافظين إنهم مادي وفارس (الفضة)، واليونان (النحاس)، وروما (الحديد). وسفر دانيال نفسه بيدعم أول خطوتين: 5: 28 بيدي بابل لمادي وفارس، و8: 20–21 بيسمي مادي وفارس وبعدهم اليونان. والمسيحيين بيفهموا الحجر على إنه مملكة المسيح."}},"dan2e":{"date":"حوالي 603 ق.م","title":"الملك بيسجد ودانيال بيترقّى","hook":"نبوخذنصر بيقول على إله دانيال إله الآلهة، وبيخلّي دانيال حاكم على ولاية بابل.","s":[["الملك بيسجد",["نبوخذنصر بيقع على وشه قدام دانيال وبيقول: «حقًا إلهكم إله الآلهة ورب الملوك وكاشف الأسرار.»","بيخلّي دانيال حاكم على كل ولاية بابل ورئيس على كل حكماها.","وبطلب من دانيال، شدرخ وميشخ وعبدنغو بيتعيّنوا على شغل الولاية، ودانيال بيفضل في باب الملك."]]]},"exile597":{"date":"597 – 591 ق.م","title":"السبي التاني","hook":"ودانيال بيخدم في القصر، عشرة آلاف كمان بيوصلوا من أورشليم، ومنهم حزقيال.","note":"أغلب المفسرين المحافظين بيفهموا إن دانيال اللي حزقيال ذكره هو دانيال بتاع بابل، وإنه كان معروف وسط المسبيين ببره وحكمته.","s":[["يهوياقيم بيتمرد",["بعد تلات سنين عبد لنبوخذنصر، يهوياقيم بيرجع ويتمرد عليه.","الرب بيبعت عليه غزاة من الكلدانيين والأراميين والموآبيين وبني عمون عشان يبيدوا يهوذا، زي ما قال على لسان عبيده الأنبياء."]],["نهاية يهوياقيم",["نبوخذنصر بيطلع عليه وبيقيّده بسلاسل نحاس عشان ياخده لبابل.","وبياخد كمان من آنية بيت الرب لبابل وبيحطها في قصره هناك.","يهوياكين ابنه بيملك مكانه."]],["تلات شهور وبعدين استسلام",["يهوياكين بيملك وهو عنده تمنتاشر سنة. بيحكم تلات شهور وبيعمل الشر في عينين الرب.","جيش نبوخذنصر بيحاصر أورشليم، وملك بابل نفسه بيوصل والحصار شغال.","يهوياكين بيخرج ويسلّم نفسه هو وأمه وعبيده ورؤساؤه وخصيانه. ودي كانت السنة التامنة لملك نبوخذنصر."]],["أورشليم بتفضى من قوتها",["نبوخذنصر بياخد كل خزاين بيت الرب وبيت الملك، وبيكسّر آنية الدهب اللي سليمان عملها، زي ما الرب قال.","بيسبي عشرة آلاف: الرؤساء وجبابرة الحرب والصنايعية والحدادين.","ما فضلش غير مساكين شعب الأرض."]],["ملك جديد واسم جديد",["ملك بابل بيخلّي متّنيا، عم يهوياكين، ملك مكانه.","وبيغيّر اسمه لصدقيا."]],["رسالة إرميا للمسبيين",["إرميا بيبعت رسالة من أورشليم للشيوخ والكهنة والأنبياء وكل الشعب اللي اتسبى لبابل.","ابنوا بيوت واسكنوا فيها. ازرعوا جناين. اتجوزوا وخلّفوا بنين وبنات. اكتروا هناك وما تقلّوش.","اطلبوا سلام المدينة اللي الرب سباكم ليها وصلّوا عشانها، لأن بسلامها يبقى لكم سلام.","لما يكملوا سبعين سنة لبابل، الرب هيرجّعهم. أفكاره من ناحيتهم أفكار سلام مش شر، عشان يديهم آخرة ورجاء.","«وتطلبونني فتجدونني إذ تطلبونني بكل قلبكم.»"]],["حزقيال بيشوف رؤى وسط المسبيين",["حزقيال الكاهن وسط المسبيين عند نهر خابور في أرض الكلدانيين.","في السنة الخامسة من سبي الملك يهوياكين، السموات بتتفتح وبيشوف رؤى الله."]],["اسم دانيال جنب نوح وأيوب",["الرب بيقول لحزقيال إن لو أرض أخطأت له وبعت عليها دينونة، حتى نوح ودانيال وأيوب مش هيقدروا ينقذوها.","لو التلاتة دول كانوا فيها، هيخلّصوا نفسهم بس ببرّهم."]]]},"dan3a":{"date":"السنة مش مذكورة","title":"اسجد أو اتحرق","hook":"تمثال دهب في بقعة دورا، وأمر ملكي، وتلات يهود متهمين.","s":[["تمثال دهب في بقعة دورا",["نبوخذنصر بيعمل تمثال دهب، طوله ستين دراع وعرضه ست أدرع، وبينصبه في بقعة دورا.","بيستدعي المرازبة والشحن والولاة والقضاة والخزنة وكل حكام الولايات لتدشينه."]],["اسجد أو اتحرق",["منادي بينادي: لما الشعوب والأمم والألسنة يسمعوا صوت القرن والناي والعود والرباب والسنطير والمزمار وكل أنواع العزف، لازم يخرّوا ويسجدوا للتمثال.","واللي ما يخرّش ويسجد، في ساعتها يترمي في أتون نار متقدة.","أول ما المزيكا اشتغلت، كل الشعوب خرّوا وسجدوا."]],["اتهام تلات يهود",["رجالة كلدانيين اتقدموا واشتكوا على اليهود.","«فيه رجالة يهود إنت وكّلتهم على شغل ولاية بابل: شدرخ وميشخ وعبدنغو. دول ما عملوش لك اعتبار أيها الملك. آلهتك ما بيعبدوهاش، وتمثال الدهب ما بيسجدوش له.»"]]],"yr":"~590","note":"الأصحاح ما بيذكرش سنة، ودانيال نفسه مش مذكور فيه. النص ما بيقولش هو كان فين. الأصحاح محطوط هنا عشان بييجي بعد أصحاح 2 في ملك نبوخذنصر."},"dan3b":{"date":"السنة مش مذكورة","title":"«وإلا فليكن معلومًا»","hook":"اتدّت لهم فرصة تانية، والتلاتة رفضوا يسجدوا، مهما ربنا اختار يعمل.","s":[["فرصة تانية",["نبوخذنصر بغضب شديد بيجيب التلات رجالة قدامه وبيسأل: «صحيح الكلام ده؟»","بيديهم فرصة تانية يسجدوا لما المزيكا تشتغل.","لو رفضوا، هيترموا في الأتون في ساعتها. «ومين هو الإله اللي ينقذكم من إيديا؟»"]],["«وإلا فليكن معلومًا»",["بيردوا إنهم مش محتاجين يجاوبوه عن الأمر ده.","«إلهنا اللي بنعبده قادر ينجينا من أتون النار المتقدة، وهينقذنا من إيدك أيها الملك.»","«ولو ما حصلش، فليكن معلوم عندك إننا مش هنعبد آلهتك ولا هنسجد لتمثال الدهب اللي نصبته.»"]]],"yr":"~590"},"dan3c":{"date":"السنة مش مذكورة","title":"أربع رجالة في النار","hook":"اترموا في أتون سبع مرات أسخن، ومشيوا محلولين ومعاهم رابع شبه ابن الآلهة.","s":[["سبع مرات أسخن",["نبوخذنصر بيمتلي غيظ ومنظر وشه بيتغير عليهم. بيأمر يحمّوا الأتون سبع مرات أكتر من العادة.","أقوى رجالة في جيشه بيربطوهم، وبيترموا بسراويلهم وأقمصتهم وأرديتهم وباقي لبسهم.","الأتون كان حامي لدرجة إن اللهيب قتل الرجالة اللي شالوهم. والتلاتة وقعوا مربوطين في وسط النار."]],["أربع رجالة ماشيين في النار",["الملك بيقوم بسرعة مذهول وبيسأل مشيريه: «مش احنا رمينا تلات رجالة مربوطين في النار؟»","«أنا شايف أربع رجالة محلولين ماشيين في وسط النار وما فيهمش ضرر، ومنظر الرابع شبه ابن الآلهة.»"]],["«اخرجوا!»",["نبوخذنصر بيقرّب من باب الأتون وبينادي: «يا عبيد الله العلي، اخرجوا وتعالوا!»","الرؤساء بيتلمّوا حواليهم وبيشوفوا إن النار ما كانش ليها قوة على أجسامهم.","شعرة من راسهم ما اتحرقتش، هدومهم ما اتغيرتش، وريحة النار ما جتش عليهم."]]],"yr":"~590"},"dan3d":{"date":"السنة مش مذكورة","title":"أمر ملك لإله إسرائيل","hook":"نبوخذنصر بيسبّح إلههم، وبيحمي اسمه بقانون، وبيرقّي التلاتة.","s":[["أمر الملك",["«تبارك إله شدرخ وميشخ وعبدنغو، اللي بعت ملاكه وأنقذ عبيده.»","هم اتكلوا عليه، وخالفوا كلمة الملك، وسلّموا أجسادهم عشان ما يعبدوش ولا يسجدوا لإله غير إلههم.","بيأمر إن أي حد يتكلم غلط على إلههم يتقطع حتت، «لأن مفيش إله تاني يقدر ينجي كده.» وبعدين بيرقّي التلات رجالة في ولاية بابل."]]],"yr":"~590"},"fall586":{"date":"588 – 586 ق.م","title":"أورشليم بتقع والهيكل بيتحرق","hook":"المدينة اللي دانيال بيصلي ناحيتها بتتهدّ، وسبعين سنة راحة للأرض بيبدأوا.","thread":"دي الخرايب اللي دانيال بيعترف وبيتوسل عشانها في دانيال 9.","s":[["صدقيا ما بيتواضعش",["صدقيا بيملك وهو عنده واحد وعشرين سنة، وبيحكم حداشر سنة.","ما بيتواضعش قدام إرميا النبي، وبيتمرد على نبوخذنصر اللي حلّفه بالله.","الرؤساء والكهنة والشعب بيزوّدوا الخيانة وبينجّسوا الهيكل.","الرب بيبعت لهم رسله مرة ورا مرة عشان شفق على شعبه. وهم بيهزّأوهم وبيحتقروا كلامه، لحد ما ما بقاش فيه علاج."]],["الحصار",["في السنة التاسعة لصدقيا، في عاشر يوم من الشهر العاشر، نبوخذنصر بييجي بكل جيشه وبيبني أبراج حوالين أورشليم.","المدينة بتفضل محاصرة لحد السنة الحداشر لصدقيا.","في تاسع يوم من الشهر الرابع، الجوع اشتد لدرجة إن ما بقاش فيه أكل للشعب."]],["السور بيتفتح",["سور المدينة بيتفتح، وكل رجالة الحرب بيهربوا بالليل.","الكلدانيين بيجروا ورا الملك وبيمسكوه في سهول أريحا. وبياخدوه لملك بابل في ربلة.","بيقتلوا ولاد صدقيا قدام عينيه. وبعدين بيقلعوا عينيه، وبيقيّدوه بسلاسل نحاس، وبياخدوه لبابل."]],["الهيكل بيتحرق",["في الشهر الخامس، في السنة التسعتاشر لنبوخذنصر، نبوزرادان رئيس الشرطة بييجي أورشليم.","بيحرق بيت الرب وبيت الملك وكل بيوت أورشليم.","والجيش بيهدّ أسوار المدينة."]],["الشعب بيتسبي",["نبوزرادان بيسبي بقية الشعب اللي فضلوا في المدينة، واللي هربوا لملك بابل.","وبيسيب من مساكين الأرض ناس يشتغلوا في الكروم والغيطان."]],["الهيكل بيتجرّد",["الكلدانيين بيكسّروا أعمدة النحاس والقواعد وبحر النحاس، وبياخدوا النحاس لبابل.","وبياخدوا القدور والرفوش والصحون وكل اللي من دهب وفضة."]],["الأرض بتستوفي سبوتها",["اللي نجوا من السيف بيتسبوا لبابل، وبيبقوا عبيد للملك ولولاده لحد ما مملكة فارس تملك.","الأرض بتستوفي سبوتها. كل أيام خرابها بتستريح، لحد ما السبعين سنة يكملوا، عشان يتم كلام الرب بفم إرميا."]]]},"dan4a":{"date":"السنة مش مذكورة، في آخر حكمه","title":"حلم الشجرة العظيمة","hook":"في رسالة مفتوحة، الملك بيحكي عن شجرة وصلت السما وساهر أمر بقطعها.","s":[["رسالة مفتوحة من ملك",["نبوخذنصر بيكتب لكل الشعوب والأمم والألسنة اللي في الأرض كلها.","عايز يحكي لهم عن الآيات والعجايب اللي الله العلي عملها معاه.","«ملكوته ملكوت أبدي، وسلطانه إلى دور فدور.»"]],["خوف في القصر",["كان مستريح في بيته ومبسوط في قصره، لما حلم خوّفه.","المجوس والسحرة والكلدانيين والمنجمين جُم، بس ما قدروش يفسّروه.","في الآخر دخل دانيال، اللي اسمه بلطشاصر. الملك بيقول إن فيه روح الآلهة القدوسين، وإن مفيش سر يصعب عليه."]],["الشجرة العظيمة",["شاف شجرة في وسط الأرض، كبيرة وقوية، علوها واصل السما ومنظرها لآخر الأرض.","ورقها جميل وثمرها كتير، وفيها أكل للكل.","حيوانات البر بتستضل تحتها، والطيور ساكنة في أغصانها."]],["أمر الساهر",["ساهر وقدوس بينزل من السما وبينادي: «اقطعوا الشجرة وقصّوا أغصانها. انثروا ورقها وبعزقوا ثمرها.»","بس أصل جذورها يتساب في الأرض، بقيد من حديد ونحاس، في عش
