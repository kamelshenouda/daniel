stinguishes himself by his exceptional qualities that the king plans to set him over the whole kingdom."]},{"t":"No fault to be found","r":"DAN 6:4-5","b":["The administrators and satraps look for grounds to charge Daniel in his handling of government affairs.","They can find no corruption in him, because he is trustworthy and neither corrupt nor negligent.","They conclude, “We will never find any basis for charges against this man Daniel unless it has something to do with the law of his God.”"]}],"y":537.6,"note":"The chapter gives no year. Counting from his arrival in Babylon as a youth around 605 BC, Daniel would be over eighty by this time."},{"id":"dan6b","g":"g4","date":"c. 538 BC, year not given","yr":"538","tag":"Daniel 6","ch":6,"sub":1,"subs":4,"title":"The trap and the open windows","hook":"A thirty-day law against prayer, and Daniel praying three times a day, just as before.","refs":["DAN 6:6-10"],"scenes":[{"t":"The trap","r":"DAN 6:6-9","b":["They go to the king as a group and say that all the officials have agreed on a decree.","Anyone who prays to any god or human being during the next thirty days, except to the king, will be thrown into the lions’ den.","They ask him to put it in writing so that it cannot be altered, in keeping with the law of the Medes and Persians. Darius signs it."]},{"t":"Windows open toward Jerusalem","r":"DAN 6:10","b":["When Daniel learns that the decree has been signed, he goes home to his upstairs room, where the windows open toward Jerusalem.","Three times a day he gets down on his knees and prays, giving thanks to his God, just as he had done before."]}],"y":537.5},{"id":"dan6c","g":"g4","date":"c. 538 BC, year not given","yr":"538","tag":"Daniel 6","ch":6,"sub":2,"subs":4,"title":"Into the lions’ den","hook":"Caught praying, Daniel is thrown to the lions while the king works until sunset to save him.","refs":["DAN 6:11-18"],"scenes":[{"t":"Caught praying","r":"DAN 6:11-13","b":["The men go as a group and find Daniel praying and asking God for help.","They go to the king and remind him of his decree. He confirms that it stands and cannot be repealed.","Then they say, “Daniel, one of the exiles from Judah, pays no attention to you, O king, or to the decree. He still prays three times a day.”"]},{"t":"A king trapped by his own law","r":"DAN 6:14-15","b":["When the king hears this he is greatly distressed. He is determined to rescue Daniel and works until sundown to save him.","The men come back and remind him that no decree or edict the king issues can be changed."]},{"t":"Into the den","r":"DAN 6:16-18","b":["The king gives the order, and Daniel is thrown into the lions’ den. The king says to him, “May your God, whom you serve continually, rescue you!”","A stone is placed over the mouth of the den, and the king seals it with his own signet ring and the rings of his nobles.","The king returns to his palace and spends the night without eating and without any entertainment. He cannot sleep."]}],"y":537.4},{"id":"dan6d","g":"g4","date":"c. 538 BC, year not given","yr":"538","tag":"Daniel 6","ch":6,"sub":3,"subs":4,"title":"Out of the den without a wound","hook":"God shuts the lions’ mouths, and Darius commands his whole kingdom to fear Daniel’s God.","refs":["DAN 6:19-28"],"scenes":[{"t":"At first light","r":"DAN 6:19-22","b":["At the first light of dawn the king gets up and hurries to the den.","He calls in an anguished voice, “Daniel, servant of the living God, has your God, whom you serve continually, been able to rescue you from the lions?”","Daniel answers, “May the king live for ever! My God sent his angel and shut the mouths of the lions.”","“They have not hurt me, because I was found innocent in his sight. Nor have I ever done any wrong before you, O king.”"]},{"t":"Lifted out without a wound","r":"DAN 6:23-24","b":["The king is overjoyed and orders Daniel lifted out of the den.","No wound is found on him, because he had trusted in his God.","The men who had accused Daniel are thrown into the den with their wives and children. The lions overpower them before they reach the floor."]},{"t":"Darius’s decree","r":"DAN 6:25-28","b":["Darius writes to all the peoples, nations and languages: in every part of his kingdom people must fear and reverence the God of Daniel.","“He is the living God and he endures for ever. His kingdom will not be destroyed. He rescues and he saves. He has rescued Daniel from the power of the lions.”","So Daniel prospers during the reign of Darius and the reign of Cyrus the Persian."]}],"y":537.3},{"id":"cyrus","g":"g4","date":"c. 538 BC","yr":"538","tag":"Meanwhile","title":"Cyrus sends the exiles home","hook":"The seventy years run out, and the vessels taken in Daniel 1 go back to Jerusalem.","refs":["EZR 1:1-11","2CH 36:22-23","ISA 44:24-28","ISA 45:1-4"],"thread":"The temple articles carried off in Daniel 1:2 are counted out and returned in Ezra 1:7–11.","scenes":[{"t":"Named in advance","r":"ISA 45:1-4","b":["Through Isaiah, the Lord had said of Cyrus, “He is my shepherd and will accomplish all that I please.” He would say of Jerusalem, “Let it be rebuilt,” and of the temple, “Let its foundations be laid.”","The Lord calls Cyrus his anointed, whose right hand he takes hold of to subdue nations before him.","He summons him by name for the sake of Israel his chosen, though Cyrus does not know him."]},{"t":"The Lord stirs a king’s heart","r":"EZR 1:1","b":["In the first year of Cyrus king of Persia, the Lord moves the heart of Cyrus in order to fulfil the word spoken by Jeremiah.","Cyrus makes a proclamation throughout his realm and also puts it in writing."]},{"t":"The decree","r":"EZR 1:2-4","b":["“The Lord, the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a temple for him at Jerusalem in Judah.”","Any of his people may go up to Jerusalem and build the temple of the Lord, “and may their God be with them.”","Their neighbours are to provide them with silver and gold, goods and livestock, and freewill offerings for the temple."]},{"t":"Hearts moved to go","r":"EZR 1:5-6","b":["The family heads of Judah and Benjamin, the priests and the Levites prepare to go up: everyone whose heart God has moved.","All their neighbours assist them with articles of silver and gold, goods, livestock and valuable gifts."]},{"t":"The vessels come home","r":"EZR 1:7-11","b":["King Cyrus brings out the articles belonging to the temple of the Lord, which Nebuchadnezzar had carried away from Jerusalem and placed in the temple of his god.","They are counted out to Sheshbazzar, the prince of Judah.","In all, 5,400 articles of gold and silver are brought up with the exiles from Babylon to Jerusalem."]},{"t":"Daniel is still in Persia","r":"DAN 10:1-4","b":["Two years later, in the third year of Cyrus, Daniel is still receiving revelation, standing on the bank of the Tigris.","Scripture does not record that Daniel returned to Jerusalem."]}],"y":538},{"id":"dan10a","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 10","ch":10,"sub":0,"subs":2,"title":"Three weeks of mourning and the man in linen","hook":"By the Tigris, Daniel sees a man like lightning and falls on his face.","refs":["DAN 10:1-9"],"scenes":[{"t":"A message about a great conflict","r":"DAN 10:1","b":["In the third year of Cyrus king of Persia, a revelation is given to Daniel, who is called Belteshazzar.","Its message is true, and it concerns a great war. The understanding of it comes to him in a vision."]},{"t":"Three weeks of mourning","r":"DAN 10:2-3","b":["At that time Daniel mourns for three full weeks.","He eats no choice food, no meat or wine touches his lips, and he uses no lotions until the three weeks are over."]},{"t":"The man in linen","r":"DAN 10:4-6","b":["On the twenty-fourth day of the first month, Daniel is standing on the bank of the great river, the Tigris.","He looks up and sees a man dressed in linen, with a belt of fine gold around his waist.","His body is like topaz, his face like lightning, his eyes like flaming torches, his arms and legs like the gleam of polished bronze, and his voice like the sound of a multitude."]},{"t":"Daniel is left alone","r":"DAN 10:7-9","b":["Only Daniel sees the vision. The men with him do not see it, but such terror overwhelms them that they run and hide.","Left alone, Daniel has no strength left, and his face turns deathly pale.","When he hears the sound of the man’s words, he falls into a deep sleep with his face to the ground."]}],"y":536.1},{"id":"dan10b","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 10","ch":10,"sub":1,"subs":2,"title":"Heard from the first day: twenty-one days of resistance","hook":"The prince of Persia withstood the messenger until Michael came to help.","refs":["DAN 10:10-21"],"scenes":[{"t":"“You are highly esteemed”","r":"DAN 10:10-12","b":["A hand touches him and sets him trembling on his hands and knees.","“Daniel, you who are highly esteemed, consider carefully the words I am about to speak to you, and stand up.” He stands, trembling.","“Do not be afraid, Daniel. Since the first day that you set your mind to gain understanding and to humble yourself before your God, your words were heard, and I have come in response to them.”"]},{"t":"Twenty-one days of resistance","r":"DAN 10:13-14","b":["“The prince of the Persian kingdom resisted me twenty-one days.”","“Then Michael, one of the chief princes, came to help me.”","Now he has come to explain what will happen to Daniel’s people in the future, for the vision concerns a time yet to come."]},{"t":"Strength for a speechless man","r":"DAN 10:15-19","b":["Daniel bows with his face toward the ground and cannot speak. One who looks like a man touches his lips, and he opens his mouth.","“How can I, your servant, talk with you, my lord? My strength is gone and I can hardly breathe.”","The one who looks like a man touches him again and gives him strength: “Do not be afraid, you who are highly esteemed. Peace! Be strong now; be strong.”","Daniel is strengthened and says, “Speak, my lord, since you have given me strength.”"]},{"t":"The battle behind the scenes","r":"DAN 10:20-21","b":["“Soon I will return to fight against the prince of Persia, and when I go, the prince of Greece will come.”","First he will tell Daniel what is written in the Book of Truth.","No one supports him against these princes except Michael, “your prince.”"]}],"y":536},{"id":"dan11a","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 11","ch":11,"sub":0,"subs":3,"title":"Persia, Greece, and the wars of north and south","hook":"Kings rise and fall, alliances fail, and the Beautiful Land lies between them.","refs":["DAN 11:2-19"],"scenes":[{"t":"Persia, then a mighty king","r":"DAN 11:2-4","b":["Three more kings will arise in Persia, and then a fourth, far richer than all the others. By his wealth he will stir up everyone against the kingdom of Greece.","Then a mighty king will arise, who will rule with great power and do as he pleases.","As soon as he has risen, his empire will be broken up and divided toward the four winds of heaven. It will not go to his descendants."]},{"t":"South and north begin","r":"DAN 11:5-9","b":["The king of the South will become strong, but one of his commanders will become even stronger and rule his own kingdom.","After some years they will become allies. The daughter of the king of the South will go to the king of the North to make an alliance, but she will not keep her power, and she will be given up.","One from her family line will attack the forces of the king of the North, enter his fortress and be victorious. He will carry their gods and valuable articles off to Egypt."]},{"t":"Generations of war","r":"DAN 11:10-19","b":["The sons of the king of the North will assemble a great army that sweeps on like a flood. The king of the South will march out in rage and defeat a large army, yet he will not remain triumphant.","The king of the North will return with a larger army. Violent men among Daniel’s own people will rebel in fulfilment of the vision, but without success.","He will capture a fortified city and establish himself in the Beautiful Land. He will give a daughter in marriage to overthrow the kingdom, but his plan will not succeed.","He will turn to the coastlands, but a commander will put an end to his insolence. He will stumble and fall, to be seen no more."]}],"y":535.95,"vision":{"text":"The angel names Persia and Greece (11:2) and describes a mighty king whose empire is broken up toward the four winds (11:3–4). The rest is told as a sequence of unnamed kings of the north and south, with the Beautiful Land between them.","hist":"Historians match these verses closely: the Persian kings down to Xerxes, who invaded Greece in 480 BC (verse 2); Alexander the Great and the division of his empire (verses 3–4); the Ptolemies of Egypt in the south and the Seleucids of Syria in the north (verses 5–20); and Antiochus IV Epiphanes, who was turned back from Egypt by a Roman fleet in 168 BC and desecrated the temple in 167 BC, which led to the Maccabean resistance (verses 21–35). On verses 36–45 interpreters divide. Some continue with Antiochus. Many conservative teachers see a final ruler at the time of the end, because the details do not match how Antiochus died."}},{"id":"dan11b","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 11","ch":11,"sub":1,"subs":3,"title":"The contemptible king and the desecrated temple","hook":"He seizes the throne by intrigue and sets up the abomination, but those who know their God stand firm.","refs":["DAN 11:20-35"],"scenes":[{"t":"A contemptible person takes the throne","r":"DAN 11:20-24","b":["His successor will send out a tax collector, and in a few years he will be destroyed, yet not in anger or in battle.","He will be succeeded by a contemptible person who has not been given the honour of royalty. He will seize the kingdom through intrigue.","An overwhelming army will be swept away before him, along with a prince of the covenant. He will act deceitfully and distribute plunder among his followers."]},{"t":"Wars against the South","r":"DAN 11:25-30","b":["He will stir up his strength against the king of the South, who will not be able to stand because of the plots devised against him by those who eat from his own table.","The two kings will sit at the same table and lie to each other, to no avail.","He will return to his own country with great wealth, but his heart will be set against the holy covenant.","At the appointed time he will invade the South again, but ships of the western coastlands will oppose him, and he will lose heart."]},{"t":"The temple is desecrated","r":"DAN 11:30-32","b":["He will turn back and vent his fury against the holy covenant, showing favour to those who forsake it.","His armed forces will desecrate the temple fortress, abolish the daily sacrifice, and set up the abomination that causes desolation.","With flattery he will corrupt those who have violated the covenant, but the people who know their God will firmly resist him."]},{"t":"The wise are refined","r":"DAN 11:33-35","b":["Those who are wise will instruct many, though for a time they will fall by the sword or be burned, captured or plundered.","When they fall they will receive a little help, and many who are not sincere will join them.","Some of the wise will stumble, so that they may be refined, purified and made spotless until the time of the end."]}],"y":535.9},{"id":"dan11c","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 11","ch":11,"sub":2,"subs":3,"title":"The king who exalts himself","hook":"He magnifies himself above every god, yet comes to his end with no one to help him.","refs":["DAN 11:36-45"],"scenes":[{"t":"The king who exalts himself","r":"DAN 11:36-39","b":["The king will do as he pleases. He will exalt and magnify himself above every god and will say unheard-of things against the God of gods.","He will be successful until the time of wrath is completed, for what has been determined must take place.","He will show no regard for the gods of his ancestors. Instead he will honour a god of fortresses, and he will distribute the land at a price."]},{"t":"His end","r":"DAN 11:40-45","b":["At the time of the end the king of the South will engage him in battle, and the king of the North will storm out against him with chariots, cavalry and a great fleet of ships.","He will invade the Beautiful Land. Many countries will fall, and he will gain control of the treasures of Egypt.","Reports from the east and the north will alarm him, and he will set out in a great rage to destroy many.","He will pitch his royal tents between the seas at the beautiful holy mountain. Yet he will come to his end, and no one will help him."]}],"y":535.85},{"id":"dan12a","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 12","ch":12,"sub":0,"subs":2,"title":"Michael arises and the sleepers awake","hook":"A time of distress, deliverance for those written in the book, and the wise shining like stars.","refs":["DAN 12:1-4"],"scenes":[{"t":"Michael stands up","r":"DAN 12:1","b":["At that time Michael, the great prince who protects Daniel’s people, will arise.","There will be a time of distress such as has not happened from the beginning of nations until then.","But at that time Daniel’s people will be delivered: everyone whose name is found written in the book."]},{"t":"Those who sleep will awake","r":"DAN 12:2-3","b":["Multitudes who sleep in the dust of the earth will awake, some to everlasting life, others to shame and everlasting contempt.","Those who are wise will shine like the brightness of the heavens.","Those who lead many to righteousness will shine like the stars for ever and ever."]},{"t":"Seal the book","r":"DAN 12:4","b":["Daniel is told to roll up and seal the words of the scroll until the time of the end.","Many will go here and there, and knowledge will increase."]}],"y":535.8,"vision":{"text":"The angel speaks of a time of distress without equal, the deliverance of everyone whose name is written in the book, and a resurrection to everlasting life or to everlasting contempt (12:1–2). The words are sealed until the time of the end (12:9).","hist":"The figures of 1,290 and 1,335 days are not explained in the text, and interpreters do not agree on them."}},{"id":"dan12b","g":"g4","date":"c. 536 BC","yr":"536","tag":"Daniel 12","ch":12,"sub":1,"subs":2,"title":"“Go your way, Daniel”","hook":"The book is sealed, the days are counted, and Daniel is promised rest and rising.","refs":["DAN 12:5-13"],"scenes":[{"t":"“How long?”","r":"DAN 12:5-7","b":["Daniel sees two others standing, one on each bank of the river.","One asks the man clothed in linen, who is above the waters, “How long will it be before these astonishing things are fulfilled?”","The man lifts both hands toward heaven and swears by him who lives for ever: it will be for a time, times and half a time. When the power of the holy people has finally been broken, all these things will be completed."]},{"t":"“I heard, but I did not understand”","r":"DAN 12:8-10","b":["Daniel asks, “My lord, what will the outcome of all this be?”","He replies, “Go your way, Daniel, because the words are rolled up and sealed until the time of the end.”","Many will be purified, made spotless and refined, but the wicked will continue to be wicked. None of the wicked will understand, but those who are wise will understand."]},{"t":"The counted days","r":"DAN 12:11-12","b":["From the time the daily sacrifice is abolished and the abomination that causes desolation is set up, there will be 1,290 days.","Blessed is the one who waits for and reaches the end of the 1,335 days."]},{"t":"Rest, then rise","r":"DAN 12:13","b":["“As for you, go your way till the end.”","“You will rest, and then at the end of the days you will rise to receive your allotted inheritance.”"]}],"y":535.7,"note":"The book does not record Daniel’s death. Its last sentence is a promise spoken to him."}];
const THREADS=[{"id":"vessels","en":["The temple vessels","Taken from God’s house, used at Belshazzar’s feast, sent home by Cyrus."],"ar":["آنية الهيكل","اتاخدت من بيت الله، واتشرب بيها في وليمة بيلشاصر، وكورش رجّعها."],"pts":[[701,"hezekiah","2KI 20:17","Isaiah: everything in the palace will be carried to Babylon","إشعياء: كل اللي في القصر هيتاخد لبابل"],[605,"dan1a","DAN 1:2","Vessels taken to the house of Babylon’s god","الآنية بتتاخد لبيت إله بابل"],[597,"exile597","2KI 24:13","Temple treasures carried off, Solomon’s gold cut up","خزاين الهيكل بتتاخد ودهب سليمان بيتكسّر"],[586,"fall586","2KI 25:13-15","Bronze, gold and silver taken to Babylon","النحاس والدهب والفضة بيتاخدوا لبابل"],[539.45,"dan5a","DAN 5:2-3","Belshazzar and his guests drink from them","بيلشاصر وضيوفه بيشربوا بيها"],[538,"cyrus","EZR 1:7-11","5,400 articles counted out and sent home","5400 قطعة بتتعدّ وترجع"]]},{"id":"roles","en":["Daniel’s rising roles","From captive trainee to one of the three highest officials of the empire."],"ar":["مناصب دانيال","من شاب مسبي تحت التدريب لواحد من أعلى تلات مسؤولين في الإمبراطورية."],"pts":[[604.2,"dan1e","DAN 1:19","Enters the king’s service","بيقف في خدمة الملك"],[602.6,"dan2e","DAN 2:48","Ruler of the province of Babylon, chief of the wise men","حاكم ولاية بابل ورئيس الحكما"],[550.6,"dan8c","DAN 8:27","Back at the king’s business after the vision","بيرجع لشغل الملك بعد الرؤيا"],[539.38,"dan5d","DAN 5:29","Proclaimed third ruler in the kingdom","بيتنادى التالت في المملكة"],[537.6,"dan6a","DAN 6:2-3","One of three administrators over 120 satraps","واحد من تلات وزرا على 120 مرزبان"],[537.3,"dan6d","DAN 6:28","Prospers under Darius and Cyrus","بينجح أيام داريوس وكورش"]]},{"id":"babylon","en":["Babylon’s fall foretold","Prophets named Babylon’s end long before the hand wrote on the wall."],"ar":["سقوط بابل متنبأ بيه","الأنبيا اتكلموا عن نهاية بابل قبل الإيد ما تكتب على الحيطة بزمان."],"pts":[[700,null,"ISA 13:17-19","Isaiah: the Medes will overthrow Babylon like Sodom","إشعياء: الماديين هيقلبوا بابل زي سدوم"],[606,"year605","JER 25:12","Jeremiah: after seventy years, Babylon will be punished","إرميا: بعد سبعين سنة بابل هتتعاقب"],[602.8,"dan2d","DAN 2:38-39","The head of gold, and another kingdom after it","الراس الدهب، ومملكة تانية بعدها"],[594,null,"JER 51:59-64","Jeremiah’s scroll against Babylon sunk in the Euphrates","دَرج إرميا ضد بابل بيغرق في الفرات"],[550.6,"dan8c","DAN 8:20","Gabriel names Media and Persia","جبرائيل بيسمّي مادي وفارس"],[539.38,"dan5d","DAN 5:26-31","Weighed and found wanting; taken that night","اتوزنت واتلقت ناقصة، واتاخدت في نفس الليلة"]]},{"id":"seventy","en":["Seventy years","Jeremiah’s number, read by Daniel, fulfilled by Cyrus."],"ar":["السبعين سنة","رقم إرميا، اللي دانيال قراه، وكورش تمّمه."],"pts":[[606,"year605","JER 25:11","These nations will serve Babylon seventy years","الأمم دي هتخدم بابل سبعين سنة"],[595,"exile597","JER 29:10","When seventy years are completed, I will bring you back","لما تكمل سبعين سنة هرجّعكم"],[586,"fall586","2CH 36:21","The land keeps its sabbaths for seventy years","الأرض بتستوفي سبوتها سبعين سنة"],[538.5,"dan9a","DAN 9:2","Daniel reads the seventy years in Jeremiah","دانيال بيقرا السبعين سنة في إرميا"],[538,"cyrus","EZR 1:1","Cyrus’s decree fulfils Jeremiah’s word","أمر كورش بيتمّم كلمة إرميا"]]}];
const VD={"DAN":{"4":{"o":1,"v":["من نبوخذناصّر الملك الى كل الشعوب والامم والألسنة الساكنين في الارض كلها ليكثر سلامكم.","الآيات والعجائب التي صنعها معي الله العلي حسن عندي ان اخبر بها.","آياته ما اعظمها وعجائبه ما اقواها. ملكوته ملكوت ابدي وسلطانه الى دور فدور","انا نبوخذناصّر قد كنت مطمئنا في بيتي وناضرا في قصري.","رأيت حلما فروّعني والافكار على فراشي ورؤى راسي افزعتني.","فصدر مني امر باحضار جميع حكماء بابل قدامي ليعرفوني بتعبير الحلم.","حينئذ حضر المجوس والسحرة والكلدانيون والمنجمون وقصصت الحلم عليهم فلم يعرفوني بتعبيره.","اخيرا دخل قدامي دانيال الذي اسمه بلطشاصر كاسم الهي والذي فيه روح الآلهة القدوسين فقصصت الحلم قدامه","يا بلطشاصر كبير المجوس من حيث اني اعلم ان فيك روح الآلهة القدوسين ولا يعسر عليك سرّ فاخبرني برؤى حلمي الذي رايته وبتعبيره.","فرؤى راسي على فراشي هي اني كنت ارى فاذا بشجرة في وسط الارض وطولها عظيم.","فكبرت الشجرة وقويت فبلغ علوها الى السماء ومنظرها الى اقصى كل الارض.","اوراقها جميلة وثمرها كثير وفيها طعام للجميع وتحتها استظل حيوان البر وفي اغصانها سكنت طيور السماء وطعم منها كل البشر.","كنت ارى في رؤى راسي على فراشي واذا بساهر وقدوس نزل من السماء","فصرخ بشدة وقال هكذا. اقطعوا الشجرة واقضبوا اغصانها وانثروا اوراقها وابذروا ثمرها ليهرب الحيوان من تحتها والطيور من اغصانها.","ولكن اتركوا ساق اصلها في الارض وبقيد من حديد ونحاس في عشب الحقل وليبتلّ بندى السماء وليكن نصيبه مع الحيوان في عشب الحقل","ليتغيّر قلبه عن الانسانية وليعط قلب حيوان ولتمضي عليه سبعة ازمنة.","هذا الأمر بقضاء الساهرين والحكم بكلمة القدوسين لكي تعلم الاحياء ان العلي متسلط في مملكة الناس فيعطيها من يشاء وينصب عليها ادنى الناس.","هذا الحلم رأيته انا نبوخذناصّر الملك. اما انت يا بلطشاصر فبيّن تعبيره لان كل حكماء مملكتي لا يستطيعون ان يعرفوني بالتعبير. اما انت فتستطيع لان فيك روح الآلهة القدوسين","حينئذ تحيّر دانيال الذي اسمه بلطشاصر ساعة واحدة وافزعته افكاره. اجاب الملك وقال يا بلطشاصر لا يفزعك الحلم ولا تعبيره. فاجاب بلطشاصر وقال يا سيدي الحلم لمبغضيك وتعبيره لاعاديك.","الشجرة التي رأيتها التي كبرت وقويت وبلغ علوها الى السماء ومنظرها الى كل الارض","واوراقها جميلة وثمرها كثير وفيها طعام للجميع وتحتها سكن حيوان البر وفي اغصانها سكنت طيور السماء","انما هي انت يا ايها الملك الذي كبرت وتقويت وعظمتك قد زادت وبلغت الى السماء وسلطانك الى اقصى الارض.","وحيث رأى الملك ساهرا وقدوسا نزل من السماء وقال اقطعوا الشجرة واهلكوها ولكن اتركوا ساق اصلها في الارض وبقيد من حديد ونحاس في عشب الحقل وليبتلّ بندى السماء وليكن نصيبه مع حيوان البر حتى تمضي عليه سبعة ازمنة.","فهذا هو التعبير ايها الملك وهذا هو قضاء العلي الذي يأتي على سيدي الملك.","يطردونك من بين الناس وتكون سكناك مع حيوان البر ويطعمونك العشب كالثيران ويبلونك بندى السماء فتمضي عليك سبعة ازمنة حتى تعلم ان العلي متسلط في مملكة الناس ويعطيها من يشاء.","وحيث أمروا بترك ساق اصول الشجرة فان مملكتك تثبت لك عندما تعلم ان السماء سلطان.","لذلك ايها الملك فلتكن مشورتي مقبولة لديك وفارق خطاياك بالبر وآثامك بالرحمة للمساكين لعله يطال اطمئنانك","كل هذا جاء على نبوخذناصّر الملك.","عند نهاية اثني عشر شهرا كان يتمشى على قصر مملكة بابل.","واجاب الملك فقال أليست هذه بابل العظيمة التي بنيتها لبيت الملك بقوة اقتداري ولجلال مجدي.","والكلمة بعد في فم الملك وقع صوت من السماء قائلا لك يقولون يا نبوخذناصّر الملك ان الملك قد زال عنك","ويطردونك من بين الناس وتكون سكناك مع حيوان البر ويطعمونك العشب كالثيران فتمضي عليك سبعة ازمنة حتى تعلم ان العلي متسلط في مملكة الناس وانه يعطيها من يشاء","في تلك الساعة تم الأمر على نبوخذناصّر فطرد من بين الناس واكل العشب كالثيران وابتلّ جسمه بندى السماء حتى طال شعره مثل النسور واظفاره مثل الطيور","وعند انتهاء الايام انا نبوخذناصّر رفعت عينيّ الى السماء فرجع اليّ عقلي وباركت العلي وسبحت وحمدت الحي الى الابد الذي سلطانه سلطان ابدي وملكوته الى دور فدور.","وحسبت جميع سكان الارض كلا شيء وهو يفعل كما يشاء في جند السماء وسكان الارض ولا يوجد من يمنع يده او يقول له ماذا تفعل.","في ذلك الوقت رجع اليّ عقلي وعاد اليّ جلال مملكتي ومجدي وبهائي وطلبني مشيريّ وعظمائي وتثبّت على مملكتي وازدادت لي عظمة كثيرة.","فالآن انا نبوخذناصّر اسبح واعظم واحمد ملك السماء الذي كل اعماله حق وطرقه عدل ومن يسلك بالكبرياء فهو قادر على ان يذلّه"]},"5":{"o":1,"v":["بيلشاصّر الملك صنع وليمة عظيمة لعظمائه الالف وشرب خمرا قدام الالف.","واذ كان بيلشاصر يذوق الخمر أمر باحضار آنية الذهب والفضة التي اخرجها نبوخذناصّر ابوه من الهيكل الذي في اورشليم ليشرب بها الملك وعظماؤه وزوجاته وسراريه.","حينئذ احضروا آنية الذهب التي أخرجت من هيكل بيت الله الذي في اورشليم وشرب بها الملك وعظماؤه وزوجاته وسراريه.","كانوا يشربون الخمر ويسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر","في تلك الساعة ظهرت اصابع يد انسان وكتبت بازاء النبراس على مكلس حائط قصر الملك والملك ينظر طرف اليد الكاتبة.","حينئذ تغيّرت هيئة الملك وافزعته افكاره وانحلّت خرز حقويه واصطكت ركبتاه.","فصرخ الملك بشدة لادخال السحرة والكلدانيين والمنجمين. فاجاب الملك وقال لحكماء بابل اي رجل يقرأ هذه الكتابة ويبيّن لي تفسيرها فانه يلبّس الارجوان وقلادة من ذهب في عنقه ويتسلط ثالثا في المملكة.","ثم دخل كل حكماء الملك فلم يستطيعوا ان يقرأوا الكتابة ولا ان يعرّفوا الملك بتفسيرها.","ففزع الملك بيلشاصر جدا وتغيّرت فيه هيئته واضطرب عظماؤه.","اما الملكة فلسبب كلام الملك وعظمائه دخلت بيت الوليمة فاجابت الملكة وقالت ايها الملك عش الى الابد. لا تفزعك افكارك ولا تتغيّر هيئتك.","يوجد في مملكتك رجل فيه روح الآلهة القدوسين وفي ايام ابيك وجدت فيه نيّرة وفطنة وحكمة كحكمة الآلهة والملك نبوخذناصّر ابوك جعله كبير المجوس والسحرة والكلدانيين والمنجمين. ابوك الملك.","من حيث ان روحا فاضلة ومعرفة وفطنة وتعبير الاحلام وتبيين ألغاز وحلّ عقد وجدت في دانيال هذا الذي سماه الملك بلطشاصر. فليدع الآن دانيال فيبيّن التفسير","حينئذ ادخل دانيال الى قدام الملك. فاجاب الملك وقال لدانيال أأنت هو دانيال من بني سبي يهوذا الذي جلبه ابي الملك من يهوذا.","قد سمعت عنك ان فيك روح الآلهة وان فيك نيّرة وفطنة وحكمة فاضلة.","والآن أدخل قدامي الحكماء والسحرة ليقرأوا هذه الكتابة ويعرّفوني بتفسيرها فلم يستطيعوا ان يبيّنوا تفسير الكلام.","وانا قد سمعت عنك انك تستطيع ان تفسر تفسيرا وتحل عقدا. فان استطعت الآن ان تقرأ الكتابة وتعرّفني بتفسيرها فتلبّس الارجوان وقلادة من ذهب في عنقك وتتسلط ثالثا في المملكة","فاجاب دانيال وقال قدام الملك. لتكن عطاياك لنفسك وهب هباتك لغيري. لكني اقرأ الكتابة للملك واعرّفه بالتفسير.","انت ايها الملك فالله العلي اعطى اباك نبوخذناصّر ملكوتا وعظمة وجلالا وبهاء.","وللعظمة التي اعطاه اياها كانت ترتعد وتفزع قدامه جميع الشعوب والامم والألسنة. فايّا شاء قتل وايّا شاء استحيا وايّا شاء رفع وايّا شاء وضع.","فلما ارتفع قلبه وقست روحه تجبّرا انحط عن كرسي ملكه ونزعوا عنه جلاله","وطرد من بين الناس وتساوى قلبه بالحيوان وكانت سكناه مع الحمير الوحشية فاطعموه العشب كالثيران وابتلّ جسمه بندى السماء حتى علم ان الله العلي سلطان في مملكة الناس وانه يقيم عليها من يشاء.","وانت يا بيلشاصر ابنه لم تضع قلبك مع انك عرفت كل هذا.","بل تعظمت على رب السماء فاحضروا قدامك آنية بيته وانت وعظمائك وزوجاتك وسراريك شربتم بها الخمر وسبّحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تعرف. اما الله الذي بيده نسمتك وله كل طرقك فلم تمجده.","حينئذ أرسل من قبله طرف اليد فكتبت هذه الكتابة.","وهذه هي الكتابة التي سطّرت. منا منا تقيل وفرسين.","وهذا تفسير الكلام منا احصى الله ملكوتك وانهاه.","تقيل وزنت بالموازين فوجدت ناقصا.","فرس قسمت مملكتك وأعطيت لمادي وفارس","حينئذ أمر بيلشاصر ان يلبّسوا دانيال الارجوان وقلادة من ذهب في عنقه وينادوا عليه انه يكون متسلطا ثالثا في المملكة.","في تلك الليلة قتل بيلشاصر ملك الكلدانيين","فاخذ المملكة داريوس المادي وهو ابن اثنتين وستين سنة"]},"7":{"o":1,"v":["في السنة الاولى لبيلشاصر ملك بابل رأى دانيال حلما ورؤى راسه على فراشه. حينئذ كتب الحلم واخبر براس الكلام.","اجاب دانيال وقال. كنت ارى في رؤياي ليلا واذا باربع رياح السماء هجمت على البحر الكبير.","وصعد من البحر اربعة حيوانات عظيمة هذا مخالف ذاك.","الاول كالاسد وله جناحا نسر. وكنت انظر حتى انتتف جناحاه وانتصب على الارض وأوقف على رجلين كانسان وأعطي قلب انسان.","واذا بحيوان آخر ثان شبيه بالدب فارتفع على جنب واحد وفي فمه ثلاثة اضلع بين اسنانه فقالوا له هكذا. قم كل لحما كثيرا.","وبعد هذا كنت ارى واذا بآخر مثل النمر وله على ظهره اربعة اجنحة طائر. وكان للحيوان اربعة رؤوس وأعطي سلطانا.","بعد هذا كنت ارى في رؤى الليل واذا بحيوان رابع هائل وقوي وشديد جدا وله اسنان من حديد كبيرة. اكل وسحق وداس الباقي برجليه. وكان مخالفا لكل الحيوانات الذين قبله وله عشرة قرون.","كنت متأملا بالقرون واذا بقرن آخر صغير طلع بينها وقلعت ثلاثة من القرون الاولى من قدامه واذا بعيون كعيون الانسان في هذا القرن وفم متكلم بعظائم.","كنت ارى انه وضعت عروش وجلس القديم الايام. لباسه ابيض كالثلج وشعر راسه كالصوف النقي وعرشه لهيب نار وبكراته نار متقدة.","نهر نار جرى وخرج من قدامه. ألوف ألوف تخدمه وربوات ربوات وقوف قدامه. فجلس الدين وفتحت الاسفار.","كنت انظر حينئذ من اجل صوت الكلمات العظيمة التي تكلم بها القرن. كنت ارى الى ان قتل الحيوان وهلك جسمه ودفع لوقيد النار.","اما باقي الحيوانات فنزع عنهم سلطانهم ولكن اعطوا طول حياة الى زمان ووقت","كنت ارى في رؤى الليل واذا مع سحب السماء مثل ابن انسان اتى وجاء الى القديم الايام فقربوه قدامه.","فأعطي سلطانا ومجدا وملكوتا لتتعبّد له كل الشعوب والامم والألسنة. سلطانه سلطان ابدي ما لن يزول وملكوته ما لا ينقرض","اما انا دانيال فحزنت روحي في وسط جسمي وافزعتني رؤى راسي.","فاقتربت الى واحد من الوقوف وطلبت منه الحقيقة في كل هذا. فاخبرني وعرّفني تفسير الامور.","هؤلاء الحيوانات العظيمة التي هي اربعة هي اربعة ملوك يقومون على الارض.","اما قديسوا العلي فيأخذون المملكة ويمتلكون المملكة الى الابد والى ابد الآبدين.","حينئذ رمت الحقيقة من جهة الحيوان الرابع الذي كان مخالفا لكلها وهائلا جدا واسنانه من حديد واظفاره من نحاس وقد اكل وسحق وداس الباقي برجليه.","وعن القرون العشرة التي براسه وعن الآخر الذي طلع فسقطت قدامه ثلاثة وهذا القرن له عيون وفم متكلم بعظائم ومنظره اشد من رفقائه.","وكنت انظر واذا هذا القرن يحارب القديسين فغلبهم","حتى جاء القديم الايام وأعطي الدين لقديسي العلي وبلغ الوقت فامتلك القديسون المملكة","فقال هكذا. اما الحيوان الرابع فتكون مملكة رابعة على الارض مخالفة لسائر الممالك فتاكل الارض كلها وتدوسها وتسحقها.","والقرون العشرة من هذه المملكة هي عشرة ملوك يقومون ويقوم بعدهم آخر وهو مخالف الاولين ويذل ثلاثة ملوك.","ويتكلم بكلام ضد العلي ويبلي قديسي العلي ويظن انه يغيّر الاوقات والسّنّة ويسلمون ليده الى زمان وازمنة ونصف زمان.","فيجلس الدين وينزعون عنه سلطانه ليفنوا ويبيدوا الى المنتهى.","والمملكة والسلطان وعظمة المملكة تحت كل السماء تعطى لشعب قديسي العلي. ملكوته ملكوت ابدي وجميع السلاطين اياه يعبدون ويطيعون.","الى هنا نهاية الامر. اما انا دانيال فافكاري افزعتني كثيرا وتغيّرت عليّ هيئتي وحفظت الأمر في قلبي"]},"10":{"o":1,"v":["في السنة الثالثة لكورش ملك فارس كشف امر لدانيال الذي سمي باسم بلطشاصر. والامر حق والجهاد عظيم وفهم الأمر وله معرفة الرؤيا.","في تلك الايام انا دانيال كنت نائحا ثلاثة اسابيع ايام.","لم آكل طعاما شهيّا ولم يدخل في فمي لحم ولا خمر ولم ادهن حتى تمت ثلاثة اسابيع ايام.","وفي اليوم الرابع والعشرين من الشهر الاول اذ كنت على جانب النهر العظيم هو دجلة","رفعت عينيّ ونظرت فاذا برجل لابس كتانا وحقواه متنطقان بذهب اوفاز","وجسمه كالزبرجد ووجهه كمنظر البرق وعيناه كمصباحي نار وذراعاه ورجلاه كعين النحاس المصقول وصوت كلامه كصوت جمهور.","فرأيت انا دانيال الرؤيا وحدي والرجال الذين كانوا معي لم يروا الرؤيا لكن وقع عليهم ارتعاد عظيم فهربوا ليختبئوا.","فبقيت انا وحدي ورأيت هذه الرؤيا العظيمة ولم تبق فيّ قوة ونضارتي تحولت فيّ الى فساد ولم اضبط قوة.","وسمعت صوت كلامه ولما سمعت صوت كلامه كنت مسبّخا على وجهي ووجهي الى الارض.","واذ بيد لمستني واقامتني مرتجفا على ركبتيّ وعلى كفيّ يديّ.","وقال لي يا دانيال ايها الرجل المحبوب افهم الكلام الذي اكلمك به وقم على مقامك لاني الآن أرسلت اليك. ولما تكلم معي بهذا الكلام قمت مرتعدا.","فقال لي لا تخف يا دانيال لانه من اليوم الاول الذي فيه جعلت قلبك للفهم ولاذلال نفسك قدام الهك سمع كلامك وانا اتيت لاجل كلامك.","ورئيس مملكة فارس وقف مقابلي واحدا وعشرين يوما وهوذا ميخائيل واحد من الرؤساء الاولين جاء لاعانتي وانا أبقيت هناك عند ملوك فارس.","وجئت لافهمك ما يصيب شعبك في الايام الاخيرة لان الرؤيا الى ايام بعد","فلما تكلم معي بمثل هذا الكلام جعلت وجهي الى الارض وصمت.","وهوذا كشبه بني آدم لمس شفتيّ ففتحت فمي وتكلمت وقلت للواقف امامي يا سيدي بالرؤيا انقلبت عليّ اوجاعي فما ضبطت قوّة.","فكيف يستطيع عبد سيدي هذا ان يتكلم مع سيدي هذا وانا فحالا لم تثبت فيّ قوّة ولم تبق فيّ نسمة.","فعاد ولمسني كمنظر انسان وقوّاني.","وقال لا تخف ايها الرجل المحبوب سلام لك. تشدد. تقوّ. ولما كلمني تقويت وقلت ليتكلم سيدي لانك قوّيتني.","فقال هل عرفت لماذا جئت اليك. فالآن ارجع واحارب رئيس فارس. فاذا خرجت هوذا رئيس اليونان ياتي.","ولكني اخبرك بالمرسوم في كتاب الحق. ولا احد يتمسك معي على هؤلاء الا ميخائيل رئيسكم"]},"12":{"o":1,"v":["وفي ذلك الوقت يقوم ميخائيل الرئيس العظيم القائم لبني شعبك ويكون زمان ضيق لم يكن منذ كانت امة الى ذلك الوقت وفي ذلك الوقت ينجى شعبك كل من يوجد مكتوبا في السفر","وكثيرون من الراقدين في تراب الارض يستيقظون هؤلاء الى الحياة الابدية وهؤلاء الى العار للازدراء الابدي.","والفاهمون يضيئون كضياء الجلد والذين ردوا كثيرين الى البر كالكواكب الى ابد الدهور","اما انت يا دانيال فاخف الكلام واختم السفر الى وقت النهاية. كثيرون يتصفحونه والمعرفة تزداد","فنظرت انا دانيال واذا باثنين آخرين قد وقفا واحد من هنا على شاطئ النهر وآخر من هناك على شاطئ النهر.","وقال للرجل اللابس الكتان الذي من فوق مياه النهر الى متى انتهاء العجائب.","فسمعت الرجل اللابس الكتان الذي من فوق مياه النهر اذ رفع يمناه ويسراه نحو السموات وحلف بالحي الى الابد انه الى زمان وزمانين ونصف. فاذا تم تفريق ايدي الشعب المقدس تتم كل هذه.","وانا سمعت وما فهمت. فقلت يا سيدي ما هي آخر هذه.","فقال اذهب يا دانيال لان الكلمات مخفية ومختومة الى وقت النهاية.","كثيرون يتطهرون ويبيّضون ويمحّصون. اما الاشرار فيفعلون شرا ولا يفهم احد الاشرار لكن الفاهمون يفهمون.","ومن وقت ازالة المحرقة الدائمة واقامة رجس المخرب الف ومئتان وتسعون يوما.","طوبى لمن ينتظر ويبلغ الى الالف والثلاث مئة والخمسة والثلاثين يوما.","اما انت فاذهب الى النهاية فتستريح وتقوم لقرعتك في نهاية الايام"]},"2":{"o":1,"v":["وفي السنة الثانية من ملك نبوخذناصّر حلم نبوخذناصّر احلاما فانزعجت روحه وطار عنه نومه.","فأمر الملك بان يستدعى المجوس والسحرة والعرّافون والكلدانيون ليخبروا الملك باحلامه فأتوا ووقفوا امام الملك.","فقال لهم الملك قد حلمت حلما وانزعجت روحي لمعرفة الحلم.","فكلم الكلدانيون الملك بالارامية عش ايها الملك الى الابد. اخبر عبيدك بالحلم فنبيّن تعبيره.","فاجاب الملك وقال للكلدانيين قد خرج مني القول ان لم تنبئوني بالحلم وبتعبيره تصيرون إربا إربا وتجعل بيوتكم مزبلة.","وان بيّنتم الحلم وتعبيره تنالون من قبلي هدايا وحلاوين واكراما عظيما فبيّنوا لي الحلم وتعبيره.","فاجابوا ثانية وقالوا ليخبر الملك عبيده بالحلم فنبين تعبيره.","اجاب الملك وقال اني اعلم يقينا انكم تكتسبون وقتا اذ رأيتم ان القول قد خرج مني","بانه ان لم تنبئوني بالحلم فقضاؤكم واحد. لانكم قد اتفقتم على كلام كذب وفاسد لتتكلموا به قدامي الى ان يتحول الوقت. فاخبروني بالحلم فاعلم انكم تبيّنون لي تعبيره.","اجاب الكلدانيون قدام الملك وقالوا ليس على الارض انسان يستطيع ان يبيّن امر الملك. لذلك ليس ملك عظيم ذو سلطان سأل امرا مثل هذا من مجوسي او ساحر او كلداني.","والأمر الذي يطلبه الملك عسر وليس آخر يبيّنه قدام الملك غير الآلهة الذين ليست سكناهم مع البشر","لاجل ذلك غضب الملك واغتاظ جدا وامر بابادة كل حكماء بابل.","فخرج الأمر وكان الحكماء يقتلون فطلبوا دانيال واصحابه ليقتلوهم.","حينئذ اجاب دانيال بحكمة وعقل لأريوخ رئيس شرط الملك الذي خرج ليقتل حكماء بابل.","اجاب وقال لأريوخ قائد الملك لماذا اشتد الامر من قبل الملك. حينئذ اخبر أريوخ دانيال بالامر.","فدخل دانيال وطلب من الملك ان يعطيه وقتا فيبيّن للملك التعبير.","حينئذ مضى دانيال الى بيته واعلم حننيا وميشائيل وعزريا اصحابه بالأمر","ليطلبوا المراحم من قبل اله السموات من جهة هذا السر لكي لا يهلك دانيال واصحابه مع سائر حكماء بابل","حينئذ لدانيال كشف السر في رؤيا الليل. فبارك دانيال اله السموات.","اجاب دانيال وقال ليكن اسم الله مباركا من الازل والى الابد لان له الحكمة والجبروت.","وهو يغيّر الاوقات والازمنة يعزل ملوكا وينصب ملوكا. يعطي الحكماء حكمة ويعلم العارفين فهما.","هو يكشف العمائق والاسرار. يعلم ما هو في الظلمة وعنده يسكن النور.","اياك يا اله آبائي احمد واسبح الذي اعطاني الحكمة والقوة واعلمني الآن ما طلبناه منك لانك اعلمتنا امر الملك.","فمن اجل ذلك دخل دانيال الى أريوخ الذي عيّنه الملك لابادة حكماء بابل. مضى وقال له هكذا. لا تبد حكماء بابل. ادخلني الى قدام الملك فابيّن للملك التعبير.","حينئذ دخل أريوخ بدانيال الى قدام الملك مسرعا وقال له هكذا. قد وجدت رجلا من بني سبي يهوذا الذي يعرّف الملك بالتعبير.","اجاب الملك وقال لدانيال الذي اسمه بلطشاصر هل تستطيع انت على ان تعرّفني بالحلم الذي رأيت وبتعبيره.","اجاب دانيال قدام الملك وقال. السر الذي طلبه الملك لا تقدر الحكماء ولا السحرة ولا المجوس ولا المنجمون على ان يبيّنوه للملك.","لكن يوجد اله في السموات كاشف الاسرار وقد عرّف الملك نبوخذناصّر ما يكون في الايام الاخيرة. حلمك ورؤيا راسك على فراشك هو هذا.","انت يا ايها الملك افكارك على فراشك صعدت الى ما يكون من بعد هذا وكاشف الاسرار يعرّفك بما يكون.","اما انا فلم يكشف لي هذا السر لحكمة فيّ اكثر من كل الاحياء. ولكن لكي يعرّف الملك بالتعبير ولكي تعلم افكار قلبك","انت ايها الملك كنت تنظر واذا بتمثال عظيم. هذا التمثال العظيم البهي جدا وقف قبالتك ومنظره هائل.","راس هذا التمثال من ذهب جيد. صدره وذراعاه من فضة. بطنه وفخذاه من نحاس.","ساقاه من حديد. قدماه بعضهما من حديد والبعض من خزف.","كنت تنظر الى ان قطع حجر بغير يدين فضرب التمثال على قدميه اللتين من حديد وخزف فسحقهما.","فانسحق حينئذ الحديد والخزف والنحاس والفضة والذهب معا وصارت كعصافة البيدر في الصيف فحملتها الريح فلم يوجد لها مكان. اما الحجر الذي ضرب التمثال فصار جبلا كبيرا وملأ الارض كلها.","هذا هو الحلم. فنخبر بتعبيره قدام الملك","انت ايها الملك ملك ملوك لان اله السموات اعطاك مملكة واقتدارا وسلطانا وفخرا.","وحيثما يسكن بنو البشر ووحوش البر وطيور السماء دفعها ليدك وسلطك عليها جميعها. فانت هذا الراس من ذهب.","وبعدك تقوم مملكة اخرى اصغر منك ومملكة ثالثة اخرى من نحاس فتتسلط على كل الارض.","وتكون مملكة رابعة صلبة كالحديد لان الحديد يدق ويسحق كل شيء وكالحديد الذي يكسر تسحق وتكسّر كل هؤلاء.","وبما رأيت القدمين والاصابع بعضها من خزف والبعض من حديد فالمملكة تكون منقسمة ويكون فيها قوة الحديد من حيث انك رأيت الحديد مختلطا بخزف الطين.","واصابع القدمين بعضها من حديد والبعض من خزف فبعض المملكة يكون قويا والبعض قصما.","وبما رأيت الحديد مختلطا بخزف الطين فانهم يختلطون بنسل الناس ولكن لا يتلاصق هذا بذاك كما ان الحديد لا يختلط بالخزف.","وفي ايام هؤلاء الملوك يقيم اله السموات مملكة لن تنقرض ابدا وملكها لا يترك لشعب آخر وتسحق وتفني كل هذه الممالك وهي تثبت الى الابد.","لانك رأيت انه قد قطع حجر من جبل لا بيدين فسحق الحديد والنحاس والخزف والفضة والذهب. الله العظيم قد عرّف الملك ما سياتي بعد هذا. الحلم حق وتعبيره يقين","حينئذ خرّ نبوخذناصّر على وجهه وسجد لدانيال وأمر بان يقدموا له تقدمة وروائح سرور.","فاجاب الملك دانيال وقال. حقا ان الهكم اله الآلهة ورب الملوك وكاشف الاسرار اذ استطعت على كشف هذا السر.","حينئذ عظّم الملك دانيال واعطاه عطايا كثيرة عظيمة وسلطه على كل ولاية بابل وجعله رئيس الشحن على جميع حكماء بابل.","فطلب دانيال من الملك فولى شدرخ وميشخ وعبد نغو على اعمال ولاية بابل. اما دانيال فكان في باب الملك"]},"8":{"o":1,"v":["في السنة الثالثة من ملك بيلشاصر الملك ظهرت لي انا دانيال رؤيا بعد التي ظهرت لي في الابتداء","فرأيت في الرؤيا وكان في رؤياي وانا في شوشن القصر الذي في ولاية عيلام. ورأيت في الرؤيا وانا عند نهر أولاي","فرفعت عينيّ ورأيت واذا بكبش واقف عند النهر وله قرنان والقرنان عاليان والواحد اعلى من الآخر والاعلى طالع اخيرا.","رأيت الكبش ينطح غربا وشمالا وجنوبا فلم يقف حيوان قدامه ولا منقذ من يده وفعل كمرضاته وعظم.","وبينما كنت متأملا اذا بتيس من المعز جاء من المغرب على وجه كل الارض ولم يمسّ الارض وللتيس قرن معتبر بين عينيه.","وجاء الى الكبش صاحب القرنين الذي رايته واقفا عند النهر وركض اليه بشدة قوته.","ورأيته قد وصل الى جانب الكبش فاستشاط عليه وضرب الكبش وكسر قرنيه فلم تكن للكبش قوة على الوقوف امامه وطرحه على الارض وداسه ولم يكن للكبش منقذ من يده.","فتعظم تيس المعز جدا ولما اعتزّ انكسر القرن العظيم وطلع عوضا عنه اربعة قرون معتبرة نحو رياح السماء الاربع.","ومن واحد منها خرج قرن صغير وعظم جدا نحو الجنوب ونحو الشرق ونحو فخر الاراضي.","وتعظم حتى الى جند السموات وطرح بعضا من الجند والنجوم الى الارض وداسهم.","وحتى الى رئيس الجند تعظم وبه ابطلت المحرقة الدائمة وهدم مسكن مقدسه.","وجعل جند على المحرقة الدائمة بالمعصية فطرح الحق على الارض وفعل ونجح.","فسمعت قدوسا واحدا يتكلم فقال قدوس واحدا لفلان المتكلم الى متى الرؤيا من جهة المحرقة الدائمة ومعصية الخراب لبذل القدس والجند مدوسين.","فقال لي الى الفين وثلاث مئة صباح ومساء فيتبرأ القدس","وكان لما رأيت انا دانيال الرؤيا وطلبت المعنى اذا بشبه انسان واقف قبالتي.","وسمعت صوت انسان بين أولاي فنادى وقال يا جبرائيل فهّم هذا الرجل الرؤيا.","فجاء الى حيث وقفت ولما جاء خفت وخررت على وجهي. فقال لي افهم يا ابن آدم ان الرؤيا لوقت المنتهى.","واذ كان يتكلم معي كنت مسبخا على وجهي الى الارض فلمسني واوقفني على مقامي.","وقال هانذا اعرّفك ما يكون في آخر السخط. لان لميعاد الانتهاء.","اما الكبش الذي رأيته ذا القرنين فهو ملوك مادي وفارس.","والتيس العافي ملك اليونان والقرن العظيم الذي بين عينيه هو الملك الاول.","واذا انكسر وقام اربعة عوضا عنه فستقوم اربع ممالك من الامة ولكن ليس في قوته.","وفي آخر مملكتهم عند تمام المعاصي يقوم ملك جافي الوجه وفاهم الحيل.","وتعظم قوته ولكن ليس بقوته. يهلك عجبا وينجح ويفعل ويبيد العظماء وشعب القديسين.","وبحذاقته ينجح ايضا المكر في يده ويتعظم بقلبه وفي الاطمئنان يهلك كثيرين ويقوم على رئيس الرؤساء وبلا يد ينكسر.","فرؤيا المساء والصباح التي قيلت هي حق. اما انت فاكتم الرؤيا لانها الى ايام كثيرة.","وانا دانيال ضعفت ونحلت اياما ثم قمت وباشرت اعمال الملك وكنت متحيّرا من الرؤيا ولا فاهم"]},"6":{"o":1,"v":["حسن عند داريوس ان يولي على المملكة مئة وعشرين مرزبانا يكونون على المملكة كلها.","وعلى هؤلاء ثلاثة وزراء احدهم دانيال لتؤدي المرازبة اليهم الحساب فلا تصيب الملك خسارة.","ففاق دانيال هذا على الوزراء والمرازبة لان فيه روحا فاضلة وفكر الملك في ان يوليه على المملكة كلها.","ثم ان الوزراء والمرازبة كانوا يطلبون علّة يجدونها على دانيال من جهة المملكة فلم يقدروا ان يجدوا علّة ولا ذنبا لانه كان امينا ولم يوجد فيه خطأ ولا ذنب.","فقال هؤلاء الرجال لا نجد على دانيال هذا علّة الا ان نجدها من جهة شريعة الهه.","حينئذ اجتمع هؤلاء الوزراء والمرازبة عند الملك وقالوا له هكذا ايها الملك داريوس عش الى الابد.","ان جميع وزراء المملكة والشحن والمرازبة والمشيرين والولاة قد تشاوروا على ان يضعوا أمرا ملكيا ويشددوا نهيا بان كل من يطلب طلبة حتى ثلاثين يوما من اله او انسان الا منك ايها الملك يطرح في جب الأسود.","فثبّت الآن النهي ايها الملك وامض الكتابة لكي لا تتغيّر كشريعة مادي وفارس التي لا تنسخ.","لاجل ذلك امضى الملك داريوس الكتابة والنهي","فلما علم دانيال بامضاء الكتابة ذهب الى بيته وكواه مفتوحة في عليته نحو اورشليم فجثا على ركبتيه ثلاث مرات في اليوم وصلّى وحمد قدام الهه كما كان يفعل قبل ذلك.","فاجتمع جميع حينئذ هؤلاء الرجال فوجدوا دانيال يطلب ويتضرع قدام الهه.","فتقدموا وتكلموا قدام الملك في نهي الملك. ألم تمض ايها الملك نهيا بان كل انسان يطلب من اله او انسان حتى ثلاثين يوما الا منك ايها الملك يطرح في جب الأسود. فاجاب الملك وقال الامر صحيح كشريعة مادي وفارس التي لا تنسخ.","حينئذ اجابوا وقالوا قدام الملك ان دانيال الذي من بني سبي يهوذا لم يجعل لك ايها الملك اعتبارا ولا للنهي الذي امضيته بل ثلاث مرات في اليوم يطلب طلبته.","فلما سمع الملك هذا الكلام اغتاظ على نفسه جدا وجعل قلبه على دانيال لينجيه واجتهد الى غروب الشمس لينقذه.","فاجتمع اولئك الرجال الى الملك وقالوا للملك اعلم ايها الملك ان شريعة مادي وفارس هي ان كل نهي اوامر يضعه الملك لا يتغيّر.","حينئذ امر الملك فاحضروا دانيال وطرحوه في جب الأسود. اجاب الملك وقال لدانيال ان الهك الذي تعبده دائما هو ينجيك.","وأتي بحجر ووضع على فم الجب وختمه الملك بخاتمه وخاتم عظمائه لئلا يتغيّر القصد في دانيال","حينئذ مضى الملك الى قصره وبات صائما ولم يؤت قدامه بسراريه وطار عنه نومه.","ثم قام الملك باكرا عند الفجر وذهب مسرعا الى جب الأسود.","فلما اقترب الى الجب نادى دانيال بصوت اسيف. اجاب الملك وقال لدانيال يا دانيال عبد الله الحي هل الهك الذي تعبده دائما قدر على ان ينجيك من الأسود.","فتكلم دانيال مع الملك يا ايها الملك عش الى الابد.","الهي ارسل ملاكه وسدّ افواه الأسود فلم تضرّني لاني وجدت بريئا قدامه وقدامك ايضا ايها الملك لم افعل ذنبا.","حينئذ فرح الملك به وامر بان يصعد دانيال من الجب فأصعد دانيال من الجب ولم يوجد فيه ضرر لانه آمن بالهه.","فامر الملك فاحضروا اولئك الرجال الذين اشتكوا على دانيال وطرحوهم في جب الأسود هم واولادهم ونساءهم. ولم يصلوا الى اسفل الجب حتى بطشت بهم الأسود وسحقت كل عظامهم","ثم كتب الملك داريوس الى كل الشعوب والامم والألسنة الساكنين في الارض كلها. ليكثر سلامكم.","من قبلي صدر امر بانه في كل سلطان مملكتي يرتعدون ويخافون قدام اله دانيال لانه هو الاله الحي القيوم الى الابد وملكوته لن يزول وسلطانه الى المنتهى","هو ينجي وينقذ ويعمل الآيات والعجائب في السموات وفي الارض. هو الذي نجى دانيال من يد الأسود","فنجح دانيال هذا في ملك داريوس وفي ملك كورش الفارسي"]},"11":{"o":2,"v":["والآن اخبرك بالحق. هوذا ثلاثة ملوك ايضا يقومون في فارس والرابع يستغني بغنى اوفر من جميعهم وحسب قوّته بغناه يهيّج الجميع على مملكة اليونان.","ويقوم ملك جبار ويتسلط تسلطا عظيما ويفعل حسب ارادته.","وكقيامه تنكسر مملكته وتنقسم الى رياح السماء الاربع ولا لعقبه ولا حسب سلطانه الذي تسلط به لان مملكته تنقرض وتكون لآخرين غير اولئك.","ويتقوى ملك الجنوب. ومن رؤسائه من يقوى عليه ويتسلط. تسلط عظيم تسلطه.","وبعد سنين يتعاهدان وبنت ملك الجنوب تأتي الى ملك الشمال لاجراء الاتفاق ولكن لا تضبط الذراع قوة ولا يقوم هو ولا ذراعه. وتسلّم هي والذين اتوا بها والذي ولدها ومن قوّاها في تلك الاوقات.","ويقوم من فرع اصولها قائم مكانه ويأتي الى الجيش ويدخل حصن ملك الشمال ويعمل بهم ويقوى.","ويسبي الى مصر آلهتهم ايضا مع مسبوكاتهم وآنيتهم الثمينة من فضة وذهب ويقتصر سنين عن ملك الشمال.","فيدخل ملك الجنوب الى مملكته ويرجع الى ارضه","وبنوه يتهيجون فيجمعون جمهور جيوش عظيمة ويأتي آت ويغمر ويطمو ويرجع ويحارب حتى الى حصنه.","ويغتاظ ملك الجنوب ويخرج ويحاربه اي ملك الشمال ويقيم جمهورا عظيما فيسلّم الجمهور في يده.","فاذا رفع الجمهور يرتفع قلبه ويطرح ربوات ولا يعتزّ.","فيرجع ملك الشمال ويقيم جمهورا اكثر من الاول ويأتي بعد حين بعد سنين بجيش عظيم وثروة جزيلة.","وفي تلك الاوقات يقوم كثيرون على ملك الجنوب وبنو العتاة من شعبك يقومون لاثبات الرؤيا ويعثرون.","فيأتي ملك الشمال ويقيم مترسة وياخذ المدينة الحصينة فلا تقوم امامه ذراعا الجنوب ولا قومه المنتخب ولا تكون له قوة للمقاومة.","والآتي عليه يفعل كارادته وليس من يقف امامه ويقوم في الارض البهيّة وهي بالتمام بيده.","ويجعل وجهه ليدخل بسلطان كل مملكته ويجعل معه صلحا ويعطيه بنت النساء ليفسدها فلا تثبت ولا تكون له.","ويحوّل وجهه الى الجزائر وياخذ كثيرا منها ويزيل رئيس تعييره فضلا عن رد تعييره عليه.","ويحوّل وجهه الى حصون ارضه ويعثر ويسقط ولا يوجد","فيقوم مكانه من يعبر جابي الجزية في فخر المملكة وفي ايام قليلة ينكسر لا بغضب ولا بحرب.","فيقوم مكانه محتقر لم يجعلوا عليه فخر المملكة ويأتي بغتة ويمسك المملكة بالتملقات.","واذرع الجارف تجرف من قدامه وتنكسر وكذلك رئيس العهد.","ومن المعاهدة معه يعمل بالمكر ويصعد ويعظم بقوم قليل.","يدخل بغتة على اسمن البلاد ويفعله ما لم يفعل آباؤه ولا آباء آبائه. يبذر بينهم نهبا وغنيمة وغنى ويفكر افكاره على الحصون وذلك الى حين.","وينهض قوّته وقلبه على ملك الجنوب بجيش عظيم وملك الجنوب يتهيّج الى الحرب بجيش عظيم وقوي جدا ولكنه لا يثبت لانهم يدبرون عليه تدابير.","والآكلون اطايبه يكسرونه وجيشه يطمو ويسقط كثيرون قتلى.","وهذان الملكان قلبهما لفعل الشر ويتكلمان بالكذب على مائدة واحدة ولا ينجح لان الانتهاء بعد الى ميعاد.","فيرجع الى ارضه بغنى جزيل وقلبه على العهد المقدس فيعمل ويرجع الى ارضه","وفي الميعاد يعود ويدخل الجنوب ولكن لا يكون الآخر كالاول.","فتأتي عليه سفن من كتّيم فييئس ويرجع ويغتاظ على العهد المقدس ويعمل ويرجع ويصغى الى الذين تركوا العهد المقدس.","وتقوم منه اذرع وتنجس المقدس الحصين وتنزع المحرقة الدائمة وتجعل الرجس المخرب.","والمتعدون على العهد يغويهم بالتملقات اما الشعب الذين يعرفون الههم فيقوون ويعملون.","والفاهمون من الشعب يعلّمون كثيرين. ويعثرون بالسيف وباللهيب وبالسبي وبالنهب اياما.","فاذا عثروا يعانون عونا قليلا ويتصل بهم كثيرون بالتملقات.","وبعض الفاهمين يعثرون امتحانا لهم للتطهير وللتبييض الى وقت النهاية. لانه بعد الى الميعاد.","ويفعل الملك كارادته ويرتفع ويتعظم على كل اله ويتكلم بامور عجيبة على اله الآلهة وينجح الى اتمام الغضب لان المقضي به يجرى.","ولا يبالي بآلهة آبائه ولا بشهوة النساء وبكل اله لا يبالي لانه يتعظم على الكل.","ويكرم اله الحصون في مكانه والها لم تعرفه آباؤه يكرمه بالذهب والفضة وبالحجارة الكريمة والنفائس.","ويفعل في الحصون الحصينة باله غريب. من يعرفه يزيده مجدا ويسلطهم على كثيرين ويقسم الارض اجرة","ففي وقت النهاية يحاربه ملك الجنوب فيثور عليه ملك الشمال بمركبات وبفرسان وبسفن كثيرة ويدخل الاراضي ويجرف ويطمو.","ويدخل الى الارض البهيّة فيعثر كثيرون وهؤلاء يفلتون من يده ادوم وموآب ورؤساء بني عمون.","ويمد يده على الاراضي وارض مصر لا تنجو.","ويتسلط على كنوز الذهب والفضة وعلى كل نفائس مصر. واللوبيون والكوشيون عند خطواته.","وتفزعه اخبار من الشرق ومن الشمال فيخرج بغضب عظيم ليخرب وليحرم كثيرين.","وينصب فسطاطه بين البحور وجبل بهاء القدس ويبلغ نهايته ولا معين له"]},"9":{"o":1,"v":["في السنة الاولى لداريوس بن احشويروش من نسل الماديين الذي ملك على مملكة الكلدانيين","في السنة الاولى من ملكه انا دانيال فهمت من الكتب عدد السنين التي كانت عنها كلمة الرب الى ارميا النبي لكمالة سبعين سنة على خراب اورشليم.","فوجهت وجهي الى الله السيد طالبا بالصلاة والتضرعات بالصوم والمسح والرماد.","وصلّيت الى الرب الهي واعترفت وقلت ايها الرب الاله العظيم المهوب حافظ العهد والرحمة لمحبيه وحافظي وصاياه.","اخطأنا واثمنا وعملنا الشر وتمردنا وحدنا عن وصاياك وعن احكامك.","وما سمعنا من عبيدك الانبياء الذين باسمك كلموا ملوكنا ورؤساءنا وآباءنا وكل شعب الارض.","لك يا سيد البر. اما لنا فخزي الوجوه كما هو اليوم لرجال يهوذا ولسكان اورشليم ولكل اسرائيل القريبين والبعيدين في كل الاراضي التي طردتهم اليها من اجل خيانتهم التي خانوك اياها.","يا سيد لنا خزي الوجوه لملوكنا لرؤسائنا ولآبائنا لاننا اخطأنا اليك.","للرب الهنا المراحم والمغفرة لاننا تمردنا عليه.","وما سمعنا صوت الرب الهنا لنسلك في شرائعه التي جعلها امامنا عن يد عبيده الانبياء.","وكل اسرائيل قد تعدى على شريعتك وحادوا لئلا يسمعوا صوتك فسكبت علينا اللعنة والحلف المكتوب في شريعة موسى عبد الله لأننا اخطأنا اليه.","وقد اقام كلماته التي تكلم بها علينا وعلى قضاتنا الذين قضوا لنا ليجلب علينا شرا عظيما ما لم يجر تحت السموات كلها كما أجري على اورشليم.","كما كتب في شريعة موسى قد جاء علينا كل هذا الشر ولم نتضرع الى وجه الرب الهنا لنرجع من آثامنا ونفطن بحقك.","فسهر الرب على الشر وجلبه علينا لان الرب الهنا بار في كل اعماله التي عملها اذ لم نسمع صوته.","والآن ايها السيد الهنا الذي اخرجت شعبك من ارض مصر بيد قوية وجعلت لنفسك اسما كما هو هذا اليوم قد اخطأنا عملنا شرا.","يا سيد حسب كل رحمتك اصرف سخطك وغضبك عن مدينتك اورشليم جبل قدسك اذ لخطايانا ولآثام آبائنا صارت اورشليم وشعبك عارا عند جميع الذين حولنا.","فاسمع الآن يا الهنا صلاة عبدك وتضرعاته واضئ بوجهك على مقدسك الخرب من اجل السيد.","أمل اذنك يا الهي واسمع افتح عينيك وانظر خربنا والمدينة التي دعي اسمك عليها لانه لا لاجل برنا نطرح تضرعاتنا امام وجهك بل لاجل مراحمك العظيمة.","يا سيد اسمع يا سيد اغفر يا سيد اصغ واصنع. لا تؤخر من اجل نفسك يا الهي لان اسمك دعي على مدينتك وعلى شعبك","وبينما انا اتكلم واصلّي واعترف بخطيتي وخطية شعبي اسرائيل واطرح تضرعي امام الرب الهي عن جبل قدس الهي","وانا متكلم بعد بالصلاة اذا بالرجل جبرائيل الذي رأيته في الرؤيا في الابتداء مطارا واغفا لمسني عند وقت تقدمة المساء.","وفهمني وتكلم معي وقال يا دانيال اني خرجت الآن لاعلمك الفهم.","في ابتداء تضرعاتك خرج الامر وانا جئت لاخبرك لانك انت محبوب. فتأمل الكلام وافهم الرؤيا.","سبعون اسبوعا قضيت على شعبك وعلى مدينتك المقدسة لتكميل المعصية وتتميم الخطايا ولكفارة الاثم وليؤتى بالبر الابدي ولختم الرؤيا والنبوة ولمسح قدوس القدوسين.","فاعلم وافهم انه من خروج الامر لتجديد اورشليم وبنائها الى المسيح الرئيس سبعة اسابيع واثنان وستون اسبوعا يعود ويبنى سوق وخليج في ضيق الأزمنة.","وبعد اثنين وستين اسبوعا يقطع المسيح وليس له وشعب رئيس آت يخرب المدينة والقدس وانتهاؤه بغمارة والى النهاية حرب وخرب قضي بها.","ويثبت عهدا مع كثيرين في اسبوع واحد وفي وسط الاسبوع يبطل الذبيحة والتقدمة وعلى جناح الارجاس مخرب حتى يتم ويصبّ المقضي على المخرب"]},"1":{"o":1,"v":["في السنة الثالثة من ملك يهوياقيم ملك يهوذا ذهب نبوخذناصّر ملك بابل الى اورشليم وحاصرها.","وسلم الرب بيده يهوياقيم ملك يهوذا مع بعض آنية بيت الله فجاء بها الى ارض شنعار الى بيت الهه وادخل الآنية الى خزانة بيت الهه.","وأمر الملك أشفنز رئيس خصيانه بان يحضر من بني اسرائيل ومن نسل الملك ومن الشرفاء","فتيانا لا عيب فيهم حسان المنظر حاذقين في كل حكمة وعارفين معرفة وذوي فهم بالعلم والذين فيهم قوة على الوقوف في قصر الملك فيعلموهم كتابة الكلدانيين ولسانهم.","وعيّن لهم الملك وظيفة كل يوم بيومه من اطايب الملك ومن خمر مشروبه لتربيتهم ثلاث سنين وعند نهايتها يقفون امام الملك.","وكان بينهم من بني يهوذا دانيال وحننيا وميشائيل وعزريا.","فجعل لهم رئيس الخصيان اسماء فسمى دانيال بلطشاصر وحننيا شدرخ وميشائيل ميشخ وعزريا عبد نغو","اما دانيال فجعل في قلبه انه لا يتنجس باطايب الملك ولا بخمر مشروبه فطلب من رئيس الخصيان ان لا يتنجس.","واعطى الله دانيال نعمة ورحمة عند رئيس الخصيان.","فقال رئيس الخصيان لدانيال اني اخاف سيدي الملك الذي عيّن طعامكم وشرابكم. فلماذا يرى وجوهكم اهزل من الفتيان الذين من جيلكم فتديّنون راسي للملك.","فقال دانيال لرئيس السقاة الذي ولاه رئيس الخصيان على دانيال وحننيا وميشائيل وعزريا","جرب عبيدك عشرة ايام فليعطونا القطاني لناكل وماء لنشرب.","ولينظروا الى مناظرنا امامك والى مناظر الفتيان الذين ياكلون من اطايب الملك ثم اصنع بعبيدك كما ترى.","فسمع لهم هذا الكلام وجربهم عشرة ايام.","وعند نهاية العشرة الايام ظهرت مناظرهم احسن واسمن لحما من كل الفتيان الآكلين من اطايب الملك.","فكان رئيس السقاة يرفع اطايبهم وخمر مشروبهم ويعطيهم قطاني","اما هؤلاء الفتيان الاربعة فاعطاهم الله معرفة وعقلا في كل كتابة وحكمة وكان دانيال فهيما بكل الرؤى والاحلام.","وعند نهاية الايام التي قال الملك ان يدخلوهم بعدها اتى بهم رئيس الخصيان الى امام نبوخذناصّر","وكلمهم الملك فلم يوجد بينهم كلهم مثل دانيال وحننيا وميشائيل وعزريا. فوقفوا امام الملك.","وفي كل أمر حكمة فهم الذي سألهم عنه الملك وجدهم عشرة اضعاف فوق كل المجوس والسحرة الذين في كل مملكته.","وكان دانيال الى السنة الاولى لكورش الملك"]},"3":{"o":1,"v":["نبوخذناصّر الملك صنع تمثالا من ذهب طوله ستون ذراعا وعرضه ست اذرع ونصبه في بقعة دورا في ولاية بابل.","ثم ارسل نبوخذناصّر الملك ليجمع المرازبة والشحن والولاة والقضاة والخزنة والفقهاء والمفتين وكل حكام الولايات ليأتوا لتدشين التمثال الذي نصبه نبوخذناصّر الملك.","حينئذ اجتمع المرازبة والشحن والولاة والقضاة والخزنة والفقهاء والمفتون وكل حكام الولايات لتدشين التمثال الذي نصبه نبوخذناصّر الملك ووقفوا امام التمثال الذي نصبه نبوخذناصّر.","ونادى مناد بشدة قد أمرتم ايها الشعوب والامم والألسنة","عندما تسمعون صوت القرن والناي والعود والرباب والسنطير والمزمار وكل انواع العزف ان تخروا وتسجدوا لتمثال الذهب الذي نصبه نبوخذناصّر الملك.","ومن لا يخرّ ويسجد ففي تلك الساعة يلقى في وسط أتون نار متقدة.","لاجل ذلك وقتما سمع كل الشعوب صوت القرن والناي والعود والرباب والسنطير وكل انواع العزف خرّ كل الشعوب والامم والألسنة وسجدوا لتمثال الذهب الذي نصبه نبوخذناصّر الملك","لاجل ذلك تقدم حينئذ رجال كلدانيون واشتكوا على اليهود.","اجابوا وقالوا للملك نبوخذناصّر ايها الملك عش الى الابد.","انت ايها الملك قد اصدرت أمرا بان كل انسان يسمع صوت القرن والناي والعود والرباب والسنطير والمزمار وكل انواع العزف يخرّ ويسجد لتمثال الذهب.","ومن لا يخرّ ويسجد فانه يلقى في وسط اتون نار متقدة.","يوجد رجال يهود الذين وكلتهم على اعمال ولاية بابل شدرخ ومشيخ وعبد نغو. هؤلاء الرجال لم يجعلوا لك ايها الملك اعتبارا. آلهتك لا يعبدون ولتمثال الذهب الذي نصبت لا يسجدون","حينئذ أمر نبوخذناصّر بغضب وغيظ باحضار شدرخ وميشخ وعبد نغو. فاتوا بهؤلاء الرجال قدام الملك.","فاجاب نبوخذناصّر وقال لهم. تعمّدا يا شدرخ وميشخ وعبد نغو لا تعبدون آلهتي ولا تسجدون لتمثال الذهب الذي نصبت.","فان كنتم الآن مستعدين عندما تسمعون صوت القرن والناي والعود والرباب والسنطير والمزمار وكل انواع العزف الى ان تخرّوا وتسجدوا للتمثال الذي عملته. وان لم تسجدوا ففي تلك الساعة تلقون في وسط أتون النار المتقدة. ومن هو الاله الذي ينقذكم من يديّ.","فاجاب شدرخ وميشخ وعبد نغو وقالوا للملك. يا نبوخذناصّر لا يلزمنا ان نجيبك عن هذا الأمر.","هوذا يوجد الهنا الذي نعبده يستطيع ان ينجينا من أتون النار المتقدة وان ينقذنا من يدك ايها الملك.","والا فليكن معلوما لك ايها الملك اننا لا نعبد آلهتك ولا نسجد لتمثال الذهب الذي نصبته","حنيئذ امتلأ نبوخذناصّر غيظا وتغير منظر وجهه على شدرخ وميشخ وعبد نغو. فاجاب وأمر بان يحموا الأتون سبعة اضعاف اكثر مما كان معتادا ان يحمى.","وأمر جبابرة القوة في جيشه بان يوثقوا شدرخ وميشخ وعبد نغو ويلقوهم في اتون النار المتقدة.","ثم أوثق هؤلاء الرجال في سراويلهم واقمصتهم وارديتهم ولباسهم وألقوا في وسط أتون النار المتقدة.","ومن حيث ان كلمة الملك شديدة والأتون قد حمّي جدا قتل لهيب النار الرجال الذين رفعوا شدرخ وميشخ وعبد نغو.","وهؤلاء الثلاثة الرجال شدرخ وميشخ وعبد نغو سقطوا موثقين في وسط أتون النار المتقدة","حينئذ تحيّر نبوخذناصّر الملك وقام مسرعا فاجاب وقال لمشيريه ألم نلقي ثلاثة رجال موثقين في وسط النار. فاجابوا وقالوا للملك صحيح ايها الملك.","اجاب وقال ها انا ناظر اربعة رجال محلولين يتمشون في وسط النار وما بهم ضرر ومنظر الرابع شبيه بابن الآلهة.","ثم اقترب نبوخذناصّر الى باب أتون النار المتقدة واجاب فقال يا شدرخ وميشخ وعبد نغو يا عبيد الله العلي اخرجوا وتعالوا. فخرج شدرخ وميشخ وعبد نغو من وسط النار.","فاجتمعت المرازبة والشحن والولاة ومشيرو الملك ورأوا هؤلاء الرجال الذين لم تكن للنار قوّة على اجسامهم وشعرة من رؤوسهم لم تحترق وسراويلهم لم تتغير ورائحة النار لم تأتي عليهم.","فاجاب نبوخذناصّر وقال تبارك اله شدرخ وميشخ وعبد نغو الذي ارسل ملاكه وانقذ عبيده الذين اتكلوا عليه وغيروا كلمة الملك واسلموا اجسادهم لكيلا يعبدوا او يسجدوا لاله غير الههم.","فمني قد صدر أمر بان كل شعب وامة ولسان يتكلمون بالسوء على اله شدرخ وميشخ وعبد نغو فانهم يصيرون اربا اربا وتجعل بيوتهم مزبلة اذ ليس اله آخر يستطيع ان ينجي هكذا.","حينئذ قدم الملك شدرخ وميشخ وعبد نغو في ولاية بابل"]}},"2KI":{"23":{"o":1,"v":["وارسل الملك فجمعوا اليه كل شيوخ يهوذا واورشليم.","وصعد الملك الى بيت الرب وجميع رجال يهوذا وكل سكان اورشليم معه والكهنة والانبياء وكل الشعب من الصغير الى الكبير وقرأ في آذانهم كل كلام سفر الشريعة الذي وجد في بيت الرب.","ووقف الملك على المنبر وقطع عهدا امام الرب للذهاب وراء الرب ولحفظ وصاياه وشهاداته وفرائضه بكل القلب وكل النفس لاقامة كلام هذا العهد المكتوب في هذا السفر. ووقف جميع الشعب عند العهد.","وامر الملك حلقيا الكاهن العظيم وكهنة الفرقة الثانية وحراس الباب ان يخرجوا من هيكل الرب جميع الآنية المصنوعة للبعل وللسارية ولكل اجناد السماء واحرقها خارج اورشليم في حقول قدرون وحمل رمادها الى بيت ايل.","ولاشى كهنة الاصنام الذين جعلهم ملوك يهوذا ليوقدوا على المرتفعات في مدن يهوذا وما يحيط باورشليم والذين يوقدون للبعل للشمس والقمر والمنازل ولكل اجناد السماء.","واخرج السارية من بيت الرب خارج اورشليم الى وادي قدرون واحرقها في وادي قدرون ودقها الى ان صارت غبارا وذرى الغبار على قبور عامة الشعب.","وهدم بيوت المأبونين التي عند بيت الرب حيث كانت النساء ينسجن بيوتا للسارية.","وجاء بجميع الكهنة من مدن يهوذا ونجس المرتفعات حيث كان الكهنة يوقدون من جبع الى بئر سبع وهدم مرتفعات الابواب التي عند مدخل باب يشوع رئيس المدينة التي عن اليسار في باب المدينة.","الا ان كهنة المرتفعات لم يصعدوا الى مذبح الرب في اورشليم بل اكلوا فطيرا بين اخوتهم.","ونجس توفة التي في وادي بني هنوم لكي لا يعبّر احد ابنه او ابنته في النار لمولك.","واباد الخيل التي اعطاها ملوك يهوذا للشمس عند مدخل بيت الرب عند مخدع نثنملك الخصي الذي في الاروقة ومركبات الشمس احرقها بالنار.","والمذابح التي على سطح عليّة آحاز التي عملها ملوك يهوذا والمذابح التي عملها منسّى في داري بيت الرب هدمها الملك وركض من هناك وذرى غبارها في وادي قدرون.","والمرتفعات التي قبالة اورشليم التي عن يمين جبل الهلاك التي بناها سليمان ملك اسرائيل لعشتورث رجاسة الصيدونيين ولكموش رجاسة الموآبيين ولملكوم كراهة بني عمون نجسها الملك.","وكسّر التماثيل وقطع السواري وملأ مكانها من عظام الناس.","وكذلك المذبح الذي في بيت ايل في المرتفعات التي عملها يربعام بن نباط الذي جعل اسرائيل يخطئ فذانك المذبح والمرتفعة هدمها واحرق المرتفعة وسحقها حتى صارت غبارا واحرق السارية.","والتفت يوشيا فرأى القبور التي هناك في الجبل فارسل واخذ العظام من القبور واحرقها على المذبح ونجّسه حسب كلام الرب الذي نادى به رجل الله الذي نادى بهذا الكلام.","وقال ما هذه الصوّة التي ارى. فقال له رجال المدينة هي قبر رجل الله الذي جاء من يهوذا ونادى بهذه الامور التي عملت على مذبح بيت ايل.","فقال دعوه. لا يحركنّ احد عظامه. فتركوا عظامه وعظام النبي الذي جاء من السامرة.","وكذا جميع بيوت المرتفعات التي في مدن السامرة التي عملها ملوك اسرائيل للاغاظة ازالها يوشيا وعمل بها حسب جميع الاعمال التي عملها في بيت ايل.","وذبح جميع كهنة المترفعات التي هناك على المذابح واحرق عظام الناس عليها ثم رجع الى اورشليم","وأمر الملك جميع الشعب قائلا اعملوا فصحا للرب الهكم كما هو مكتوب في سفر العهد هذا.","انه لم يعمل مثل هذا الفصح منذ ايام القضاة الذين حكموا على اسرائيل ولا في كل ايام ملوك اسرائيل وملوك يهوذا.","ولكن في السنة الثامنة عشرة للملك يوشيا عمل هذا الفصح للرب في اورشليم.","وكذلك السحرة والعرافون والترافيم والاصنام وجميع الرجاسات التي رئيت في ارض يهوذا وفي اورشليم ابادها يوشيا ليقيم كلام الشريعة المكتوب في السفر الذي وجده حلقيا الكاهن في بيت الرب.","ولم يكن قبله ملك مثله قد رجع الى الرب بكل قلبه وكل نفسه وكل قوته حسب كل شريعة موسى وبعده لم يقم مثله.","ولكن الرب لم يرجع عن حمو غضبه العظيم لان غضبه حمي على يهوذا من اجل جميع الاغاظات التي اغاظه اياها منسّى.","فقال الرب اني انزع يهوذا ايضا من امامي كما نزعت اسرائيل وارفض هذه المدينة التي اخترتها اورشليم والبيت الذي قلت يكون اسمي فيه.","وبقية امور يوشيا وكل ما عمل أما هي مكتوبة في سفر اخبار الايام لملوك يهوذا.","في ايامه صعد فرعون نخو ملك مصر على ملك اشور الى نهر الفرات. فصعد الملك يوشيا للقائه فقتله في مجدّو حين رآه.","واركبه عبيده ميتا من مجدّو وجاءوا به الى اورشليم ودفنوه في قبره. فاخذ شعب الارض يهوآحاز بن يوشيا ومسحوه وملكوه عوضا عن ابيه","كان يهوآحاز ابن ثلاث وعشرين سنة حين ملك وملك ثلاثة اشهر في اورشليم واسم امه حموطل بنت ارميا من لبنة.","فعمل الشر في عيني الرب حسب كل ما عمله آباؤه.","واسره فرعون نخو في ربلة في ارض حماة لئلا يملك في اورشليم وغرّم الارض بمئة وزنة من الفضة ووزنة من الذهب.","وملّك فرعون نخو الياقيم بن يوشيا عوضا عن يوشيا ابيه وغيّر اسمه الى يهوياقيم واخذ يهوآحاز وجاء الى مصر فمات هناك.","ودفع يهوياقيم الفضة والذهب لفرعون الا انه قوّم الارض لدفع الفضة بأمر فرعون. كل واحد حسب تقويمه. فطالب شعب الارض بالفضة والذهب ليدفع لفرعون نخو","كان يهوياقيم ابن خمس وعشرين سنة حين ملك. وملك احدى عشرة سنة في اورشليم. واسم امه زبيدة بنت فداية من رومة.","وعمل الشر في عيني الرب حسب كل ما عمل آباؤه"]},"20":{"o":12,"v":["في ذلك الزمان ارسل برودخ بلادان بن بلادان ملك بابل رسائل وهدية الى حزقيا لانه سمع ان حزقيا قد مرض.","فسمع لهم حزقيا واراهم كل بيت ذخائره والفضة والذهب والاطياب والزيت الطيب وكل بيت اسلحته وكل ما وجد في خزائنه. لم يكن شيء لم يرهم اياه حزقيا في بيته وفي كل سلطنته.","فجاء اشعياء النبي الى الملك حزقيا وقال له. ماذا قال هؤلاء الرجال ومن اين جاءوا اليك. فقال حزقيا جاءوا من ارض بعيدة من بابل.","فقال ماذا رأوا في بيتك. فقال حزقيا رأوا كل ما في بيتي. ليس في خزائني شيء لم أرهم اياه.","فقال اشعياء لحزقيا اسمع قول الرب.","هوذا تأتي ايام يحمل فيها كل ما في بيتك وما ذخره آباؤك الى هذا اليوم الى بابل. لا يترك شيء يقول الرب.","ويؤخذ من بنيك الذين يخرجون منك الذين تلدهم فيكونون خصيانا في قصر ملك بابل.","فقال حزقيا لاشعياء جيد هو قول الرب الذي تكلمت به. ثم قال فكيف لا ان يكن سلام وامان في ايامي."]},"24":{"o":1,"v":["في ايامه صعد نبوخدناصّر ملك بابل فكان له يهوياقيم عبدا ثلاث سنين ثم عاد فتمرد عليه.","فارسل الرب عليه غزاة الكلدانيين وغزاة الاراميين وغزاة الموآبيين وغزاة بني عمون وارسلهم على يهوذا ليبيدها حسب كلام الرب الذي تكلم به عن يد عبيده الانبياء.","ان ذلك كان حسب كلام الرب على يهوذا لينزعهم من امامه لاجل خطايا منسّى حسب كل ما عمل.","وكذلك لاجل الدم البريء الذي سفكه لانه ملأ اورشليم دما بريئا ولم يشإ الرب ان يغفر.","وبقية امور يهوياقيم وكل ما عمل أما هي مكتوبة في سفر اخبار الايام لملوك يهوذا.","ثم اضطجع يهوياقيم مع آبائه وملك يهوياكين ابنه عوضا عنه.","ولم يعد ايضا ملك مصر يخرج من ارضه لان ملك بابل اخذ من نهر مصر الى نهر الفرات كل ما كان لملك مصر","كان يهوياكين ابن ثماني عشرة سنة حين ملك وملك ثلاثة اشهر في اورشليم. واسم امه نحوشتا بنت الناثان من اورشليم.","وعمل الشر في عيني الرب حسب كل ما عمل ابوه.","في ذلك الزمان صعد عبيد نبوخذناصّر ملك بابل الى اورشليم فدخلت المدينة تحت الحصار.","وجاء نبوخذناصّر ملك بابل على المدينة وكان عبيده يحاصرونها.","فخرج يهوياكين ملك يهوذا الى ملك بابل هو وامه وعبيده ورؤساؤه وخصيانه واخذه ملك بابل في السنة الثامنة من ملكه.","واخرج من هناك جميع خزائن بيت الرب وخزائن بيت الملك وكسر كل آنية الذهب التي عملها سليمان ملك اسرائيل في هيكل الرب كما تكلم الرب.","وسبى كل اورشليم وكل الرؤساء وجميع جبابرة البأس عشرة آلاف مسبيّ وجميع الصنّاع والاقيان. لم يبق احد الا مساكين شعب الارض.","وسبى يهوياكين الى بابل وام الملك ونساء الملك وخصيانه واقوياء الارض سباهم من اورشليم الى بابل.","وجميع اصحاب البأس سبعة آلاف والصنّاع والاقيان الف وجميع الابطال اهل الحرب سباهم ملك بابل الى بابل.","وملّك ملك بابل متّنيا عمه عوضا عنه وغيّر اسمه الى صدقيا"]},"25":{"o":1,"v":["وفي السنة التاسعة لملكه في الشهر العاشر في عاشر الشهر جاء نبوخذناصّر ملك بابل هو وكل جيشه على اورشليم ونزل عليها وبنوا عليها ابراجا حولها.","ودخلت المدينة تحت الحصار الى السنة الحادية عشرة للملك صدقيا.","في تاسع الشهر اشتد الجوع في المدينة ولم يكن خبز لشعب الارض.","فثغرت المدينة وهرب جميع رجال القتال ليلا من طريق الباب بين السورين اللذين نحو جنة الملك. وكان الكلدانيون حول المدينة مستديرين. فذهبوا في طريق البرية.","فتبعت جيوش الكلدانيين الملك فادركوه في برية اريحا وتفرقت جميع جيوشه عنه.","فأخذوا الملك واصعدوه الى ملك بابل الى ربلة وكلموه بالقضاء عليه.","وقتلوا بني صدقيا امام عينيه. وقلعوا عيني صدقيا وقيدوه بسلسلتين من نحاس وجاءوا به الى بابل","وفي الشهر الخامس في سابع الشهر وهي السنة التاسعة عشرة للملك نبوخذناصّر ملك بابل جاء نبوزرادان رئيس الشرط عبد ملك بابل الى اورشليم.","واحرق بيت الرب وبيت الملك وكل بيوت اورشليم وكل بيوت العظماء احرقها بالنار.","وجميع اسوار اورشليم مستديرا هدمها كل جيوش الكلدانيين الذين مع رئيس الشرط.","وبقية الشعب الذين بقوا في المدينة والهاربون الذين هربوا الى ملك بابل وبقية الجمهور سباهم نبوزرادان رئيس الشرط.","ولكن رئيس الشرط ابقى من مساكين الارض كرامين وفلاحين.","واعمدة النحاس التي في بيت الرب والقواعد وبحر النحاس الذي في بيت الرب كسّرها الكلدانيون وحملوا نحاسها الى بابل.","والقدور والرفوش والمقاص والصحون وجميع آنية النحاس التي كانوا يخدمون بها اخذوها","والمجامر والمناضح. ما كان من ذهب فالذهب وما كان من فضة فالفضة اخذها رئيس الشرط.","والعمودان والبحر الواحد والقواعد التي عملها سليمان لبيت الرب لم يكن وزن لنحاس كل هذه الادوات.","ثماني عشرة ذراعا ارتفاع العمود الواحد وعليه تاج من نحاس وارتفاع التاج ثلاث اذرع والشبكة والرمانات التي على التاج مستديرة جميعها من نحاس. وكان للعمود الثاني مثل هذه على الشبكة","واخذ رئيس الشرط سرايا الكاهن الرئيس وصفنيا الكاهن الثاني وحارسي الباب الثلاثة.","ومن المدينة اخذ خصيا واحدا كان وكيلا على رجال الحرب وخمسة رجال من الذين ينظرون وجه الملك الذين وجدوا في المدينة وكاتب رئيس الجند الذي كان يجمع شعب الارض وستين رجلا من شعب الارض الموجودين في المدينة","واخذهم نبوزرادان رئيس الشرط وسار بهم الى ملك بابل الى ربلة.","فضربهم ملك بابل وقتلهم في ربلة في ارض حماة. فسبي يهوذا من ارضه","واما الشعب الذي بقي في ارض يهوذا الذين ابقاهم نبوخذناصّر ملك بابل فوكّل عليهم جدليا بن اخيقام بن شافان.","ولما سمع جميع رؤساء الجيوش هم ورجالهم ان ملك بابل قد وكّل جدليا أتوا الى جدليا الى المصفاة وهم اسماعيل بن نثنيا ويوحنان بن قاريح وسرايا بن تنحومث النطوفاتي ويازنيا ابن المعكي هم ورجالهم.","وحلف جدليا لهم ولرجالهم وقال لهم لا تخافوا من عبيد الكلدانيين. اسكنوا الارض وتعبّدوا لملك بابل فيكون لكم خير.","وفي الشهر السابع جاء اسماعيل بن نثنيا بن اليشمع من النسل الملكي وعشرة رجال معه وضربوا جدليا فمات وايضا اليهود والكلدانيين الذين معه في المصفاة.","فقام جميع الشعب من الصغير الى الكبير ورؤساء الجيوش وجاءوا الى مصر لانهم خافوا من الكلدانيين","وفي السنة السابعة والثلاثين لسبي يهوياكين ملك يهوذا في الشهر الثاني عشر في السابع والعشرين من الشهر رفع اويل مرودخ ملك بابل في سنة تملكه راس يهوياكين ملك يهوذا من السجن","وكلمه بخير وجعل كرسيه فوق كراسي الملوك الذين معه في بابل.","وغيّر ثياب سجنه وكان ياكل دائما الخبز امامه كل ايام حياته.","ووظيفته وظيفة دائمة تعطى له من عند الملك امر كل يوم بيومه كل ايام حياته"]},"21":{"o":1,"v":["كان منسىّ ابن اثنتي عشرة سنة حين ملك وملك خمسا وخمسين سنة في اورشليم. واسم امه حفصيبة.","وعمل الشر في عيني الرب حسب رجاسات الامم الذين طردهم الرب من امام بني اسرائيل","وعاد فبنى المرتفعات التي ابادها حزقيا ابوه واقام مذابح للبعل وعمل سارية كما عمل اخآب ملك اسرائيل وسجد لكل جند السماء وعبدها.","وبنى مذابح في بيت الرب الذي قال الرب عنه في اورشليم اضع اسمي.","وبنى مذابح لكل جند السماء في داري بيت الرب.","وعبّر ابنه في النار وعاف وتفائل واستخدم جانّا وتوابع واكثر عمل الشر في عيني الرب لاغاظته.","ووضع تمثال السارية التي عمل في البيت الذي قال الرب عنه لداود وسليمان ابنه في هذا البيت وفي اورشليم التي اخترت من جميع اسباط اسرائيل اضع اسمي الى الابد.","ولا اعود أزحزح رجل اسرائيل من الارض التي اعطيت لآبائهم وذلك اذا حفظوا وعملوا حسب كل ما اوصيتهم به وكل الشريعة التي امرهم بها عبدي موسى.","فلم يسمعوا بل اضلّهم منسّى ليعملوا ما هو اقبح من الامم الذين طردهم الرب من امام بني اسرائيل","وتكلم الرب عن يد عبيده الانبياء قائلا.","من اجل ان منسّى ملك يهوذا قد عمل هذه الارجاس واساء اكثر من جميع الذي عمله الاموريون الذين قبله وجعل ايضا يهوذا يخطئ باصنامه","لذلك هكذا قال الرب اله اسرائيل. هانذا جالب شرا على اورشليم ويهوذا حتى ان كل من يسمع به تطن اذناه.","وامد على اورشليم خيط السامرة ومطمار بيت اخآب وامسح اورشليم كما يمسح واحد الصحن يمسحه ويقلبه على وجهه.","وارفض بقية ميراثي وادفعهم الى ايدي اعدائهم فيكونون غنيمة ونهبا لجميع اعدائهم.","لانهم عملوا الشر في عينيّ وصارا يغيظونني من اليوم الذي فيه خرج آباؤهم من مصر الى هذا اليوم.","وسفك ايضا منسّى دما بريّا كثيرا جدا حتى ملأ اورشليم من الجانب الى الجانب فضلا عن خطيته التي بها جعل يهوذا يخطئ بعمل الشر في عيني الرب.","وبقية امور منسّى وكل ما عمل وخطيته التي اخطأ بها اما هي مكتوبة في سفر اخبار الايام لملوك يهوذا.","ثم اضطجع منسّى مع آبائه ودفن في بستان بيته في بستان عزّا وملك آمون ابنه عوضا عنه"]},"22":{"o":1,"v":["كان يوشيا ابن ثمان سنين حين ملك وملك احدى وثلاثين سنة في اورشليم واسم امه يديدة بنت عداية من بصقة.","وعمل المستقيم في عيني الرب وسار في جميع طرق داود ابيه. ولم يحد يمينا ولا شمالا","وفي السنة الثامنة عشرة للملك يوشيا ارسل الملك شافان بن اصليا بن مشلام الكاتب الى بيت الرب قائلا.","اصعد الى حلقيا الكاهن العظيم فيحسب الفضة المدخلة الى بيت الرب التي جمعها حارسو الباب من الشعب","فيدفعوها ليد عاملي الشغل الموكلين ببيت الرب ويدفعوها الى عاملي الشغل الذي في بيت الرب لترميم ثلم البيت.","للنجارين والبنائين والنحاتين ولشراء اخشاب وحجارة منحوتة لاجل ترميم البيت.","الا انهم لم يحاسبوا بالفضة المدفوعة لايديهم لانهم انما عملوا بامانة","فقال حلقيا الكاهن العظيم لشافان الكاتب قد وجدت سفر الشريعة في بيت الرب. وسلّم حلقيا السفر لشافان فقرأه.","وجاء شافان الكاتب الى الملك ورد على الملك جوابا وقال. قد افرغ عبيدك الفضة الموجودة في البيت ودفعوها الى يد عاملي الشغل وكلاء بيت الرب.","واخبر شافان الكاتب الملك قائلا قد اعطاني حلقيا الكاهن سفرا. وقرأه شافان امام الملك.","فلما سمع الملك كلام سفر الشريعة مزّق ثيابه.","وأمر الملك حلقيا الكاهن واخيقام بن شافان وعكبور بن ميخا وشافان الكاتب وعسايا عبد الملك قائلا","اذهبوا اسألوا الرب لاجلي ولاجل الشعب ولاجل كل يهوذا من جهة كلام هذا السفر الذي وجد. لانه عظيم هو غضب الرب الذي اشتعل علينا من اجل ان آباءنا لم يسمعوا لكلام هذا السفر ليعملوا حسب كل ما هو مكتوب علينا.","فذهب حلقيا الكاهن واخيقام وعكبور وشافان وعسايا الى خلدة النبية امرأة شلّوم بن تقوة بن حرحس حارس الثياب. وهي ساكنة في اورشليم في القسم الثاني وكلّموها.","فقالت لهم هكذا قال الرب اله اسرائيل. قولوا للرجل الذي ارسلكم اليّ.","هكذا قال الرب هانذا جالب شرا على هذا الموضع وعلى سكانه كل كلام السفر الذي قرأه ملك يهوذا.","من اجل انهم تركوني واوقدوا لآلهة اخرى لكي يغيظوني بكل عمل ايدهم فيشتعل غضبي على هذا الموضع ولا ينطفئ.","واما ملك يهوذا الذي ارسلكم لتسألوا الرب فهكذا تقولون له هكذا قال الرب اله اسرائيل من جهة الكلام الذي سمعت.","من اجل انه قد رقّ قلبك وتواضعت امام الرب حين سمعت ما تكلمت به على هذا الموضع وعلى سكانه انهم يصيرون دهشا ولعنة ومزّقت ثيابك وبكيت امامي. قد سمعت انا ايضا يقول الرب.","لذلك هانذا اضمك الى آبائك فتضمّ الى قبرك بسلام ولا ترى عيناك كل الشر الذي انا جالبه على هذا الموضع. فردوا على الملك جوابا"]}},"2CH":{"36":{"o":1,"v":["واخذ شعب الارض يهوآحاز بن يوشيا وملّكوه عوضا عن ابيه في اورشليم.","وكان يوآحاز ابن ثلاث وعشرين سنة حين ملك وملك ثلاثة اشهر في اورشليم.","وعزله ملك مصر في اورشليم وغرّم الارض بمئة وزنة من الفضة وبوزنة من الذهب.","وملك ملك مصر الياقيم اخاه على يهوذا واورشليم وغيّر اسمه الى يهوياقيم. واما يوآحاز اخوه فاخذه نخو وأتى به الى مصر","كان يهوياقيم ابن خمس وعشرين سنة حين ملك وملك احدى عشر سنة في اورشليم وعمل الشر في عيني الرب الهه.","عليه صعد نبوخذناصّر ملك بابل وقيّده بسلاسل نحاس ليذهب به الى بابل.","وأتى نبوخذناصّر ببعض آنية بيت الرب الى بابل وجعلها في هيكله في بابل","وبقية امور يهوياقيم ورجاساته التي عمل وما وجد فيه ها هي مكتوبة في سفر ملوك اسرائيل ويهوذا. وملك يهوياكين ابنه عوضا عنه","كان يهوياكين ابن ثماني سنين حين ملك وملك ثلاثة اشهر وعشرة ايام في اورشليم. وعمل الشر في عيني الرب.","وعند رجوع السنة ارسل الملك نبوخذناصّر فأتى به الى بابل مع آنية بيت الرب الثمينة وملك صدقيا اخاه على يهوذا واورشليم.","كان صدقيا ابن احدى وعشرين سنة حين ملك وملك احدى عشرة سنة في اورشليم.","وعمل الشر في عيني الرب الهه ولم يتواضع امام ارميا النبي من فم الرب.","وتمرّد ايضا على الملك نبوخذناصّر الذي حلّفه بالله وصلّب عنقه وقوّى قلبه عن الرجوع الى الرب اله اسرائيل.","حتى ان جميع رؤساء الكهنة والشعب اكثروا الخيانة حسب كل رجاسات الامم ونجسوا بيت الرب الذي قدسه في اورشليم.","فارسل الرب اله آبائهم اليهم عن يد رسله مبكرا ومرسلا لانه شفق على شعبه وعلى مسكنه.","فكانوا يهزأون برسل الله ورذلوا كلامه وتهاونوا بانبيائه حتى ثار غضب الرب على شعبه حتى لم يكن شفاء.","فاصعد عليهم ملك الكلدانيين فقتل مختاريهم بالسيف في بيت مقدسهم. ولم يشفق على فتى او عذراء ولا على شيخ او اشيب بل دفع الجميع ليده.","وجميع آنية بيت الله الكبيرة والصغيرة وخزائن بيت الرب وخزائن الملك ورؤسائه اتى بها جميعا الى بابل.","واحرقوا بيت الله وهدموا سور اورشليم واحرقوا جميع قصورها بالنار واهلكوا جميع آنيتها الثمينة.","وسبى الذين بقوا من السيف الى بابل فكانوا له ولبنيه عبيدا الى ان ملكت مملكة فارس","لاكمال كلام الرب بفم ارميا حتى استوفت الارض سبوتها لانها سبتت في كل ايام خرابها لاكمال سبعين سنة","وفي السنة الاولى لكورش ملك فارس لاجل تكميل كلام الرب بفم ارميا نبّه الرب روح كورش ملك فارس فاطلق نداء في كل مملكته وكذا بالكتابة قائلا","هكذا قال كورش ملك فارس ان الرب اله السماء قد اعطاني جميع ممالك الارض وهو اوصاني ان ابني له بيتا في اورشليم التي في يهوذا. من منكم من جميع شعبه الرب الهه معه وليصعد"]},"33":{"o":10,"v":["وكلّم الرب منسّى وشعبه فلم يصغوا","فجلب الرب عليهم رؤساء الجند الذين لملك اشور فأخذوا منسّى بخزامة وقيدوه بسلاسل نحاس وذهبوا به الى بابل.","ولما تضايق طلب وجه الرب الهه وتواضع جدا امام اله آبائه","وصلّى اليه فاستجاب له وسمع تضرعه ورده الى اورشليم الى مملكته. فعلم منسّى ان الرب هو الله."]},"32":{"o":25,"v":["ولكن لم يردّ حزقيا حسبما أنعم عليه لان قلبه ارتفع فكان غضب عليه وعلى يهوذا واورشليم","ثم تواضع حزقيا بسبب ارتفاع قلبه هو وسكان اورشليم فلم يأت عليهم غضب الرب في ايام حزقيا.","وكان لحزقيا غنى وكرامة كثيرة جدا وعمل لنفسه خزائن للفضة والذهب والحجارة الكريمة والاطياب والاتراس وكل آنية ثمينة","ومخازن لغلة الحنطة والمسطار والزيت واواري لكل انواع البهائم وللقطعان اواري.","وعمل لنفسه ابراجا ومواشي غنم وبقر بكثرة لان الله اعطاه اموالا كثيرة جدا.","وحزقيا هذا سد مخرج مياه جيحون الاعلى واجراها تحت الارض الى الجهة الغربية من مدينة داود. وافلح حزقيا في كل عمله.","وهكذا في أمر تراجم رؤساء بابل الذين ارسلوا اليه ليسألوا عن الاعجوبة التي كانت في الارض تركه الله ليجربه ليعلم كل ما في قلبه."]},"35":{"o":20,"v":["بعد كل هذا حين هيّأ يوشيا البيت صعد نخو ملك مصر الى كركميش ليحارب عند الفرات. فخرج يوشيا للقائه.","فارسل اليه رسلا يقول ما لي ولك يا ملك يهوذا. لست عليك انت اليوم ولكن على بيت حربي والله امر باسراعي. فكف عن الله الذي معي فلا يهلكك.","ولم يحوّل يوشيا وجهه عنه بل تنكّر لمقاتلته ولم يسمع لكلام نخو من فم الله بل جاء ليحارب في بقعة مجدو.","واصاب الرماة الملك يوشيا فقال الملك لعبيده انقلوني لاني جرحت جدا.","فنقله عبيده من المركبة واركبوه على المركبة الثانية التي له وساروا به الى اورشليم فمات ودفن في قبور آبائه. وكان كل يهوذا واورشليم ينوحون على يوشيا.","ورثى ارميا يوشيا. وكان جميع المغنين والمغنيات يندبون يوشيا في مراثيهم الى اليوم. وجعلوها فريضة على اسرائيل. وها هي مكتوبة في المراثي."]}},"EZR":{"1":{"o":1,"v":["وفي السنة الاولى لكورش ملك فارس عند تمام كلام الرب بفم ارميا نبّه الرب روح كورش ملك فارس فاطلق نداء في كل مملكته وبالكتابة ايضا قائلا","هكذا قال كورش ملك فارس. جميع ممالك الارض دفعها لي الرب اله السماء وهو اوصاني ان ابني له بيتا في اورشليم التي في يهوذا.","من منكم من كل شعبه****ليكن الهه معه ويصعد الى اورشليم التي في يهوذا فيبني بيت الرب اله اسرائيل. هو الاله. الذي في اورشليم.","وكل من بقي في احد الاماكن حيث هو متغرب فلينجده اهل مكانه بفضة وبذهب وبامتعة وببهائم مع التبرع لبيت الرب الذي في اورشليم","فقام رؤوس آباء يهوذا وبنيامين والكهنة واللاويون مع كل من نبّه الله روحه ليصعدوا ليبنوا بيت الرب الذي في اورشليم.","وكل الذين حولهم اعانوهم بآنية فضة وبذهب وبامتعة وببهائم وبتحف فضلا عن كل ما تبرع به","والملك كورش اخرج آنية بيت الرب التي اخرجها نبوخذناصّر من اورشليم وجعلها في بيت آلهته.","اخرجها كورش ملك فارس عن يد مثرداث الخازن وعدّها لشيشبصّر رئيس يهوذا.","وهذا عددها. ثلاثون طستا من ذهب والف طست من فضة وتسعة وعشرون سكينا","وثلاثون قدحا من ذهب واقداح فضة من الرتبة الثانية اربع مئة وعشرة والف من آنية اخرى.","جميع الآنية من الذهب والفضة خمسة آلاف واربع مئة. الكل اصعده شيشبصّر عند اصعاد السبي من بابل الى اورشليم"]}},"JER":{"25":{"o":1,"v":["الكلام الذي صار الى ارميا عن كل شعب يهوذا في السنة الرابعة ليهوياقيم بن يوشيا ملك يهوذا. هي السنة الاولى لنبوخذراصر ملك بابل","الذي تكلم به ارميا النبي على كل شعب يهوذا وعلى كل سكان اورشليم قائلا","من السنة الثالثة عشر ليوشيا بن آمون ملك يهوذا الى هذا اليوم هذه الثلاث والعشرين سنة صارت كلمة الرب اليّ فكلمتكم مبكرا ومكلما فلم تسمعوا.","وقد ارسل الرب اليكم كل عبيده الانبياء مبكرا ومرسلا فلم تسمعوا ولم تميلوا اذنكم للسمع.","قائلين ارجعوا كل واحد عن طريقه الرديء وعن شر اعمالكم واسكنوا في الارض التي اعطاكم الرب اياها وآباءكم من الازل والى الابد.","ولا تسلكوا وراء آلهة اخرى لتعبدوها وتسجدوا لها ولا تغيظوني بعمل ايديكم فلا اسيء اليكم.","فلم تسمعوا لي يقول الرب لتغيظوني بعمل ايديكم شرا لكم","لذلك هكذا قال رب الجنود. من اجل انكم لم تسمعوا لكلامي","هانذا ارسل فآخذ كل عشائر الشمال يقول الرب والى نبوخذراصر عبدي ملك بابل وآتي بهم على هذه الارض وعلى كل سكانها وعلى كل هذه الشعوب حواليها فاحرمهم واجعلهم دهشا وصفيرا وخربا ابدية.","وابيد منهم صوت الطرب وصوت الفرح صوت العريس وصوت العروس صوت الارحية ونور السراج.","وتصير كل هذه الارض خرابا ودهشا وتخدم هذه الشعوب ملك بابل سبعين سنة","ويكون عند تمام السبعين سنة اني اعاقب ملك بابل وتلك الامة يقول الرب على اثمهم وارض الكلدانيين واجعلها خربا ابدية.","واجلب على تلك الارض كل كلامي الذي تكلمت به عليها كل ما كتب في هذا السفر الذي تنبأ به ارميا على كل الشعوب.","لانه قد استعبدهم ايضا امم كثيرة وملوك عظام فاجازيهم حسب اعمالهم وحسب عمل اياديهم"]},"22":{"o":13,"v":["ويل لمن يبني بيته بغير عدل
