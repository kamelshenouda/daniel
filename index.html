ب الحقل.","يتبلّ بندى السما ويعيش مع الحيوانات. قلبه يتغير من قلب إنسان لقلب حيوان، لحد ما تعدّي عليه سبع أزمنة.","والهدف مذكور: عشان الأحياء يعرفوا إن العلي متسلط في مملكة الناس، وبيديها للي هو عايزه."]]],"yr":"~570"},"dan4b":{"date":"السنة مش مذكورة، في آخر حكمه","title":"كلمة دانيال الصعبة ونصيحته","hook":"دانيال بيقول للملك إنه هو الشجرة، وبينصحه يفارق خطاياه بالبر.","s":[["دانيال بيتلخبط",["دانيال بيتحيّر ساعة، وأفكاره بتفزعه.","الملك بيقول له ما يخليش الحلم ولا تفسيره يفزعه.","دانيال بيرد: «يا سيدي، ياريت الحلم لمبغضيك وتفسيره لأعدائك!»"]],["«إنت أيها الملك الشجرة دي»",["الشجرة هي الملك: كبر وقوي، وسلطانه وصل لآخر الأرض.","هيتطرد من بين الناس ويسكن مع حيوانات البر. هياكل عشب زي التيران ويتبلّ بالندى.","سبع أزمنة هتعدّي عليه لحد ما يعرف إن العلي متسلط في مملكة الناس.","وأصل الشجرة اتساب: مملكته هترجع له لما يعرف إن السما هي اللي بتحكم."]],["نصيحة دانيال",["«لذلك أيها الملك، فلتكن مشورتي مقبولة عندك.»","يفارق خطاياه بالبر، وآثامه بالرحمة للمساكين.","يمكن اطمئنانه يطول."]]],"yr":"~570"},"dan4c":{"date":"السنة مش مذكورة، في آخر حكمه","title":"بعد اتناشر شهر: السقوط","hook":"والملك بيفتخر ببابل اللي بناها، صوت من السما بياخد منه المملكة.","s":[["بعد اتناشر شهر",["الملك كان بيتمشى على سطح قصر مملكة بابل.","بيقول: «مش دي بابل العظيمة اللي أنا بنيتها لبيت الملك، بقوة اقتداري ولجلال مجدي؟»","والكلمة لسه في بُقه، نزل صوت من السما: «المُلك زال عنك.»","في ساعتها الكلام اتحقق. اتطرد من بين الناس وكل عشب زي التيران. جسمه اتبلّ بالندى، وشعره طول زي ريش النسور وضوافره زي مخالب الطيور."]]],"yr":"~570"},"dan4d":{"date":"السنة مش مذكورة، في آخر حكمه","title":"رجع واتواضع","hook":"الملك بيرفع عينيه للسما، وعقله بيرجع له، وبيسبّح ملك السما.","s":[["بيرفع عينيه للسما",["في آخر المدة، نبوخذنصر رفع عينيه للسما، وعقله رجع له.","بارك العلي وسبّح وحمد الحي إلى الأبد.","«هو بيعمل زي ما هو عايز في جند السما وسكان الأرض. ومفيش حد يمنع إيده أو يقول له: إنت بتعمل إيه؟»"]],["رجع واتواضع",["عقله وجلال مملكته ومجده وبهاؤه رجعوا له. مشيروه وعظماؤه طلبوه، واتثبّت على مملكته وازداد عظمة.","«فالآن أنا نبوخذنصر أسبّح وأعظّم وأحمد ملك السما، اللي كل أعماله حق وطرقه عدل.»","«واللي بيسلكوا بالكبرياء هو قادر يذلّهم.»"]]],"yr":"~570"},"jehoiachin":{"date":"حوالي 561 ق.م","title":"ملك جديد بيرفع راس يهوياكين","hook":"بعد نبوخذنصر، ملك يهوذا المسبي بيخرج من السجن.","note":"التاريخ بيسجل إن نبوخذنصر مات سنة 562 ق.م وجه بعده ابنه أويل مرودخ. وسفر دانيال ساكت عن السنين اللي بين أصحاح 4 وحكم بيلشاصر.","s":[["خروج من السجن",["في السنة السبعة وتلاتين لسبي يهوياكين ملك يهوذا، أويل مرودخ بقى ملك بابل.","وفي السنة دي خرّج يهوياكين من السجن."]],["كرسي فوق كراسي الملوك",["كلّمه بخير وخلّى كرسيه فوق كراسي الملوك اللي معاه في بابل.","يهوياكين غيّر هدوم سجنه وبقى ياكل دايمًا على سفرة الملك كل أيام حياته.","والملك خصص له مصروف دايم، نصيب كل يوم بيومه، طول ما هو عايش."]]]},"dan7a":{"date":"حوالي 553 ق.م","title":"أربع حيوانات من البحر","hook":"أسد ودب ونمر، وحيوان رابع بسنان حديد وعشر قرون.","s":[["حلم بيتكتب",["في السنة الأولى لبيلشاصر ملك بابل، دانيال شاف حلم ورؤى راسه وهو على سريره.","وكتب الحلم وحكى راس الكلام."]],["أربع حيوانات طالعة من البحر",["أربع رياح السما هجمت على البحر الكبير.","وطلع من البحر أربع حيوانات عظيمة، كل واحد مختلف عن التاني."]],["الأسد والدب والنمر",["الأول زي الأسد وله جناحين نسر. جناحيه اتنتفوا، واتوقّف على رجلين زي إنسان، واتدّى قلب إنسان.","التاني شبه الدب، مرفوع على جنب واحد، وفي بُقه تلات ضلوع. واتقال له: «قوم كُل لحم كتير!»","التالت زي النمر وعلى ضهره أربع جناحات طير، وله أربع روس. واتدّى سلطان."]],["الحيوان الرابع",["الرابع هايل وقوي وشديد جدًا، وله سنان كبيرة من حديد. بياكل ويسحق ويدوس الباقي برجليه.","مختلف عن كل اللي قبله، وله عشر قرون.","وطلع بينهم قرن صغير، واتقلع قدامه تلاتة من القرون الأولانية. فيه عيون زي عيون إنسان وبُق بيتكلم بعظايم."]]]},"dan7b":{"date":"حوالي 553 ق.م","title":"القديم الأيام ومثل ابن إنسان","hook":"عروش بتتحط، والأسفار بتتفتح، وملكوت أبدي بيتدّى.","s":[["القديم الأيام بيقعد",["اتحطت عروش، وقعد القديم الأيام. لبسه أبيض زي التلج، وشعر راسه زي الصوف النقي.","عرشه لهيب نار وعجلاته نار متقدة. ونهر نار جاري وخارج من قدامه.","ألوف ألوف بتخدمه، وربوات ربوات واقفين قدامه. القضا قعد، والأسفار اتفتحت."]],["الحيوان بيتحاكم",["دانيال فضل يتفرج بسبب صوت الكلام العظيم اللي القرن بيقوله.","الحيوان اتقتل وجسمه هلك واترمى لوقيد النار.","وباقي الحيوانات اتشال منهم سلطانهم، بس اتدّوا طول حياة لزمان ووقت."]],["مثل ابن إنسان",["دانيال شاف مثل ابن إنسان جاي مع سحب السما. وصل للقديم الأيام وقرّبوه قدامه.","اتدّى سلطان ومجد وملكوت، عشان كل الشعوب والأمم والألسنة تتعبد له.","سلطانه سلطان أبدي ما يزولش، وملكوته ما ينقرضش."]]]},"dan7c":{"date":"حوالي 553 ق.م","title":"شعب القديسين بياخد المملكة","hook":"واحد من الواقفين بيشرح الحيوانات، ودانيال بيحفظ الأمر في قلبه.","s":[["دانيال بيسأل عن المعنى",["روح دانيال حزنت، ورؤى راسه أفزعته. قرّب من واحد من الواقفين وسأله عن الحقيقة.","الأربع حيوانات العظيمة هم أربع ملوك هيقوموا على الأرض.","بس قديسين العلي هياخدوا المملكة ويمتلكوها للأبد."]],["أكتر عن الحيوان الرابع",["دانيال عايز يعرف عن الحيوان الرابع، وعن العشر قرون، وعن القرن التاني اللي منظره أشد من أصحابه.","وهو بيتفرج، القرن ده كان بيحارب القديسين وغلبهم، لحد ما جه القديم الأيام والحكم اتدّى للقديسين.","الحيوان الرابع مملكة رابعة مختلفة عن كل الممالك، هتاكل الأرض كلها. العشر قرون عشر ملوك، وبعدهم يقوم واحد تاني ويذل تلات ملوك.","هيتكلم ضد العلي، ويبلي قديسيه، ويظن إنه يغيّر الأوقات والسنّة. وهيتسلّموا لإيده لزمان وأزمنة ونص زمان."]],["الحكم الأخير",["القضا هيقعد، وهينزعوا منه سلطانه عشان يفنى ويبيد للنهاية.","المملكة والسلطان وعظمة الممالك اللي تحت كل السما هتتدّي لشعب قديسي العلي.","أفكار دانيال أفزعته جدًا ووشه اتغير، بس حفظ الأمر في قلبه."]]],"vision":{"text":"الأربع حيوانات هم أربع ملوك، أو ممالك، بيقوموا على الأرض (7: 17، 23). المحكمة بتاخد سلطان آخر حاكم، والمملكة بتتدّي لشعب قديسي العلي للأبد (7: 26–27).","hist":"أغلب المفسرين المحافظين بيقروها على إنها نفس الأربع إمبراطوريات بتوع التمثال في أصحاح 2: بابل، ومادي وفارس، واليونان، وروما. الأربع روس بتوع النمر ماشيين مع تقسيم إمبراطورية اليونان لأربعة بعد الإسكندر. والقرن الصغير بيتفهم عند كتير على إنه حاكم أخير بيقاوم ربنا، مع اختلاف الآراء في التفاصيل. وفي الأناجيل، يسوع بيطبّق على نفسه لقب «ابن الإنسان آتيًا على سحاب السماء» (متى 26: 64)."}},"dan8a":{"date":"حوالي 551 ق.م","title":"الكبش والتيس","hook":"في شوشن، كبش بقرنين بيدوسه تيس جاي من الغرب، وقرنه العظيم بيتكسر لأربعة.","s":[["رؤيا في شوشن",["في السنة التالتة لملك بيلشاصر، دانيال شاف رؤيا تانية، بعد اللي ظهرت له في الأول.","في الرؤيا شاف نفسه في شوشن القصر في ولاية عيلام، عند نهر أولاي."]],["كبش بقرنين",["كبش واقف عند النهر وله قرنين طوال. واحد أطول من التاني، والأطول طلع في الآخر.","بينطح ناحية الغرب والشمال والجنوب. مفيش حيوان يقف قدامه، ومفيش منقذ من إيده.","عمل اللي على كيفه وعظم."]],["تيس جاي من الغرب",["تيس له قرن واضح بين عينيه جه من الغرب، على وش كل الأرض ومن غير ما يلمس الأرض.","هجم على الكبش بشدة قوته، وضربه وكسّر قرنيه.","الكبش ما كانش فيه قوة. التيس رماه على الأرض وداسه، وما كانش للكبش منقذ."]],["القرن العظيم بيتكسر",["التيس عظم جدًا، بس وهو في عز قوته القرن العظيم اتكسر.","وطلع مكانه أربع قرون واضحة ناحية رياح السما الأربعة."]]]},"dan8b":{"date":"حوالي 551 ق.م","title":"القرن الصغير والقدس","hook":"قرن بيشيل المحرقة الدايمة، وقدوس بيسأل: «إلى متى؟»","s":[["قرن صغير بيكبر",["من واحد منهم طلع قرن صغير، وعظم جدًا ناحية الجنوب والشرق وفخر الأراضي.","كبر لحد جند السما، ورمى من الجند ومن النجوم على الأرض وداسهم.","اتعظم لحد رئيس الجند. شال المحرقة الدايمة، ومسكن مقدسه اتهدّ.","طرح الحق على الأرض، وعمل ونجح."]],["«إلى متى؟»",["دانيال سمع قدوس بيسأل قدوس تاني الرؤيا هتاخد قد إيه: المحرقة الدايمة، ومعصية الخراب، ودوس القدس.","والجواب: ألفين وتلتمية صباح ومسا. وبعدين القدس يتبرّأ."]]]},"dan8c":{"date":"حوالي 551 ق.م","title":"جبرائيل بيسمّي الممالك","hook":"مادي وفارس، وبعدين اليونان، وبعدين ملك جافي ينكسر من غير إيد. ودانيال بيعيى أيام.","s":[["جبرائيل بيتبعت",["ودانيال بيحاول يفهم، وقف قدامه واحد شبه منظر راجل.","وصوت إنسان نادى من بين أولاي: «يا جبرائيل، فهّم الراجل ده الرؤيا.»","دانيال خاف ووقع على وشه. وجبرائيل قال: «افهم يا ابن آدم إن الرؤيا لوقت المنتهى.»","دانيال وقع في نوم تقيل ووشه على الأرض. فلمسه جبرائيل ووقّفه على رجليه."]],["الممالك بتتسمّى",["الكبش أبو قرنين هو ملوك مادي وفارس.","التيس أبو شعر هو ملك اليونان، والقرن العظيم اللي بين عينيه هو الملك الأول.","والأربع قرون اللي قاموا مكانه أربع ممالك هتقوم من أمته، بس مش بقوته."]],["الملك الجافي الوش",["في آخر مملكتهم هيقوم ملك جافي الوش وفاهم الحيل.","قوته هتعظم، بس مش بقوته هو. هيهلك هلاك عجيب، ويبيد العظما وشعب القديسين.","بحيلته هينجّح المكر في إيده، ويتعظم في قلبه. وهيقوم حتى على رئيس الرؤساء.","بس هينكسر من غير إيد إنسان."]],["دانيال بيتهدّ",["رؤيا المسا والصباح حق، بس دانيال يكتم الرؤيا، لأنها لأيام كتيرة.","دانيال ضعف وعيي كام يوم. وبعدين قام وباشر شغل الملك.","كان متحيّر من الرؤيا، ومحدش فاهمها."]]],"vision":{"text":"جبرائيل بيسمّي الممالك: الكبش أبو قرنين هو ملوك مادي وفارس، والتيس هو ملك اليونان، والقرن العظيم هو الملك الأول (8: 20–21). والأربع قرون أربع ممالك هتقوم من أمته (8: 22).","hist":"الإسكندر الأكبر غزا فارس بين سنة 334 و331 ق.م، ومات سنة 323 ق.م وهو في عز قوته. وإمبراطوريته اتقسمت بين أربعة من قواده. والقرن الصغير بيتفهم عند كتير على إنه أنطيوخس الرابع إبيفانس (175–164 ق.م)، اللي وقّف ذبايح الهيكل ونجّس المقدس سنة 167 ق.م. الهيكل اتدشن من تاني سنة 164 ق.م، وأنطيوخس مات بمرض، مش في حرب."}},"dan5a":{"date":"539 ق.م","title":"وليمة بآنية الهيكل","hook":"بيلشاصر بيشرب بالكاسات اللي اتاخدت من هيكل أورشليم وبيسبّح آلهة دهب وحجر.","s":[["وليمة لألف",["بيلشاصر الملك بيعمل وليمة عظيمة لألف من عظمائه وبيشرب خمر قدامهم.","وهو بيشرب، بيأمر يجيبوا آنية الدهب والفضة اللي نبوخذنصر خدها من الهيكل اللي في أورشليم.","الملك وعظماؤه وزوجاته وسراريه بيشربوا بيها، وبيسبّحوا آلهة الدهب والفضة والنحاس والحديد والخشب والحجر."]]],"note":"التاريخ بيحدد سقوط بابل في أكتوبر 539 ق.م. والسجلات البابلية بتبيّن إن بيلشاصر كان بيحكم المدينة بالنيابة عن أبوه نبونيد، وده ماشي مع عرض المركز التالت في المملكة. وكلمة «أب» في الأصحاح ده ممكن تبقى معناها جد أو ملك سابق."},"dan5b":{"date":"539 ق.م","title":"الإيد على الحيطة","hook":"صوابع بتكتب على الحيطة، والحكما بيفشلوا، والملكة بتفتكر دانيال.","s":[["الإيد",["في الساعة دي ظهرت أصابع إيد إنسان، وكتبت على بياض حيطة قصر الملك، قصاد المنارة.","والملك شايف طرف الإيد وهي بتكتب.","وشه اتغير، ورجليه سابت، وركبه خبطت في بعض."]],["الحكما بيفشلوا",["الملك بيصرخ يجيبوا السحرة والكلدانيين والمنجمين.","اللي يقرا الكتابة ويبيّن تفسيرها هيلبس أرجوان، وطوق دهب في رقبته، ويبقى تالت واحد متسلط في المملكة.","كل حكما الملك ما قدروش يقروا الكتابة ولا يعرّفوه تفسيرها. بيلشاصر فزع أكتر، وعظماؤه اتلخبطوا."]],["الملكة بتفتكر دانيال",["الملكة سمعت الكلام ودخلت بيت الوليمة.","«في مملكتك راجل فيه روح الآلهة القدوسين.» في أيام نبوخذنصر اتلقى فيه نور وفطنة وحكمة.","نبوخذنصر خلّاه كبير المجوس. «فلينادوا دانيال، وهو هيبيّن التفسير.»"]]]},"dan5c":{"date":"539 ق.م","title":"دانيال بيرفض العطايا","hook":"دانيال بيرفض المكافآت، وبيفكّر بيلشاصر بالدرس اللي طنّشه.","s":[["دانيال بيرفض المكافأة",["الملك بيسأل: «إنت دانيال اللي من بني سبي يهوذا، اللي جابه أبويا الملك من يهوذا؟»","وبيكرر عرض الأرجوان وطوق الدهب والمركز التالت في المملكة.","دانيال بيرد: «عطاياك خلّيها لك، وهداياك اديها لغيري. بس أنا هقرا الكتابة للملك.»"]],["الدرس اللي بيلشاصر طنّشه",["الله العلي ادّى نبوخذنصر ملكوت وعظمة وجلال وبهاء.","لما قلبه اتكبّر، نزل عن كرسي ملكه، واتطرد من بين الناس وكل عشب زي التيران، لحد ما عرف إن الله العلي متسلط.","«وإنت يا بيلشاصر ابنه ما وضعتش قلبك، مع إنك عرفت كل ده.»","اتعظم على رب السما، وشرب بآنية بيته، وسبّح آلهة ما بتشوفش ولا بتسمع. والله اللي في إيده نسمته وكل طرقه ما مجّدهوش."]]]},"dan5d":{"date":"539 ق.م","title":"اتوزن واتلقى ناقص: في نفس الليلة","hook":"منا، تقيل، فرس. وفي نفس الليلة بيلشاصر بيتقتل وداريوس المادي بياخد المملكة.","s":[["منا منا تقيل وفرسين",["منا: ربنا أحصى ملكوته وأنهاه.","تقيل: اتوزن بالموازين واتلقى ناقص.","فرس: مملكته اتقسمت واتدّت لمادي وفارس."]],["في نفس الليلة",["بأمر بيلشاصر، دانيال بيلبس أرجوان وطوق دهب في رقبته، وبينادوا إنه التالت المتسلط في المملكة.","في نفس الليلة اتقتل بيلشاصر ملك الكلدانيين.","وداريوس المادي خد المملكة، وهو عنده حوالي اتنين وستين سنة."]]]},"dan9a":{"date":"حوالي 539 – 538 ق.م","title":"دانيال بيقرا إرميا","hook":"في أول سنة لداريوس، دانيال بيفهم من الكتب إن الخراب هيكمل سبعين سنة.","s":[["دانيال بيقرا إرميا",["دي السنة الأولى لداريوس بن أحشويروش، من نسل الماديين، اللي اتملّك على مملكة الكلدانيين.","دانيال فهم من الكتب، حسب كلمة الرب لإرميا، إن خراب أورشليم هيكمل سبعين سنة."]],["صوم ومسح ورماد",["فدانيال وجّه وشه للرب الإله، وطلب بالصلاة والتضرعات، بالصوم والمسح والرماد.","صلى واعترف: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وحافظي وصاياه.»"]]]},"dan9b":{"date":"حوالي 539 – 538 ق.م","title":"صلاة اعتراف","hook":"بصوم ومسح، دانيال بيعترف بخطية شعبه وبيتوسل عشان أورشليم.","s":[["«أخطأنا»",["«أخطأنا وأثمنا وعملنا الشر وتمردنا.» ما سمعوش للأنبياء اللي كلموهم باسم ربنا.","«لك يا سيد البر، أما لنا فخزي الوجوه»: رجالة يهوذا وسكان أورشليم وكل إسرائيل، القريبين والبعيدين.","كل إسرائيل تعدّى على شريعته، فاتصبّت عليهم اللعنة المكتوبة في شريعة موسى."]],["ربنا عمل اللي قاله",["هو أقام كلامه اللي اتكلم بيه عليهم وجاب عليهم شر عظيم. ما اتعملش تحت السموات كلها زي اللي اتعمل في أورشليم.","ومع كده ما اتضرعوش لوجه الرب عشان يرجعوا عن آثامهم ويفطنوا لحقه.","«الرب إلهنا بار في كل أعماله اللي عملها.»"]],["توسل عشان المدينة",["دانيال بيتوسل للإله اللي خرّج شعبه من مصر بإيد قوية: اصرف غضبك عن أورشليم، جبل قدسك.","«أضئ بوجهك على مقدسك الخرب.»","«مش لأجل برّنا بنطرح تضرعاتنا قدامك، لكن لأجل مراحمك العظيمة.»","«يا سيد اسمع. يا سيد اغفر. يا سيد أصغِ واصنع. لا تؤخر من أجل نفسك يا إلهي.»"]]]},"dan9c":{"date":"حوالي 539 – 538 ق.م","title":"جبرائيل والسبعين أسبوع","hook":"جبرائيل بيوصل ودانيال لسه بيصلي، ومعاه خط زمني بيوصل للمسيح الرئيس.","s":[["جبرائيل بيوصل في نص الصلاة",["ودانيال لسه بيتكلم وبيصلي وبيعترف، جبرائيل جاله طاير بسرعة، عند وقت تقدمة المسا.","«يا دانيال، أنا خرجت دلوقتي عشان أعلّمك الفهم.»","«في أول تضرعاتك خرج الأمر، وأنا جيت أخبّرك، لأنك إنت محبوب.»"]],["سبعين أسبوع اتحددوا",["سبعين أسبوع اتحددوا على شعب دانيال وعلى مدينته المقدسة.","الهدف: تكميل المعصية، وتتميم الخطايا، وكفارة الإثم، وإنه يتجاب البر الأبدي، وختم الرؤيا والنبوة، ومسح قدوس القدوسين."]],["لحد المسيح الرئيس",["من خروج الأمر بتجديد أورشليم وبناها لحد المسيح الرئيس، سبع أسابيع واتنين وستين أسبوع.","المدينة هترجع وتتبني بسوق وخليج، بس في ضيق الأزمنة."]],["بيتقطع، ومدينة بتتخرب",["بعد الاتنين وستين أسبوع، المسيح بيتقطع وليس له.","وشعب رئيس آتٍ بيخرب المدينة والقدس. انتهاؤه بغمارة، وحرب وخرب لحد النهاية.","وبيثبّت عهد مع كتيرين في أسبوع واحد، وفي نص الأسبوع بيبطّل الذبيحة والتقدمة.","وعلى جناح الأرجاس مخرِّب، لحد ما يتم ويتصبّ المقضي على المخرِّب."]]],"vision":{"text":"سبعين «أسبوع» اتحددوا على شعب دانيال والمدينة المقدسة، بست أهداف بتنتهي بالبر الأبدي (9: 24). المسيح بييجي بعد تسعة وستين أسبوع وبعدين بيتقطع، والمدينة والقدس بيتخربوا (9: 25–26).","hist":"الأسابيع بتتفهم في العموم على إنها أسابيع سنين، يعني 490 سنة. مفسرين محافظين كتير بيحسبوا التسعة وستين أسبوع من أمر فارسي بتجديد أورشليم (عزرا 7 أو نحميا 2) لحد مجي يسوع المسيح، وبيشوفوا صلبه في قطع المسيح، وخراب أورشليم على إيد الرومان سنة 70 م في خراب المدينة والقدس. والآراء مختلفة في الأسبوع الأخير: فيه اللي شايفه اتحقق في القرن الأول، وكتير شايفينه لسه في المستقبل. ويسوع اتكلم عن «رجسة الخراب التي قال عنها دانيال النبي» (متى 24: 15)."}},"dan6a":{"date":"حوالي 538 ق.م، السنة مش مذكورة","title":"مفيش عيب يتلاقى","hook":"دانيال بيتفوّق أيام داريوس، وأعداؤه ما لقوش عليه حاجة غير شريعة إلهه.","s":[["دانيال بيتميز",["داريوس بيعيّن مية وعشرين مرزبان على المملكة كلها، وعليهم تلات وزرا. ودانيال واحد من التلاتة.","دانيال اتفوّق عليهم لأن فيه روح فاضلة، والملك فكّر يولّيه على المملكة كلها."]],["مفيش عيب يتلاقى",["الوزرا والمرازبة بيدوّروا على علّة على دانيال من ناحية شغل المملكة.","ما قدروش يلاقوا علّة ولا ذنب، لأنه كان أمين ومفيش فيه خطأ ولا ذنب.","فقالوا: «مش هنلاقي على دانيال ده علّة، إلا لو لقيناها من ناحية شريعة إلهه.»"]]],"note":"الأصحاح ما بيذكرش سنة. ولو حسبنا من وصوله لبابل وهو شاب حوالي 605 ق.م، دانيال يبقى عدّى التمانين في الوقت ده."},"dan6b":{"date":"حوالي 538 ق.م، السنة مش مذكورة","title":"الفخ والشبابيك المفتوحة","hook":"قانون تلاتين يوم ضد الصلاة، ودانيال بيصلي تلات مرات في اليوم زي الأول.","s":[["الفخ",["بيدخلوا للملك مجموعة وبيقولوا إن كل الرؤسا اتفقوا على أمر.","أي حد يطلب طلبة من أي إله أو إنسان لمدة تلاتين يوم، غير من الملك، يترمي في جب الأسود.","بيطلبوا منه يمضي الكتابة عشان ما تتغيرش، زي شريعة مادي وفارس اللي ما بتتنسخش. وداريوس بيمضي."]],["شبابيك مفتوحة ناحية أورشليم",["لما دانيال عرف إن الكتابة اتمضت، راح بيته، وشبابيك عُليته مفتوحة ناحية أورشليم.","وتلات مرات في اليوم بيركع على ركبه ويصلي ويحمد قدام إلهه، زي ما كان بيعمل قبل كده."]]]},"dan6c":{"date":"حوالي 538 ق.م، السنة مش مذكورة","title":"في جب الأسود","hook":"اتمسك وهو بيصلي واترمى للأسود، والملك حاول ينقذه لحد غروب الشمس.","s":[["اتمسك وهو بيصلي",["الرجالة راحوا مجموعة ولقوا دانيال بيطلب وبيتضرع قدام إلهه.","راحوا للملك وفكّروه بأمره. وهو أكد إن الأمر ثابت وما بيتنسخش.","فقالوا: «دانيال اللي من بني سبي يهوذا ما عملش لك اعتبار أيها الملك، ولا للأمر اللي مضيته. لسه بيطلب طلبته تلات مرات في اليوم.»"]],["ملك واقع في قانونه",["لما الملك سمع الكلام ده اغتاظ على نفسه جدًا. حط قلبه على دانيال عشان ينجيه، واجتهد لحد غروب الشمس عشان ينقذه.","الرجالة رجعوا وفكّروه إن كل نهي أو أمر الملك بيحطه ما بيتغيرش."]],["في الجب",["الملك أمر، فجابوا دانيال ورموه في جب الأسود. والملك قال له: «إلهك اللي بتعبده دايمًا هو ينجيك!»","اتحط حجر على بُق الجب، والملك ختمه بختمه وختم عظمائه.","الملك رجع قصره وبات صايم، وما دخّلوش قدامه أي تسلية. والنوم طار منه."]]]},"dan6d":{"date":"حوالي 538 ق.م، السنة مش مذكورة","title":"طالع من الجب من غير جرح","hook":"ربنا بيسد بُق الأسود، وداريوس بيأمر كل مملكته يخافوا إله دانيال.","s":[["مع أول نور",["في الفجر، مع أول نور، الملك قام وراح بسرعة لجب الأسود.","نادى بصوت حزين: «يا دانيال عبد الله الحي، هل إلهك اللي بتعبده دايمًا قدر ينجيك من الأسود؟»","دانيال رد: «أيها الملك عِش إلى الأبد! إلهي بعت ملاكه وسد بُق الأسود.»","«ما ضرّونيش، لأني اتلقيت بريء قدامه. وقدامك كمان أيها الملك ما عملتش ذنب.»"]],["طلع من غير جرح",["الملك فرح جدًا وأمر يطلّعوا دانيال من الجب.","ما اتلقاش فيه أي ضرر، لأنه آمن بإلهه.","والرجالة اللي اشتكوا على دانيال اترموا في الجب هم وولادهم وستاتهم. والأسود مسكتهم وسحقت عضمهم قبل ما يوصلوا لقاع الجب."]],["أمر داريوس",["داريوس بيكتب لكل الشعوب والأمم والألسنة: في كل سلطان مملكته الناس لازم يرتعدوا ويخافوا قدام إله دانيال.","«هو الإله الحي القيوم إلى الأبد. ملكوته ما يزولش. هو بينجي وينقذ. هو اللي نجّى دانيال من إيد الأسود.»","ودانيال نجح في ملك داريوس وفي ملك كورش الفارسي."]]]},"cyrus":{"date":"حوالي 538 ق.م","title":"كورش بيرجّع المسبيين","hook":"السبعين سنة بيخلصوا، والآنية اللي اتاخدت في دانيال 1 بترجع أورشليم.","thread":"آنية الهيكل اللي اتاخدت في دانيال 1: 2 بتتعدّ وترجع في عزرا 1: 7–11.","s":[["اسمه اتقال من قبلها",["على لسان إشعياء، الرب قال عن كورش: «راعيّ، فكل مسرتي يتمم.» وهيقول عن أورشليم: «ستُبنى»، وللهيكل: «ستؤسَّس.»","الرب بيسمي كورش مسيحه، اللي ماسك بيمينه عشان يدوس قدامه أمم.","بيدعيه باسمه عشان إسرائيل مختاره، مع إن كورش ما يعرفوش."]],["الرب بينبّه قلب ملك",["في السنة الأولى لكورش ملك فارس، الرب نبّه روح كورش، عشان يتم كلام الرب بفم إرميا.","كورش أطلق ندا في كل مملكته، وكمان بالكتابة."]],["الأمر",["«الرب إله السما اداني كل ممالك الأرض، وهو أوصاني أبني له بيت في أورشليم اللي في يهوذا.»","أي حد من شعبه يقدر يطلع أورشليم ويبني بيت الرب، «ليكن إلهه معه.»","وأهل مكانهم يساعدوهم بفضة ودهب وأمتعة وبهايم، مع تبرع لبيت الله."]],["قلوب اتحركت تروح",["رؤوس آباء يهوذا وبنيامين والكهنة واللاويين قاموا يطلعوا: كل واحد ربنا نبّه روحه.","وكل اللي حواليهم ساعدوهم بآنية فضة ودهب وأمتعة وبهايم وتحف."]],["الآنية بترجع بيتها",["الملك كورش خرّج آنية بيت الرب، اللي نبوخذنصر خرّجها من أورشليم وحطها في بيت آلهته.","واتعدّت لشيشبصر رئيس يهوذا.","كل الآنية من دهب وفضة خمس آلاف وأربعمية، طلعت مع المسبيين من بابل لأورشليم."]],["دانيال لسه في فارس",["بعدها بسنتين، في السنة التالتة لكورش، دانيال لسه بياخد إعلان وهو واقف على شط نهر دجلة.","والكتاب المقدس ما بيسجلش إن دانيال رجع أورشليم."]]]},"dan10a":{"date":"حوالي 536 ق.م","title":"تلات أسابيع نوح والراجل اللابس كتان","hook":"عند نهر دجلة، دانيال بيشوف راجل زي البرق وبيقع على وشه.","s":[["رسالة عن جهاد عظيم",["في السنة التالتة لكورش ملك فارس، اتكشف أمر لدانيال اللي اسمه بلطشاصر.","الأمر حق، والجهاد عظيم. وهو فهم الأمر وكان له معرفة بالرؤيا."]],["تلات أسابيع نوح",["في الأيام دي دانيال كان نايح تلات أسابيع كاملة.","ما كلش أكل شهي، ولا دخل بُقه لحم ولا خمر، ولا ادّهن، لحد ما التلات أسابيع خلصوا."]],["الراجل اللابس كتان",["في اليوم الرابع والعشرين من الشهر الأول، دانيال كان واقف جنب النهر العظيم، دجلة.","رفع عينيه وشاف راجل لابس كتان، ووسطه متحزم بدهب أوفاز.","جسمه زي الزبرجد، ووشه زي منظر البرق، وعينيه زي مصابيح نار، ودراعاته ورجليه زي النحاس المصقول، وصوت كلامه زي صوت جمهور."]],["دانيال بيفضل لوحده",["دانيال بس اللي شاف الرؤيا. الرجالة اللي معاه ما شافوش، بس وقعت عليهم رعدة عظيمة فهربوا يستخبوا.","فضل لوحده، وما بقاش فيه قوة، ونضارته اتحولت فيه لفساد.","ولما سمع صوت كلامه، وقع في نوم تقيل ووشه على الأرض."]]]},"dan10b":{"date":"حوالي 536 ق.م","title":"اتسمعت من أول يوم: واحد وعشرين يوم مقاومة","hook":"رئيس فارس قاوم الرسول لحد ما ميخائيل جه يعينه.","s":[["«أيها الرجل المحبوب»",["إيد لمسته وقوّمته مرتعش على ركبه وكفوف إيديه.","«يا دانيال، أيها الرجل المحبوب، افهم الكلام اللي بكلمك بيه، وقوم على مقامك.» فقام وهو بيرتعد.","«لا تخف يا دانيال. من أول يوم حطيت فيه قلبك للفهم ولإذلال نفسك قدام إلهك، كلامك اتسمع، وأنا جيت عشان كلامك.»"]],["واحد وعشرين يوم مقاومة",["«رئيس مملكة فارس وقف قصادي واحد وعشرين يوم.»","«وميخائيل، واحد من الرؤساء الأولين، جه يعينني.»","ودلوقتي جه يفهّمه اللي هيحصل لشعبه في الأيام الأخيرة، لأن الرؤيا لأيام لسه جاية."]],["قوة لراجل مش قادر يتكلم",["دانيال حط وشه للأرض وسكت. وواحد شبه بني آدم لمس شفايفه، ففتح بُقه.","«إزاي عبد سيدي ده يقدر يتكلم مع سيدي؟ ما فضلش فيّ قوة، وما بقاش فيّ نَفَس.»","اللي زي منظر إنسان رجع لمسه وقوّاه: «لا تخف أيها الرجل المحبوب. سلام لك. تشدد. تقوَّ.»","دانيال اتقوى وقال: «ليتكلم سيدي لأنك قويتني.»"]],["المعركة اللي ورا الستار",["«دلوقتي هرجع أحارب رئيس فارس، ولما أخرج، رئيس اليونان هييجي.»","بس الأول هيخبّره بالمرسوم في كتاب الحق.","ومحدش بيتمسك معاه على دول غير ميخائيل «رئيسكم»."]]]},"dan11a":{"date":"حوالي 536 ق.م","title":"فارس واليونان وحروب الشمال والجنوب","hook":"ملوك بتقوم وتقع، وتحالفات بتفشل، والأرض البهية بينهم.","s":[["فارس، وبعدين ملك جبار",["تلات ملوك كمان هيقوموا في فارس، والرابع هيبقى أغنى منهم كلهم بكتير. وبغناه هيهيّج الكل على مملكة اليونان.","وبعدين يقوم ملك جبار، يتسلط تسلط عظيم ويعمل اللي على كيفه.","وأول ما يقوم، مملكته تتكسر وتتقسم لرياح السما الأربعة. ومش هتروح لنسله."]],["بداية الجنوب والشمال",["ملك الجنوب هيتقوى، بس واحد من رؤسائه هيقوى عليه ويتسلط على مملكته هو.","بعد سنين هيتعاهدوا. بنت ملك الجنوب هتروح لملك الشمال عشان تعمل اتفاق، بس مش هتحتفظ بقوتها، وهتتسلّم.","وواحد من فرع أصولها هيهجم على جيش ملك الشمال، ويدخل حصنه ويغلب. وهياخد آلهتهم وآنيتهم الثمينة سبي لمصر."]],["أجيال من الحرب",["ولاد ملك الشمال هيجمعوا جيوش عظيمة تغمر وتطمّ. وملك الجنوب هيطلع بغيظ ويغلب جمهور عظيم، بس مش هيعتز.","ملك الشمال هيرجع بجيش أكبر. ورجالة عتاة من شعب دانيال نفسه هيقوموا عشان يثبّتوا الرؤيا، بس هيعثروا.","هياخد مدينة حصينة ويقف في الأرض البهية. وهيدّي بنته جواز عشان يخرب المملكة، بس خطته مش هتنجح.","هيحوّل وشه للجزاير، بس قائد هيبطّل تعييره. وهيعثر ويقع وما يتلاقاش."]]],"vision":{"text":"الملاك بيسمي فارس واليونان (11: 2) وبيوصف ملك جبار مملكته بتتقسم لرياح السما الأربعة (11: 3–4). والباقي محكي كسلسلة ملوك للشمال والجنوب من غير أسامي، والأرض البهية بينهم.","hist":"المؤرخين بيطابقوا الآيات دي بدقة: ملوك فارس لحد أحشويروش (زركسيس)، اللي غزا اليونان سنة 480 ق.م (آية 2)؛ والإسكندر الأكبر وتقسيم إمبراطوريته (آيات 3–4)؛ والبطالمة في مصر في الجنوب والسلوقيين في سوريا في الشمال (آيات 5–20)؛ وأنطيوخس الرابع إبيفانس، اللي أسطول روماني رجّعه من مصر سنة 168 ق.م ونجّس الهيكل سنة 167 ق.م، وده اللي أدّى لمقاومة المكابيين (آيات 21–35). وفي الآيات 36–45 المفسرين منقسمين. فيه اللي بيكمّل مع أنطيوخس. ومفسرين محافظين كتير شايفين حاكم أخير في وقت النهاية، لأن التفاصيل مش ماشية مع طريقة موت أنطيوخس."}},"dan11b":{"date":"حوالي 536 ق.م","title":"الملك المحتقر والهيكل المتنجس","hook":"بياخد العرش بالتملقات ويحط الرجس، بس اللي يعرفوا إلههم بيثبتوا.","s":[["راجل محتقر بياخد العرش",["اللي بعده هيبعت جابي ضرايب، وفي أيام قليلة هينكسر، بس مش بغضب ولا بحرب.","وهيقوم مكانه واحد محتقر ما ادّوهوش فخر المملكة. هياخد المملكة بالتملقات.","جيش جارف هينجرف من قدامه، ومعاه رئيس العهد. هيتصرف بمكر ويوزّع النهب على أتباعه."]],["حروب ضد الجنوب",["هينهّض قوته على ملك الجنوب، اللي مش هيثبت بسبب التدابير اللي بيدبّروها عليه اللي بياكلوا من أكله.","الملكين هيقعدوا على سفرة واحدة ويكدبوا على بعض، ومش هينفع.","هيرجع أرضه بغنى عظيم، بس قلبه على العهد المقدس.","في الميعاد هيرجع ويدخل الجنوب تاني، بس سفن من كتّيم هتيجي عليه، فييأس."]],["الهيكل بيتنجس",["هيرجع ويغتاظ على العهد المقدس، ويصغي للي سابوا العهد.","جيوشه هتنجّس المقدس الحصين، وتشيل المحرقة الدايمة، وتحط الرجس المخرِّب.","بالتملقات هيغوي اللي تعدّوا على العهد، بس الشعب اللي يعرفوا إلههم يقووا ويعملوا."]],["الفاهمين بيتنقّوا",["الفاهمين من الشعب هيعلّموا كتيرين، مع إنهم هيعثروا أيام بالسيف واللهيب والسبي والنهب.","لما يعثروا هيتعانوا عون قليل، وكتير هيتصلوا بيهم بالتملقات.","وبعض الفاهمين هيعثروا، عشان يتمحّصوا ويتطهّروا ويتبيّضوا لحد وقت النهاية."]]]},"dan11c":{"date":"حوالي 536 ق.م","title":"الملك اللي بيرفع نفسه","hook":"بيتعظم على كل إله، بس بيوصل لنهايته ومحدش بيعينه.","s":[["الملك اللي بيرفع نفسه",["الملك هيعمل اللي على كيفه. هيرتفع ويتعظم على كل إله، ويتكلم بأمور عجيبة على إله الآلهة.","هينجح لحد ما الغضب يتم، لأن المقضي بيه لازم يحصل.","مش هيبالي بآلهة آبائه. وهيكرم إله الحصون، ويقسّم الأرض أجرة."]],["نهايته",["في وقت النهاية ملك الجنوب هيحاربه، وملك الشمال هيثور عليه بمركبات وفرسان وسفن كتيرة.","هيدخل الأرض البهية. بلاد كتير هتعثر، وهيتسلط على كنوز مصر.","أخبار من الشرق ومن الشمال هتفزعه، فيخرج بغضب عظيم عشان يخرب كتيرين.","هينصب خيام قصره بين البحور وجبل بهاء القدس. بس هيوصل لنهايته، ومحدش هيعينه."]]]},"dan12a":{"date":"حوالي 536 ق.م","title":"ميخائيل بيقوم والراقدين بيصحوا","hook":"زمان ضيق، ونجاة للمكتوبين في السفر، والفاهمين بيضوّوا زي الكواكب.","s":[["ميخائيل بيقوم",["في الوقت ده يقوم ميخائيل، الرئيس العظيم القايم لبني شعب دانيال.","وهيبقى زمان ضيق ما حصلش زيه من ساعة ما كانت أمة لحد الوقت ده.","بس في الوقت ده شعب دانيال هينجّى: كل اللي اسمه مكتوب في السفر."]],["الراقدين هيصحوا",["كتيرين من الراقدين في تراب الأرض هيصحوا، دول للحياة الأبدية، ودول للعار وللازدراء الأبدي.","الفاهمين هيضوّوا زي ضيا الجلد.","واللي ردّوا كتيرين للبر هيبقوا زي الكواكب لأبد الدهور."]],["اختم السفر",["دانيال اتقال له يخفي الكلام ويختم السفر لحد وقت النهاية.","كتيرين هيتصفّحوه، والمعرفة هتزيد."]]],"vision":{"text":"الملاك بيتكلم عن زمان ضيق ما حصلش زيه، ونجاة كل اللي اسمه مكتوب في السفر، وقيامة للحياة الأبدية أو للعار والازدراء الأبدي (12: 1–2). والكلام مختوم لوقت النهاية (12: 9).","hist":"أرقام الـ 1290 يوم والـ 1335 يوم مش متفسّرة في النص، والمفسرين مش متفقين عليها."}},"dan12b":{"date":"حوالي 536 ق.م","title":"«اذهب يا دانيال»","hook":"السفر بيتختم، والأيام بتتعدّ، ودانيال بياخد وعد بالراحة والقيامة.","s":[["«إلى متى؟»",["دانيال شاف اتنين تانيين واقفين، واحد على كل شط من النهر.","واحد سأل الراجل اللابس كتان اللي فوق مية النهر: «إلى متى انتهاء العجايب؟»","الراجل رفع إيديه الاتنين للسما وحلف بالحي إلى الأبد: لزمان وزمانين ونص. ولما يتم تفريق إيد الشعب المقدس، كل ده يتم."]],["«سمعت وما فهمتش»",["دانيال سأل: «يا سيدي، إيه آخر الأمور دي؟»","فقال: «اذهب يا دانيال، لأن الكلام مخفي ومختوم لوقت النهاية.»","كتيرين هيتطهّروا ويتبيّضوا ويتمحّصوا، والأشرار هيعملوا شر. ولا واحد من الأشرار هيفهم، بس الفاهمين هيفهموا."]],["الأيام المعدودة",["من وقت شيل المحرقة الدايمة وإقامة رجس المخرِّب، ألف ومتين وتسعين يوم.","طوبى للي ينتظر ويوصل للألف وتلتمية وخمسة وتلاتين يوم."]],["استريح، وبعدين قوم",["«أما أنت فاذهب إلى النهاية.»","«فتستريح، وتقوم لقرعتك في نهاية الأيام.»"]]],"note":"السفر ما بيسجلش موت دانيال. آخر جملة فيه وعد اتقال له."}};

      sc.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;dragMoved=false;sx=e.clientX;sl=sc.scrollLeft;});
      sc.addEventListener("pointermove",e=>{if(!down)return;const d=e.clientX-sx;if(Math.abs(d)>5){dragMoved=true;sc.classList.add("drag");}sc.scrollLeft=sl-d;});
      const end=()=>{down=false;sc.classList.remove("drag");setTimeout(()=>dragMoved=false,0);};
      sc.addEventListener("pointerup",end);sc.addEventListener("pointerleave",end);
    }else{
      dOpen=null;mark();placeDots();
      const rows=document.querySelectorAll(".t2-row");
      if("IntersectionObserver" in window){
        const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.remove("pre");io.unobserve(x.target)}}),{threshold:.2});
        rows.forEach(r=>io.observe(r));
      }else rows.forEach(r=>r.classList.remove("pre"));
    }
  }else{
    stopPlay();
    $("#intro").textContent=U.chIntro;
    const items=MM.filter(m=>m.ch).sort((a,b)=>a.ch-b.ch||a.sub-b.sub);
    const chs=[...new Set(items.map(m=>m.ch))];
    $("#content").innerHTML=`<div class="wrap"><section class="group"><span class="label">${U.chLabel}</span><h2>${U.chTitle}</h2><p>${U.chSub}</p>`+
      chs.map(c=>{const it=items.filter(m=>m.ch===c);return `<div class="chg" id="ch-${c}"><h3 class="chh"><span class="grad">${U.daniel} ${c}</span><small>${it[0].date} · ${U.chMs(it.length)}</small></h3><ol class="list">${it.map(m=>card(m,m.ch+"."+(m.sub+1))).join("")}</ol></div>`;}).join("")+`</section></div>`;
    $("#strip").innerHTML=items.filter(m=>!m.sub).map(m=>`<a href="#${m.id}" data-jump="${m.id}"><span class="num">${U.chShort} ${m.ch}</span><span>${m.date.split(/[,،]/)[0]}</span></a>`).join("");
    syncAll();
  }
  const ct=$("#content");ct.classList.remove("swap");void ct.offsetWidth;ct.classList.add("swap");
  if(window.fxAfterRender)fxAfterRender();
  $("#v-timeline").setAttribute("aria-pressed",tl);
  $("#v-chapters").setAttribute("aria-pressed",!tl);
}
function syncAll(){
  const shown=document.querySelectorAll(".ms").length;
  const openShown=document.querySelectorAll(".ms.open").length;
  $("#toggle-all").textContent=shown&&openShown===shown?U.closeAll:U.openAll;
}
function setOpen(id,on){
  on?open.add(id):open.delete(id);
  const el=document.getElementById(id);
  if(el){el.classList.toggle("open",on);el.querySelector(".head").setAttribute("aria-expanded",on);}
  syncAll();
}
function setView(v,push){
  view=v;render();
  try{localStorage.setItem("daniel-view",v)}catch(e){}
  if(push){try{location.hash=v}catch(e){}}
}
document.addEventListener("click",e=>{
  const dc=e.target.closest("[data-desc]");
  if(dc){openDesc(dOpen===dc.dataset.desc?null:dc.dataset.desc,false);return;}
  const s=e.target.closest("[data-sel]");
  if(s){if(dragMoved)return;select(s.dataset.sel,!!s.dataset.map);return;}
  const h=e.target.closest(".head");
  if(h){setOpen(h.dataset.id,!open.has(h.dataset.id));return;}
  const j=e.target.closest("[data-jump]");
  if(j){
    e.preventDefault();
    const id=j.dataset.jump;setOpen(id,true);
    document.getElementById(id).scrollIntoView({behavior:"smooth",block:"start"});
  }
});
$("#v-timeline").onclick=()=>setView("timeline",true);
$("#v-chapters").onclick=()=>setView("chapters",true);
$("#toggle-all").onclick=()=>{
  const all=[...document.querySelectorAll(".ms")].map(x=>x.id);
  const allOpen=all.every(id=>open.has(id));
  all.forEach(id=>allOpen?open.delete(id):open.add(id));
  render();
};
$("#lang").onclick=()=>{
  lang=isAr()?"en":"ar";
  try{localStorage.setItem("daniel-lang",lang)}catch(e){}
  render();
};
$("#theme").onclick=()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;
  $("#theme").textContent=t==="dark"?U.light:U.dark;
  try{localStorage.setItem("daniel-theme",t)}catch(e){}
};

/* tooltips */
const tipEl=document.createElement("div");tipEl.className="tip";tipEl.setAttribute("role","tooltip");document.body.appendChild(tipEl);
let tipFor=null;
function showTip(el){
  const t=TIPS[el.dataset.tip];if(!t)return;
  tipFor=el;
  tipEl.innerHTML=`<b>${esc(t[0])}</b><span>${esc(t[1])}</span><p>${esc(t[2])}</p>`;
  tipEl.style.display="block";
  const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  let left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8));
  let top=r.top-h-10;if(top<64)top=r.bottom+10;
  tipEl.style.left=left+"px";tipEl.style.top=top+"px";
}
function hideTip(){tipFor=null;tipEl.style.display="none";}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);});
document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-tip]");if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);});
document.addEventListener("focusout",hideTip);
document.addEventListener("click",e=>{const el=e.target.closest("[data-tip]");if(el&&!el.dataset.sel){if(tipFor!==el)showTip(el);}else if(!el)hideTip();});
window.addEventListener("scroll",hideTip,{passive:true});

/* ================= motion + experience ================= */
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function step(d){const i=ORDER.indexOf(sel)+d;if(i>=0&&i<ORDER.length)select(ORDER[i],false);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b)step(+b.dataset.step);});

/* living background: drifting stars + a soft light that follows the pointer */
(function(){
  const cv=document.createElement("canvas");cv.className="stars";cv.setAttribute("aria-hidden","true");document.body.prepend(cv);
  const spot=document.createElement("div");spot.className="spot";spot.setAttribute("aria-hidden","true");document.body.prepend(spot);
  const ctx=cv.getContext("2d");let w=0,h=0,dpr=1,stars=[],mx=0,my=0,tx=0,ty=0,sx=-999,sy=-999,px=-999,py=-999;
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(150,Math.round(w*h/9000));stars=Array.from({length:n},()=>({x:Math.random(),y:Math.random(),z:.2+Math.random()*.8,r:.4+Math.random()*1.3,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,vx:(Math.random()-.5)*.004}));}
  function draw(t){
    const dark=document.documentElement.dataset.theme==="dark";
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;
    ctx.clearRect(0,0,w,h);
    const sc=window.scrollY||0;
    for(const s of stars){
      s.x+=s.vx*.016;if(s.x<0)s.x+=1;if(s.x>1)s.x-=1;
      let x=s.x*w+mx*s.z*34,y=((s.y*h-sc*s.z*.08+my*s.z*22)%h+h)%h;
      const a=(dark?.75:.4)*s.z*(.55+.45*Math.sin(t*.001*s.sp+s.ph));
      ctx.beginPath();ctx.arc(x,y,s.r*(.6+s.z*.6),0,6.283);
      ctx.fillStyle=dark?(s.z>.7?`rgba(122,245,230,${a})`:`rgba(150,190,255,${a})`):`rgba(9,120,190,${a})`;ctx.fill();
    }
    if(px>-900){sx+=(px-sx)*.12;sy+=(py-sy)*.12;spot.style.transform=`translate(${sx-320}px,${sy-320}px)`;spot.style.opacity=1;}
    if(!RM&&!document.hidden)requestAnimationFrame(draw);
  }
  addEventListener("resize",()=>{size();if(RM)draw(0);});
  addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;tx=(e.clientX/innerWidth-.5)*-1;ty=(e.clientY/innerHeight-.5)*-1;px=e.clientX;py=e.clientY;if(sx<-900){sx=px;sy=py;}},{passive:true});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!RM)requestAnimationFrame(draw);});
  size();requestAnimationFrame(draw);
})();

/* scroll progress + the Descent spine filling as you read */
const prog=document.createElement("div");prog.className="prog";document.body.appendChild(prog);
let ticking=false;
function onScroll(){
  ticking=false;
  const max=document.documentElement.scrollHeight-innerHeight;
  prog.style.transform=`scaleX(${max>0?Math.min(1,scrollY/max):0})`;
  const mid=innerHeight*.55;
  document.querySelectorAll(".t2-list").forEach(l=>{
    const r=l.getBoundingClientRect(),f=l.querySelector(".t2-fill");
    if(f)f.style.height=Math.max(0,Math.min(r.height,mid-r.top))+"px";
    l.querySelectorAll(".t2-row").forEach(row=>{const d=row.querySelector(".t2-dot");row.classList.toggle("lit",r.top+row.offsetTop+d.offsetTop<mid);});
  });
}
addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
function fxAfterRender(){
  onScroll();
  const t1=$("#t1");
  if(t1&&"IntersectionObserver" in window&&!RM){t1.classList.add("pre");
    const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){t1.classList.remove("pre");io.disconnect();}},{threshold:.25});io.observe(t1);}
}
window.fxAfterRender=fxAfterRender;

/* cards lean toward the pointer */
if(!RM){
  let tilted=null;
  document.addEventListener("mousemove",e=>{
    const c=e.target.closest&&e.target.closest(".t1-card,.t2-card");
    if(tilted&&tilted!==c){tilted.style.transform="";tilted=null;}
    if(!c||dragMoved)return;
    const r=c.getBoundingClientRect(),rx=((e.clientY-r.top)/r.height-.5)*-7,ry=((e.clientX-r.left)/r.width-.5)*9;
    c.style.transform=`perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-3px)`;tilted=c;
  },{passive:true});
}

/* keyboard: arrows walk the river */
document.addEventListener("keydown",e=>{
  if(cineOn){
    if(e.key==="Escape")closeCine();
    else if(e.key==="ArrowRight")cineGo(isAr()?-1:1);
    else if(e.key==="ArrowLeft")cineGo(isAr()?1:-1);
    else if(e.key===" "){e.preventDefault();cinePause();}
    return;
  }
  if(view!=="timeline"||layout!=="river"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const t1=$("#t1");if(!t1)return;const r=t1.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  if(e.key==="ArrowRight"){e.preventDefault();step(isAr()?-1:1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();step(isAr()?1:-1);}
});

/* ---------- story mode (full screen) ---------- */
const cine=document.createElement("div");cine.className="cine";cine.setAttribute("role","dialog");cine.setAttribute("aria-modal","true");
cine.innerHTML=`<div class="cine-orb"></div><button class="ghost cine-x" id="cine-x"></button>
  <div class="cine-stage" id="cine-stage" aria-live="polite"></div>
  <div class="cine-track" id="cine-track"></div>
  <div class="cine-ctl"><button class="ghost" id="cine-prev"></button><button class="play" id="cine-pp"></button><button class="ghost" id="cine-next"></button></div>`;
document.body.appendChild(cine);
let cineOn=false,ci=0,cPaused=false,cPrev=720,tw=0;
const HUE={g1:6,g2:-8,g3:-24,g4:-42};
function tweenYear(el,from,to,ms,end){
  cancelAnimationFrame(tw);
  if(RM){el.textContent=end;return;}
  const t0=performance.now();
  const f=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)tw=requestAnimationFrame(f);else el.textContent=end;};
  tw=requestAnimationFrame(f);
}
function cineShow(i){
  ci=Math.max(0,Math.min(MM.length-1,i));
  const m=MM[ci],g=GG.find(q=>q.id===m.g),gi=GG.indexOf(g),num=Math.round(Y[m.id]);
  $("#cine-stage").innerHTML=`<span class="label cine-part">${U.part} ${gi+1} · ${g.title}</span>
    <div class="cine-yr"><span dir="ltr" id="cine-y">${cPrev}</span><small>${U.bc}</small></div>
    <div class="cine-chip">${chip(m)}<span class="date">${m.date}</span></div>
    <h2 class="cine-t">${m.title.split(" ").map((w,k)=>`<span class="w"><span style="--i:${k}">${esc(w)}</span></span>`).join(" ")}</h2>
    <p class="cine-h">${esc(m.hook)}</p>
    <button class="play cine-open" id="cine-open">${U.openThis}</button>`;
  tweenYear($("#cine-y"),cPrev,num,1100,m.yrL);cPrev=num;
  const p=8+xs(Y[m.id])*.84;
  cine.style.setProperty("--ox",(isAr()?100-p:p)+"%");cine.style.setProperty("--hr",HUE[m.g]+"deg");
  $("#cine-track").innerHTML=MM.map((q,k)=>`<button class="seg-d ${k<ci?"done":k===ci?"cur":""} ${q.ch?"d":""}" data-ci="${k}" aria-label="${esc(q.title)}"><i></i></button>`).join("");
  cine.classList.toggle("paused",cPaused);
  const cur=cine.querySelector(".seg-d.cur i");
  cur.addEventListener("animationend",()=>{if(ci<MM.length-1)cineShow(ci+1);else{cPaused=true;cineLabels();cine.classList.add("paused");}},{once:true});
  $("#cine-open").onclick=()=>{const id=m.id;closeCine();select(id,true);};
  $("#cine-prev").disabled=ci===0;$("#cine-next").disabled=ci===MM.length-1;
}
function cineLabels(){
  $("#cine-x").textContent="✕ "+U.close;
  $("#cine-prev").textContent=(isAr()?"→ ":"← ")+U.prev;$("#cine-next").textContent=U.next+(isAr()?" ←":" →");
  $("#cine-pp").innerHTML=cPaused?`<span aria-hidden="true">▶</span> ${U.resume}`:`<span aria-hidden="true">❚❚</span> ${U.pause}`;
}
function cineGo(d){const n=ci+d;if(n<0||n>=MM.length)return;cineShow(n);}
function cinePause(){cPaused=!cPaused;cine.classList.toggle("paused",cPaused);cineLabels();}
function openCine(i){cineOn=true;cPaused=false;cPrev=720;cine.classList.add("on");document.documentElement.classList.add("lock");cineLabels();cineShow(i||0);$("#cine-pp").focus();}
function closeCine(){cineOn=false;cancelAnimationFrame(tw);cine.classList.remove("on");document.documentElement.classList.remove("lock");$("#cine-stage").innerHTML="";$("#cine-track").innerHTML="";const b=$("#play");if(b)b.focus();}
$("#cine-x").onclick=closeCine;$("#cine-prev").onclick=()=>cineGo(-1);$("#cine-next").onclick=()=>cineGo(1);$("#cine-pp").onclick=cinePause;
cine.addEventListener("click",e=>{const d=e.target.closest("[data-ci]");if(d)cineShow(+d.dataset.ci);});
let swx=null;
cine.addEventListener("pointerdown",e=>{swx=e.clientX;});
cine.addEventListener("pointerup",e=>{if(swx==null)return;const dx=e.clientX-swx;swx=null;if(Math.abs(dx)>70)cineGo((dx<0?1:-1)*(isAr()?-1:1));});

/* verse popover: Van Dyke text on AVD links, a note on NLT links */
const vpop=document.createElement("div");vpop.className="vpop";vpop.setAttribute("role","tooltip");document.body.appendChild(vpop);
let vFor=null,vHide=0;
function verses(code){
  const m=code.match(/^(\w+) (\d+)(?::(\d+)(?:-(\d+))?)?$/),c=VD[m[1]]&&VD[m[1]][m[2]];if(!c)return "";
  const a=m[3]?+m[3]:c.o,b=m[4]?+m[4]:(m[3]?+m[3]:c.o+c.v.length-1);
  let h="";for(let v=a;v<=b;v++){const t=c.v[v-c.o];if(t)h+=`<p><sup dir="ltr">${v}</sup> ${esc(t)}</p>`;}
  return h;
}
function showV(a){
  clearTimeout(vHide);vFor=a;
  const avd=!!a.dataset.avd,code=a.dataset.avd||a.dataset.nlt,r=ref(code);
  vpop.className="vpop "+(avd?"avd":"nlt");
  vpop.innerHTML=avd
    ?`<div class="vp-h"><b>${r.label}</b><span>${U.avdHead}</span></div><div class="vp-b" dir="rtl" lang="ar">${verses(code)}</div><div class="vp-f">${U.avdFoot} <a href="${a.href}" target="_blank" rel="noopener">${U.readOn}</a></div>`
    :`<div class="vp-h"><b>${r.label}</b><span>${U.nltHead}</span></div><p class="vp-n">${U.nltBody}</p><div class="vp-f">${U.nltFoot} <a href="${a.href}" target="_blank" rel="noopener">${U.readOn}</a></div>`;
  vpop.style.display="block";vpop.scrollTop=0;
  const b=vpop.querySelector(".vp-b");if(b)b.scrollTop=0;
  const rc=a.getBoundingClientRect(),w=vpop.offsetWidth,h=vpop.offsetHeight;
  const left=Math.max(8,Math.min(rc.left+rc.width/2-w/2,innerWidth-w-8));
  let top=rc.bottom+8;if(top+h>innerHeight-8)top=Math.max(8,rc.top-h-8);
  vpop.style.left=left+"px";vpop.style.top=top+"px";
  requestAnimationFrame(()=>vpop.classList.add("in"));
}
function hideV(now){clearTimeout(vHide);vHide=setTimeout(()=>{vFor=null;vpop.classList.remove("in");vpop.style.display="none";},now?0:220);}
const isV=t=>t&&t.closest&&t.closest("[data-avd],[data-nlt]");
document.addEventListener("pointerover",e=>{if(e.pointerType==="touch")return;const a=isV(e.target);if(a&&a!==vFor)showV(a);else if(a||e.target.closest&&e.target.closest(".vpop"))clearTimeout(vHide);});
document.addEventListener("pointerout",e=>{if(e.pointerType==="touch")return;const from=isV(e.target)||(e.target.closest&&e.target.closest(".vpop"));if(!from)return;const to=e.relatedTarget;if(to&&(to===vFor||(vFor&&vFor.contains(to))||to.closest&&to.closest(".vpop")))return;hideV();});
document.addEventListener("click",e=>{
  const a=isV(e.target);
  if(a&&a!==vFor&&matchMedia("(hover: none)").matches){e.preventDefault();showV(a);return;}
  if(!a&&!(e.target.closest&&e.target.closest(".vpop"))&&vFor)hideV(true);
},true);
document.addEventListener("focusin",e=>{const a=isV(e.target);if(a)showV(a);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&vFor)hideV(true);});
addEventListener("scroll",()=>{if(vFor)hideV(true);},{passive:true});

(function init(){
  let t=null,v=null;
  try{
    t=localStorage.getItem("daniel-theme");v=localStorage.getItem("daniel-view");
    if(localStorage.getItem("daniel-layout")==="descent")layout="descent";
    if(localStorage.getItem("daniel-lang")==="ar")lang="ar";
  }catch(e){}
  if(t!=="light")t="dark";
  document.documentElement.dataset.theme=t;
  const h=location.hash.replace("#","");
  if(h==="chapters"||h==="timeline")v=h;
  view=v==="chapters"?"chapters":"timeline";
  render();
})();
window.addEventListener("resize",()=>{if(view==="timeline"&&layout==="descent")placeDots()});
window.addEventListener("hashchange",()=>{
  const h=location.hash.replace("#","");
  if((h==="chapters"||h==="timeline")&&h!==view)setView(h,false);
});
</script>
