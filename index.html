<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Life of Daniel: A Storyline Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Montserrat:wght@400;600&family=Outfit:wght@300&family=Sora:wght@600&display=swap">
<style>
:root{
  --bg:#fafafa;--ink:#0b0b0d;--muted:#6b6b74;--sub:#45454d;
  --panel:rgba(255,255,255,.75);--panel-2:rgba(10,10,11,.035);--line:rgba(10,10,11,.1);
  --accent:#0978be;--btn-bg:#0b0b0d;--btn-ink:#ffffff;--rib:.22;--bar:rgba(250,250,250,.86);
}
[data-theme="dark"]{
  --bg:#0a0a0b;--ink:#f5f5f7;--muted:#8d8d94;--sub:#b4b4bb;
  --panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);
  --accent:#7AF5E6;--btn-bg:#ffffff;--btn-ink:#0b0b0d;--rib:.32;--bar:rgba(10,10,11,.82);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.label{font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:Sora,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.ribbon{position:absolute;inset:0;opacity:var(--rib);filter:blur(3.5px);transform:translateX(-62%) scaleX(-1) scale(2.35) rotate(-6deg);transform-origin:95% 45%;pointer-events:none}
.hero .wrap{position:relative;padding-top:72px;padding-bottom:56px}
h1{font-family:Sora,sans-serif;font-weight:600;font-size:48px;line-height:1.1;margin:14px 0 14px;letter-spacing:-.01em}
.lead{font-size:18px;line-height:1.6;color:var(--sub);max-width:600px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px;min-width:150px;backdrop-filter:blur(8px)}
.fact .num{font-size:22px;line-height:1.25;display:block}
.fact span:last-child{font-family:Montserrat,sans-serif;font-size:12px;color:var(--muted)}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;padding:7px 16px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.bar .sp{flex:1}
.ghost{font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--sub)}
.ghost:hover{border-color:var(--muted)}

/* overview strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:24px 0 6px;scrollbar-width:thin}
.strip a{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:8px 12px;color:var(--ink);background:var(--panel);min-width:104px}
.strip a:hover{text-decoration:none;border-color:var(--muted)}
.strip a .num{font-size:13px;display:block}
.strip a span:last-child{font-family:Montserrat,sans-serif;font-size:11px;color:var(--muted);white-space:nowrap}
.intro{color:var(--muted);font-family:Montserrat,sans-serif;font-size:13px;line-height:1.5;margin:14px 0 0;max-width:680px}

/* groups + milestones */
.group{margin:40px 0 0}
.group h2{font-family:Sora,sans-serif;font-weight:600;font-size:28px;line-height:1.2;margin:6px 0 4px}
.group p{color:var(--muted);margin:0 0 18px;font-size:15px}
.list{position:relative;list-style:none;margin:0;padding:0;padding-inline-start:30px}
.list::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:1px;background:var(--line)}
.ms{position:relative;margin:0 0 12px}
.ms::before{content:"";position:absolute;inset-inline-start:-28px;top:25px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted)}
.ms.d::before{background:linear-gradient(180deg,#7AF5E6,#3D6CF2);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.head{display:grid;grid-template-columns:44px 1fr 20px;gap:14px;align-items:start;width:100%;text-align:start;padding:18px}
.head .n{font-size:22px;line-height:1.25;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.chip{font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--sub)}
.chip.d{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.date{font-family:Sora,sans-serif;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.head h3{font-family:Sora,sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin:0}
.head .hook{color:var(--sub);margin:6px 0 0;font-size:15px;line-height:1.5}
.chev{width:20px;height:20px;margin-top:6px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.ms.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 18px 22px;padding-inline-start:76px}
.ms.open .body{display:block}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.ref{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:4px;padding:5px 10px;font-family:Montserrat,sans-serif;font-size:12px;color:var(--sub)}
.ref b{font-weight:600;color:var(--ink)}
.ref a{font-weight:600}
.scenes{list-style:none;margin:0;padding:0;counter-reset:s}
.scenes>li{counter-increment:s;position:relative;padding:14px 0;padding-inline-start:34px;border-top:1px solid var(--line)}
.scenes>li::before{content:counter(s);position:absolute;inset-inline-start:0;top:15px;font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.scenes h4{font-family:Sora,sans-serif;font-weight:600;font-size:17px;line-height:1.35;margin:0}
.sref{font-family:Montserrat,sans-serif;font-size:12px;color:var(--muted);margin:2px 0 8px}
.sref a{font-weight:600}
.scenes ul{margin:0;padding:0;padding-inline-start:18px}
.scenes ul li{margin:4px 0;color:var(--sub)}
.scenes ul li::marker{color:var(--muted)}
.box{border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:16px;background:var(--panel-2)}
.box .label{display:block;margin-bottom:8px}
.box p{margin:0 0 8px;color:var(--sub);font-size:15px}
.box p:last-child{margin-bottom:0}
.box p b{font-family:Montserrat,sans-serif;font-weight:600;font-size:12px;color:var(--ink);display:block;margin-bottom:2px}
.thread{border-inline-start:2px solid var(--accent);padding:2px 0;padding-inline-start:14px;margin:0 0 18px;color:var(--sub);font-size:15px}
.pos{font-family:Montserrat,sans-serif;font-size:12px;color:var(--muted);margin:16px 0 0}
footer{margin:56px 0 72px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-family:Montserrat,sans-serif;font-size:12px;line-height:1.6}
footer p{margin:0 0 8px;max-width:700px}

/* ===== timeline visuals ===== */
:root{--g:linear-gradient(var(--gd,90deg),#19CFC4,#2EA8F5 50%,#3D6CF2);--gv:linear-gradient(180deg,#19CFC4,#3D6CF2);--yr-faint:rgba(10,10,11,.13);--kbar:rgba(10,10,11,.04);--kbab:rgba(79,75,188,.12);--kbab-l:rgba(79,75,188,.35);--kper:rgba(46,168,245,.14);--kper-l:rgba(46,168,245,.45);--glow:.16;--halo:rgba(46,168,245,.35)}
[data-theme="dark"]{--g:linear-gradient(var(--gd,90deg),#7AF5E6,#2EA8F5 50%,#3D6CF2);--gv:linear-gradient(180deg,#7AF5E6,#3D6CF2);--yr-faint:rgba(255,255,255,.14);--kbar:rgba(255,255,255,.07);--kbab:rgba(79,75,188,.28);--kbab-l:rgba(110,106,230,.5);--kper:rgba(46,168,245,.2);--kper-l:rgba(46,168,245,.5);--glow:.24;--halo:rgba(46,168,245,.8)}
.wide{max-width:1120px;margin:0 auto;padding:0 20px}
.viz{margin-top:40px}
.viz h2{font-family:Sora,sans-serif;font-weight:600;font-size:28px;line-height:1.2;margin:6px 0 4px}
.viz>p,.viz .wide>p{color:var(--muted);margin:0 0 18px;font-size:15px;max-width:700px}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
/* map of reigns */
.t3-scroll{overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.t3{position:relative;min-width:980px;padding:8px 0 0}
.t3-emp{position:relative;height:30px;margin-inline-start:110px}
.t3-emp div{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--line);padding-inline-start:10px;display:flex;align-items:center}
.t3-row{display:grid;grid-template-columns:110px 1fr;align-items:center;height:46px}
.t3-row>span{font-family:Montserrat,sans-serif;font-size:12px;color:var(--muted)}
.t3-lane{position:relative;height:100%}
.kbar{position:absolute;top:10px;height:26px;border-radius:4px;background:var(--kbar);border:1px solid var(--line);font-family:Montserrat,sans-serif;font-size:11px;color:var(--sub);display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.kbar.bab{background:var(--kbab);border-color:var(--kbab-l)}
.kbar.per{background:var(--kper);border-color:var(--kper-l)}
.t3-dan{height:120px}
.t3-dan .life{position:absolute;top:53px;height:14px;border-radius:999px;background:var(--g);box-shadow:0 0 26px var(--halo)}
.mk{position:absolute;width:24px;height:24px;margin-inline-start:-12px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent);color:var(--accent);font-family:Sora,sans-serif;font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center}
.mk.wd{width:auto;padding:0 8px;border-radius:999px;margin-inline-start:-22px}
.mk.up{top:16px}.mk.dn{top:80px}
.mk::after{content:"";position:absolute;left:50%;width:1px;height:13px;background:var(--accent);opacity:.5}
.mk.up::after{top:100%}.mk.dn::after{bottom:100%}
.ev{position:absolute;top:16px;width:13px;height:13px;margin-inline-start:-6.5px;border-radius:50%;border:1.5px solid var(--muted);background:var(--bg)}
.mk.on,.ev.on{background:var(--accent);border-color:var(--accent);color:var(--bg);box-shadow:0 0 18px var(--halo)}
.t3-axis{position:relative;height:34px;margin-inline-start:110px;border-top:1px solid var(--line)}
.t3-axis span{position:absolute;top:8px;transform:translateX(-50%);font-family:Sora,sans-serif;font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.t3-axis span::before{content:"";position:absolute;left:50%;top:-8px;height:6px;width:1px;background:var(--line)}
/* river */
.t1{overflow-x:auto;margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(60% 80% at 30% 50%,rgba(46,168,245,.10),transparent 70%);scrollbar-width:thin;cursor:grab;user-select:none}
.t1.drag{cursor:grabbing}
.t1-in{position:relative;height:540px}
.t1-glow{position:absolute;left:0;right:0;top:50%;height:90px;transform:translateY(-50%);background:var(--g);filter:blur(46px);opacity:var(--glow)}
.t1-line{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--g);box-shadow:0 0 14px var(--halo)}
.t1-era{position:absolute;top:18px;height:26px;border-inline-start:1px solid var(--line);padding-inline-start:12px;white-space:nowrap}
.t1-node{position:absolute;top:0;bottom:0;width:230px}
.t1-dot{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted)}
.t1-node.d .t1-dot{width:17px;height:17px;margin:-8.5px;border:0;background:var(--gv);box-shadow:0 0 0 5px rgba(46,168,245,.16),0 0 22px var(--halo)}
.t1-stem{position:absolute;left:50%;width:1px;height:44px;background:linear-gradient(var(--muted),transparent);opacity:.5}
.t1-card{position:absolute;left:14px;right:14px;width:auto;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;backdrop-filter:blur(10px);transition:border-color .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.t1-card:hover{border-color:var(--muted);transform:translateY(-2px)}
.t1-card h3{font-family:Sora,sans-serif;font-weight:600;font-size:16px;line-height:1.3;margin:8px 0 0;color:var(--ink)}
.t1-node.on .t1-card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 28px var(--halo)}
.t1-yr{position:absolute;left:0;right:0;text-align:center;font-family:Sora,sans-serif;font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--yr-faint);pointer-events:none}
.t1-node.d .t1-yr{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.t1-yr small{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:6px}
.up .t1-card{bottom:calc(50% + 52px)}.up .t1-stem{bottom:calc(50% + 8px);transform:scaleY(-1)}.up .t1-yr{top:calc(50% + 34px)}
.dn .t1-card{top:calc(50% + 52px)}.dn .t1-stem{top:calc(50% + 8px)}.dn .t1-yr{bottom:calc(50% + 34px)}
/* story panel */
.story{margin-top:28px}
.story-head{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:24px 24px 20px}
.story-yr{font-family:Sora,sans-serif;font-weight:600;font-size:48px;line-height:1.05;font-variant-numeric:tabular-nums;min-width:130px}
.story-yr small{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:6px}
.story-head h3{font-family:Sora,sans-serif;font-weight:600;font-size:28px;line-height:1.2;margin:0}
.story-head .hook{color:var(--sub);margin:6px 0 0}
.story .sbody{padding:0 24px 26px}
.story-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.story-nav .num{font-size:13px;color:var(--muted)}
.story-nav button[disabled]{opacity:.35;cursor:default}

/* layout switch */
.lay{display:flex;align-items:center;gap:12px;margin-top:26px}
/* descent */
.t2{max-width:960px;margin:0 auto;padding:8px 20px 0}
.t2-era{text-align:center;margin:56px 0 36px}
.t2-era h3{font-family:Sora,sans-serif;font-weight:600;font-size:44px;line-height:1.1;margin:8px 0 6px}
.t2-era p{color:var(--muted);margin:0;font-size:15px}
.t2-list{position:relative}
.t2-list::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gv);box-shadow:0 0 16px var(--halo)}
.t2-row{position:relative;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;padding:0 0 34px}
.t2-dot{position:absolute;left:50%;top:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted)}
.t2-row.d .t2-dot{width:19px;height:19px;margin-left:-9.5px;border:0;background:var(--gv);box-shadow:0 0 0 6px rgba(46,168,245,.16),0 0 26px var(--halo)}
.t2-card{grid-row:1;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;backdrop-filter:blur(10px);transition:border-color .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.t2-card:hover{border-color:var(--muted);transform:translateY(-2px)}
.t2-row.open .t2-card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 28px var(--halo)}
.t2-card h4{font-family:Sora,sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin:10px 0 6px;color:var(--ink)}
.t2-card p{margin:0;color:var(--sub);font-size:15px}
.t2-card .more{font-family:Montserrat,sans-serif;font-weight:600;font-size:12px;color:var(--accent);margin-top:10px;display:block}
.t2-yr{grid-row:1;font-family:Sora,sans-serif;font-weight:600;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--yr-faint)}
.t2-row.d .t2-yr{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.t2-yr small{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:8px}
.t2-row:nth-child(odd) .t2-card{grid-column:1}.t2-row:nth-child(odd) .t2-yr{grid-column:3;padding-inline-start:8px}
.t2-row:nth-child(even) .t2-card{grid-column:3}.t2-row:nth-child(even) .t2-yr{grid-column:1;text-align:end;padding-inline-end:8px}
.t2-story{grid-column:1/-1;grid-row:2;position:relative;z-index:1;margin-top:18px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.t2-story .sbody{padding:22px 24px 24px;background:var(--panel);border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .t2-row.pre{opacity:0;transform:translateY(22px)}
  .t2-row{transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
}



/* ===== map hero ===== */
.hero2{position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:44px 0 30px}
.hero2 .wide{position:relative}
.h2-top{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:end;margin-bottom:26px}
.hero2 h1{margin:10px 0 10px}
.hero2 .lead{font-size:17px;max-width:560px}
.readout{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;backdrop-filter:blur(12px);min-height:172px}
.ro-yr{font-family:Sora,sans-serif;font-weight:600;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.ro-yr small{font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.ro-k{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;min-height:20px;font-family:Montserrat,sans-serif;font-size:12px;color:var(--ink)}
.ro-k span{color:var(--muted);margin-inline-end:6px}
.ro-m{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ro-m .label{display:block;margin-bottom:6px;font-size:10px}
.ro-m b{display:block;font-family:Sora,sans-serif;font-weight:600;font-size:15px;line-height:1.3;margin-top:6px}
.brand{font-family:Sora,sans-serif;font-weight:600;font-size:15px;margin-inline-end:8px}
.play{font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;padding:10px 20px;border-radius:999px;background:var(--btn-bg);color:var(--btn-ink);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.play:hover{box-shadow:0 0 22px var(--halo)}
.hint{margin:0;color:var(--muted);font-size:14px;max-width:640px}
.hero2 .ribbon{opacity:calc(var(--rib)*.7)}
.lay2{margin-top:18px}
.t3-lanes{position:absolute;top:38px;bottom:34px;inset-inline-start:110px;inset-inline-end:0;pointer-events:none}

<script>const BOOKS={"2KI":"2 Kings","2CH":"2 Chronicles","ISA":"Isaiah","JER":"Jeremiah","EZK":"Ezekiel","DAN":"Daniel","EZR":"Ezra"};
const GROUPS=[{"id":"g1","label":"Part 1","title":"The road to exile","hl":"exile","sub":"About a hundred years of warnings, from Hezekiah to Jehoiakim."},{"id":"g2","label":"Part 2","title":"Babylon under Nebuchadnezzar","hl":"Babylon","sub":"Daniel arrives as a captive youth and rises in the court."},{"id":"g3","label":"Part 3","title":"Babylon’s last years","hl":"last years","sub":"New kings, Daniel’s own visions, and the night the empire falls."},{"id":"g4","label":"Part 4","title":"Under the Medes and Persians","hl":"Medes and Persians","sub":"An old man still praying, still serving, still receiving revelation."}];
const M=[{"id":"hezekiah","g":"g1","date":"c. 701 BC","yr":"701","tag":"Backstory","title":"Hezekiah opens his treasuries to Babylon","hook":"A proud moment in Jerusalem, and the first prophecy that points to Daniel.","refs":["2KI 20:12-19","ISA 39:1-8","2CH 32:25-31"],"thread":"Daniel 1:2–3 is this prophecy coming true: the temple treasures go to Babylon, and young men of the royal family serve in the king’s palace.","scenes":[{"t":"Envoys arrive from Babylon","r":"2KI 20:12","b":["Merodach-baladan, king of Babylon, sends letters and a gift to Hezekiah because he has heard that Hezekiah was sick.","Chronicles adds that the envoys also came to ask about the miraculous sign that had happened in the land."]},{"t":"Hezekiah shows them everything","r":"2KI 20:13","b":["Hezekiah welcomes them and shows them his silver, gold, spices, fine oil, his armoury, and everything in his treasuries.","There is nothing in his palace or in all his kingdom that he does not show them."]},{"t":"God was testing his heart","r":"2CH 32:25-31","b":["After his healing, Hezekiah’s heart had become proud, and he did not respond to the kindness shown to him.","In the matter of the envoys, God leaves him to himself, to test him and to know everything that is in his heart."]},{"t":"Isaiah questions the king","r":"2KI 20:14-15","b":["Isaiah asks, “What did those men say, and where did they come from?” Hezekiah answers, “From a distant land, from Babylon.”","Isaiah asks what they saw in the palace. Hezekiah says, “They saw everything. There is nothing among my treasures that I did not show them.”"]},{"t":"The prophecy that reaches Daniel","r":"2KI 20:16-18","b":["Isaiah gives the word of the Lord: the time is coming when everything in the palace, all that the kings before him stored up, will be carried off to Babylon. Nothing will be left.","Some of Hezekiah’s own descendants will be taken away, and they will become eunuchs in the palace of the king of Babylon."]},{"t":"“At least in my lifetime”","r":"2KI 20:19","b":["Hezekiah replies that the word of the Lord is good.","His thought is that there will be peace and security during his own lifetime."]}],"y":701},{"id":"manasseh","g":"g1","date":"c. 697 – 642 BC","yr":"697","tag":"Backstory","title":"Manasseh fills Jerusalem with evil","hook":"Hezekiah’s son undoes everything, and the sentence on Judah is spoken.","refs":["2KI 21:1-18","2CH 33:10-13","2KI 24:3-4"],"thread":"When Babylon’s raiders finally come in Jehoiakim’s day, 2 Kings 24:3–4 says it happened because of the sins of Manasseh.","scenes":[{"t":"A son who reverses his father","r":"2KI 21:1-6","b":["Manasseh becomes king at twelve and reigns fifty-five years in Jerusalem.","He rebuilds the high places his father Hezekiah had destroyed, sets up altars for Baal, makes an Asherah pole, and worships the stars.","He builds pagan altars inside the Lord’s temple, sacrifices his own son in the fire, and practises sorcery, divination, and consulting mediums."]},{"t":"An idol in the house of God","r":"2KI 21:7-9","b":["He places a carved Asherah pole in the temple, the place where the Lord had said his name would be for ever.","The people do not listen. Manasseh leads them to do more evil than the nations the Lord had destroyed before Israel."]},{"t":"The verdict is spoken","r":"2KI 21:10-15","b":["Through his prophets the Lord announces a disaster on Jerusalem and Judah so great that the ears of everyone who hears of it will tingle.","He will wipe Jerusalem as a person wipes a dish, wiping it and turning it upside down.","He will abandon the remnant of his people and hand them over to their enemies."]},{"t":"Innocent blood","r":"2KI 21:16","b":["Manasseh also sheds so much innocent blood that he fills Jerusalem with it from one end to the other."]},{"t":"A prisoner who prays","r":"2CH 33:10-13","b":["The Lord speaks to Manasseh and his people, but they pay no attention.","The commanders of the king of Assyria take him prisoner, put a hook in his nose, bind him with bronze chains, and take him to Babylon.","In his distress he humbles himself deeply and prays. God hears him and brings him back to Jerusalem, and Manasseh knows that the Lord is God."]},{"t":"A sentence that still stands","r":"2KI 24:3-4","b":["Years later, when disaster reaches Judah, Kings says it came at the Lord’s command, to remove them from his presence because of the sins of Manasseh.","It names the innocent blood he shed in Jerusalem, which the Lord was not willing to forgive."]}],"y":697},{"id":"josiah","g":"g1","date":"640 – 609 BC","yr":"640","tag":"Backstory","title":"Josiah, the last reform","hook":"A tender-hearted king turns the nation back, but the disaster is only delayed.","refs":["2KI 22:1-20","2KI 23:1-30","2CH 35:20-25"],"note":"Daniel’s birth is not recorded. Since he is taken to Babylon as a youth in about 605 BC, he was most likely born during Josiah’s reign.","scenes":[{"t":"A boy king who seeks God","r":"2KI 22:1-2","b":["Josiah becomes king at eight years old and reigns thirty-one years.","He does what is right in the Lord’s sight, not turning aside to the right or to the left."]},{"t":"The Book of the Law is found","r":"2KI 22:3-10","b":["In his eighteenth year, while the temple is being repaired, Hilkiah the high priest finds the Book of the Law in the Lord’s house.","Shaphan the secretary brings it to the king and reads it aloud to him."]},{"t":"The king tears his robes","r":"2KI 22:11-13","b":["When Josiah hears the words of the Law, he tears his clothes.","He sends men to inquire of the Lord, because the Lord’s anger burns against them: their ancestors have not obeyed the words of this book."]},{"t":"Huldah’s answer","r":"2KI 22:14-20","b":["The prophetess Huldah confirms it: the Lord will bring disaster on this place and its people, everything written in the book.","Because Josiah’s heart was tender and he humbled himself and wept, he will be buried in peace. His eyes will not see the disaster."]},{"t":"Covenant and cleansing","r":"2KI 23:1-25","b":["Josiah reads the book to all the people and renews the covenant before the Lord.","He removes the idols, the high places, the mediums and the household gods from Judah and Jerusalem.","He holds a Passover such as had not been kept since the days of the judges. No king before or after him turned to the Lord as he did, with all his heart."]},{"t":"Yet the anger remains","r":"2KI 23:26-27","b":["Even so, the Lord does not turn from his fierce anger against Judah, because of all that Manasseh had done.","The Lord says he will remove Judah from his presence as he removed Israel, and reject Jerusalem, the city he chose."]},{"t":"Death at Megiddo","r":"2KI 23:29-30","b":["Pharaoh Neco of Egypt marches north toward the Euphrates. Josiah goes out to meet him in battle and is killed at Megiddo.","His servants bring his body to Jerusalem in a chariot. Chronicles records that Jeremiah composed laments for him.","The people of the land anoint his son Jehoahaz as king."]}],"y":640},{"id":"jehoiakim","g":"g1","date":"609 BC","yr":"609","tag":"Backstory","title":"Egypt puts Jehoiakim on the throne","hook":"Judah loses its independence, and the king of Daniel 1:1 takes his seat.","refs":["2KI 23:31-37","2CH 36:1-5","JER 22:13-19"],"thread":"This is the Jehoiakim named in the first verse of Daniel.","scenes":[{"t":"Three months on the throne","r":"2KI 23:31-33","b":["Jehoahaz is twenty-three when he becomes king. He reigns three months and does evil in the Lord’s sight.","Pharaoh Neco puts him in chains at Riblah and imposes on Judah a tribute of a hundred talents of silver and a talent of gold."]},{"t":"Egypt chooses the king","r":"2KI 23:34","b":["Neco makes Eliakim, another son of Josiah, king in his father’s place and changes his name to Jehoiakim.","Jehoahaz is taken to Egypt, and he dies there."]},{"t":"A taxed land","r":"2KI 23:35","b":["Jehoiakim pays Pharaoh the silver and gold he demands.","To do it, he taxes the land and collects from the people, each according to his assessment."]},{"t":"Eleven years of evil","r":"2KI 23:36-37","b":["Jehoiakim is twenty-five when he becomes king, and he reigns eleven years in Jerusalem.","He does evil in the Lord’s sight, just as his ancestors had done."]},{"t":"Jeremiah’s verdict on the king","r":"JER 22:13-19","b":["Jeremiah condemns him for building his palace by injustice, making his neighbours work for nothing.","His father Josiah did what was just and right and defended the poor, and it went well with him. “Is that not what it means to know me?” says the Lord.","Jehoiakim’s eyes are set only on dishonest gain, on shedding innocent blood, and on oppression.","No one will mourn for him. He will have the burial of a donkey, dragged away and thrown outside the gates of Jerusalem."]}],"y":609},{"id":"year605","g":"g1","date":"605 – 604 BC","yr":"605","tag":"Backstory","title":"Carchemish, seventy years, and a burned scroll","hook":"Babylon becomes the world power, and Jeremiah puts a number on the exile.","refs":["JER 46:2","JER 25:1-14","JER 36:1-32","2KI 24:1"],"thread":"Decades later, Daniel reads this very prophecy of seventy years and turns it into prayer (Daniel 9:2).","scenes":[{"t":"Babylon defeats Egypt","r":"JER 46:2","b":["In the fourth year of Jehoiakim, Nebuchadnezzar king of Babylon defeats the army of Pharaoh Neco at Carchemish on the Euphrates."]},{"t":"Twenty-three years of warnings","r":"JER 25:1-7","b":["In that same year, the first year of Nebuchadnezzar, Jeremiah speaks to all the people of Judah.","For twenty-three years, since the thirteenth year of Josiah, the word of the Lord has come to him and he has spoken it again and again, but they have not listened.","The Lord sent all his servants the prophets with the same call: turn from your evil ways and stay in the land."]},{"t":"“My servant Nebuchadnezzar”","r":"JER 25:8-11","b":["Because they have not listened, the Lord will send for Nebuchadnezzar, whom he calls “my servant,” and bring him against this land.","The sounds of joy and gladness, the voices of bride and bridegroom, the sound of millstones and the light of the lamp will be taken away.","The whole land will become a desolate wasteland, and these nations will serve the king of Babylon seventy years."]},{"t":"Babylon’s own deadline","r":"JER 25:12-14","b":["When the seventy years are fulfilled, the Lord will punish the king of Babylon and his nation for their guilt.","Everything written in this book against that land will come upon it."]},{"t":"The scroll is written","r":"JER 36:1-8","b":["In the fourth year of Jehoiakim, the Lord tells Jeremiah to write on a scroll every word he has spoken since the days of Josiah.","Perhaps, when Judah hears of the disaster, each person will turn from his evil way, and the Lord will forgive.","Baruch writes the words at Jeremiah’s dictation. Jeremiah is barred from the temple, so Baruch is sent to read the scroll there."]},{"t":"The king burns it","r":"JER 36:9-26","b":["In the fifth year, on a day of fasting, Baruch reads the scroll in the temple. The officials hear it, are afraid, and take it to the king.","Jehoiakim sits in his winter house with a fire burning in the firepot. Each time three or four columns are read, he cuts them off with a knife and throws them into the fire, until the whole scroll is burned.","Neither the king nor his attendants are afraid, and they do not tear their clothes. He orders the arrest of Baruch and Jeremiah, but the Lord hides them."]},{"t":"The word is written again","r":"JER 36:27-32","b":["The Lord tells Jeremiah to take another scroll and write all the words that were on the first.","Baruch writes them again, and many similar words are added.","Jehoiakim will have no one to sit on the throne of David."]},{"t":"Jehoiakim becomes Babylon’s servant","r":"2KI 24:1","b":["In his days Nebuchadnezzar king of Babylon comes up, and Jehoiakim becomes his servant for three years."]}],"y":606},{"id":"dan1a","g":"g2","date":"c. 605 – 602 BC","yr":"605","tag":"Daniel 1","ch":1,"sub":0,"subs":5,"title":"Jerusalem besieged, the temple vessels taken","hook":"The Lord gives Jehoiakim into Nebuchadnezzar’s hand, and vessels from God’s house go to the house of Babylon’s god.","refs":["DAN 1:1-2","2KI 24:1","2CH 36:5-7"],"scenes":[{"t":"Jerusalem is besieged","r":"DAN 1:1-2","b":["In the third year of Jehoiakim king of Judah, Nebuchadnezzar king of Babylon comes to Jerusalem and besieges it.","The Lord gives Jehoiakim into his hand, along with some of the articles from the temple of God.","Nebuchadnezzar carries them to the land of Shinar and puts them in the treasure house of his god."]}],"y":605,"note":"Daniel 1:1 says the third year of Jehoiakim, while Jeremiah 25:1 calls the same period the fourth year. The usual explanation is that Babylon and Judah counted the first year of a reign differently."},{"id":"dan1b","g":"g2","date":"c. 605 – 602 BC","yr":"605","tag":"Daniel 1","ch":1,"sub":1,"subs":5,"title":"Babylon chooses the best of Judah","hook":"Young men of royal and noble blood, chosen for wisdom and looks, trained three years for the king’s palace.","refs":["DAN 1:3-5"],"scenes":[{"t":"The best of Judah’s youth are chosen","r":"DAN 1:3-5","b":["The king orders Ashpenaz, his chief official, to bring in some of the Israelites from the royal family and the nobility.","They are to be young men without physical defect, handsome, gifted in every kind of wisdom, well informed, quick to understand, and fit to serve in the king’s palace.","He is to teach them the language and literature of the Chaldeans. The king assigns them a daily portion of his own food and wine, with three years of training before they enter his service."]}],"y":605},{"id":"dan1c","g":"g2","date":"c. 605 – 602 BC","yr":"605","tag":"Daniel 1","ch":1,"sub":2,"subs":5,"title":"Four new names","hook":"Daniel, Hananiah, Mishael and Azariah are renamed Belteshazzar, Shadrach, Meshach and Abednego.","refs":["DAN 1:6-7"],"scenes":[{"t":"Four names are replaced","r":"DAN 1:6-7","b":["Among them are four from Judah: Daniel, Hananiah, Mishael and Azariah.","The chief official gives them new names: Belteshazzar, Shadrach, Meshach and Abednego."]}],"y":605,"note":"The Hebrew names honour Israel’s God: Daniel means “God is my judge”, Hananiah “the LORD is gracious”, Mishael “who is like God?” and Azariah “the LORD helps”. Daniel 4:8 says Belteshazzar was named after Nebuchadnezzar’s god, and Abednego is usually read as “servant of Nebo”. Many teachers see the renaming as an attempt to reshape their identity; the text itself does not give the king’s reason."},{"id":"dan1d","g":"g2","date":"c. 605 – 602 BC","yr":"605","tag":"Daniel 1","ch":1,"sub":3,"subs":5,"title":"Daniel resolves in his heart: the king’s food and the ten-day test","hook":"Daniel refuses the king’s food and wine, and asks for ten days of vegetables and water.","refs":["DAN 1:8-16"],"scenes":[{"t":"Daniel resolves in his heart","r":"DAN 1:8-10","b":["Daniel resolves not to defile himself with the king’s food or with the wine he drinks, and he asks the chief official for permission.","God has given Daniel favour and compassion in the eyes of the official.","But the official is afraid: “If the king sees you looking worse than the other young men your age, you will put my head in danger.”"]},{"t":"The ten-day test","r":"DAN 1:11-16","b":["Daniel speaks to the guard appointed over the four of them: “Please test your servants for ten days. Give us only vegetables to eat and water to drink.”","“Then compare our appearance with the young men who eat the king’s food, and deal with us according to what you see.”","After ten days they look healthier and better nourished than all the others. So the guard takes away their rich food and wine and gives them vegetables."]}],"y":604.6},{"id":"dan1e","g":"g2","date":"c. 605 – 602 BC","yr":"605","tag":"Daniel 1","ch":1,"sub":4,"subs":5,"title":"God gives wisdom: ten times better","hook":"God gives the four knowledge and understanding, and the king finds them ten times better than all his wise men.","refs":["DAN 1:17-21"],"scenes":[{"t":"God gives the learning","r":"DAN 1:17","b":["To these four young men God gives knowledge and skill in every kind of literature and wisdom.","Daniel also has understanding of visions and dreams of every kind."]},{"t":"Examined by the king","r":"DAN 1:18-20","b":["At the end of the set time the chief official presents them all to Nebuchadnezzar.","The king talks with them and finds none equal to Daniel, Hananiah, Mishael and Azariah, so they enter the king’s service.","In every matter of wisdom and understanding he finds them ten times better than all the magicians and enchanters in his whole kingdom."]},{"t":"A service that outlasts the empire","r":"DAN 1:21","b":["Daniel remains there until the first year of King Cyrus."]}],"y":604.2},{"id":"dan2a","g":"g2","date":"c. 603 BC","yr":"603","tag":"Daniel 2","ch":2,"sub":0,"subs":5,"title":"A dream and a death sentence","hook":"The king demands both his dream and its meaning, and orders all the wise men of Babylon killed.","refs":["DAN 2:1-13"],"scenes":[{"t":"A dream that steals the king’s sleep","r":"DAN 2:1-3","b":["In the second year of his reign Nebuchadnezzar has dreams. His spirit is troubled and he cannot sleep.","He summons the magicians, enchanters, sorcerers and Chaldeans and says, “I have had a dream, and my spirit is anxious to understand it.”"]},{"t":"An impossible demand","r":"DAN 2:4-9","b":["The wise men answer, “Tell your servants the dream, and we will give the interpretation.”","The king refuses. They must tell him both the dream and its meaning. If they fail, they will be torn limb from limb and their houses made rubble. If they succeed, they will receive gifts and great honour.","When they ask again, he accuses them of stalling for time and agreeing to tell him lies until the situation changes."]},{"t":"“No one on earth can do this”","r":"DAN 2:10-13","b":["The Chaldeans reply that no king, however great, has ever asked such a thing of any magician.","Only the gods could reveal it, and they do not live among mortals.","The king is furious and orders the execution of all the wise men of Babylon. Men are sent to look for Daniel and his friends to kill them."]}],"y":603},{"id":"dan2b","g":"g2","date":"c. 603 BC","yr":"603","tag":"Daniel 2","ch":2,"sub":1,"subs":5,"title":"Wisdom, tact and a prayer meeting","hook":"Daniel asks the king for time and asks his three friends to pray. The mystery is revealed at night.","refs":["DAN 2:14-19"],"scenes":[{"t":"Daniel answers with wisdom","r":"DAN 2:14-16","b":["Daniel speaks with wisdom and tact to Arioch, the commander of the king’s guard: “Why is the king’s decree so harsh?”","Arioch explains, and Daniel goes in and asks the king for time, so that he may give him the interpretation."]},{"t":"Four friends pray","r":"DAN 2:17-19","b":["Daniel goes home and tells Hananiah, Mishael and Azariah.","He urges them to ask the God of heaven for mercy concerning this mystery, so that they will not be killed with the rest of the wise men.","During the night the mystery is revealed to Daniel in a vision."]}],"y":603},{"id":"dan2c","g":"g2","date":"c. 603 BC","yr":"603","tag":"Daniel 2","ch":2,"sub":2,"subs":5,"title":"Daniel blesses the God of heaven","hook":"Before he goes to the king, Daniel praises the God who removes kings and sets up kings.","refs":["DAN 2:20-23"],"scenes":[{"t":"Daniel blesses the God of heaven","r":"DAN 2:20-23","b":["“Praise the name of God for ever and ever, for wisdom and power are his.”","He changes times and seasons, removes kings and sets up kings, and reveals deep and hidden things.","Daniel thanks the God of his ancestors for giving him wisdom and for making known what they asked."]}],"y":602.9},{"id":"dan2d","g":"g2","date":"c. 603 BC","yr":"603","tag":"Daniel 2","ch":2,"sub":3,"subs":5,"title":"The statue and the stone","hook":"Gold, silver, bronze, iron and clay, struck by a stone cut out without hands.","refs":["DAN 2:24-45"],"scenes":[{"t":"“There is a God in heaven”","r":"DAN 2:24-30","b":["Daniel asks Arioch not to destroy the wise men, and Arioch hurries him to the king.","The king asks, “Are you able to tell me the dream and its meaning?”","Daniel answers that no wise man can explain the mystery, “but there is a God in heaven who reveals mysteries.”","He adds that it was revealed to him not because he has more wisdom than anyone else."]},{"t":"The statue","r":"DAN 2:31-35","b":["The king saw an enormous, dazzling statue: a head of fine gold, chest and arms of silver, belly and thighs of bronze, legs of iron, and feet partly iron and partly baked clay.","A rock is cut out, not by human hands. It strikes the statue on its feet and smashes them.","The whole statue is broken to pieces and becomes like chaff on a summer threshing floor, carried off by the wind.","The rock becomes a great mountain and fills the whole earth."]},{"t":"The meaning","r":"DAN 2:36-45","b":["“You, O king, are that head of gold.” The God of heaven has given him kingdom, power, strength and glory.","After him another kingdom will rise, inferior to his. Then a third, of bronze, will rule the whole earth. A fourth will be strong as iron, breaking and crushing all the others.","The feet of iron and clay are a divided kingdom, partly strong and partly brittle, whose people will not hold together.","In the time of those kings, the God of heaven will set up a kingdom that will never be destroyed or left to another people. It will crush all these kingdoms and stand for ever."]}],"y":602.8,"vision":{"text":"Daniel tells the king plainly, “You are the head of gold” (2:38). The rock is a kingdom that the God of heaven sets up, which is never destroyed (2:44).","hist":"The other three kingdoms are not named in this chapter. The view held by most conservative teachers is Medo-Persia (silver), Greece (bronze) and Rome (iron). Daniel itself supports the first two steps: 5:28 gives Babylon to the Medes and Persians, and 8:20–21 names Media-Persia followed by Greece. Christians understand the rock as the kingdom of Christ."}},{"id":"dan2e","g":"g2","date":"c. 603 BC","yr":"603","tag":"Daniel 2","ch":2,"sub":4,"subs":5,"title":"The king bows, and Daniel is promoted","hook":"Nebuchadnezzar calls Daniel’s God the God of gods, and makes Daniel ruler of the province of Babylon.","refs":["DAN 2:46-49"],"scenes":[{"t":"The king bows","r":"DAN 2:46-49","b":["Nebuchadnezzar falls face down before Daniel and says, “Truly your God is the God of gods and the Lord of kings, a revealer of mysteries.”","He makes Daniel ruler over the whole province of Babylon and chief over all its wise men.","At Daniel’s request, Shadrach, Meshach and Abednego are appointed over the affairs of the province, while Daniel remains at the king’s court."]}],"y":602.6},{"id":"exile597","g":"g2","date":"597 – 591 BC","yr":"597","tag":"Meanwhile","title":"The second deportation","hook":"While Daniel serves at court, ten thousand more arrive from Jerusalem, Ezekiel among them.","refs":["2KI 24:1-17","2CH 36:5-10","JER 29:1-14","EZK 1:1-3","EZK 14:12-20"],"note":"Most conservative interpreters understand the Daniel named by Ezekiel to be Daniel of Babylon, already known among the exiles for his righteousness and wisdom.","scenes":[{"t":"Jehoiakim rebels","r":"2KI 24:1-4","b":["After three years as Nebuchadnezzar’s servant, Jehoiakim turns and rebels against him.","The Lord sends raiding bands of Chaldeans, Arameans, Moabites and Ammonites against Judah to destroy it, as he had spoken through his servants the prophets."]},{"t":"The end of Jehoiakim","r":"2CH 36:5-8","b":["Nebuchadnezzar comes up against him and binds him with bronze chains to take him to Babylon.","He also carries some of the articles of the Lord’s temple to Babylon and puts them in his palace there.","Jehoiachin his son becomes king in his place."]},{"t":"Three months, then surrender","r":"2KI 24:8-12","b":["Jehoiachin is eighteen when he becomes king. He reigns three months and does evil in the Lord’s sight.","Nebuchadnezzar’s army besieges Jerusalem, and the king of Babylon himself arrives while the siege is on.","Jehoiachin goes out and surrenders with his mother, his servants, his commanders and his officials. It is the eighth year of Nebuchadnezzar’s reign."]},{"t":"Jerusalem is emptied of its strength","r":"2KI 24:13-16","b":["Nebuchadnezzar carries off the treasures of the temple and the palace and cuts up the gold articles Solomon had made, as the Lord had said.","He takes ten thousand captives: the officers, the fighting men, the craftsmen and the smiths.","Only the poorest people of the land are left."]},{"t":"A new king, a new name","r":"2KI 24:17","b":["The king of Babylon makes Mattaniah, Jehoiachin’s uncle, king in his place.","He changes his name to Zedekiah."]},{"t":"Jeremiah’s letter to the exiles","r":"JER 29:1-14","b":["Jeremiah sends a letter from Jerusalem to the elders, priests, prophets and all the people carried to Babylon.","Build houses and live in them. Plant gardens. Marry and have sons and daughters. Increase there, and do not decrease.","Seek the peace of the city where the Lord has sent them and pray for it, because in its peace they will have peace.","When seventy years are completed for Babylon, the Lord will bring them back. His plans for them are for good and not for disaster, to give them a future and a hope.","“You will seek me and find me when you seek me with all your heart.”"]},{"t":"Ezekiel sees visions among the exiles","r":"EZK 1:1-3","b":["Ezekiel the priest is among the exiles by the Kebar River in the land of the Chaldeans.","In the fifth year of King Jehoiachin’s exile, the heavens are opened and he sees visions of God."]},{"t":"Daniel’s name beside Noah and Job","r":"EZK 14:12-20","b":["The Lord tells Ezekiel that if a land sins against him and he sends judgment on it, even Noah, Daniel and Job could not rescue it.","If these three men were in it, they would save only themselves by their righteousness."]}],"y":597},{"id":"dan3a","g":"g2","date":"Year not given","yr":"c. 590s","tag":"Daniel 3","ch":3,"sub":0,"subs":4,"title":"Bow or burn","hook":"A golden image on the plain of Dura, a royal command, and three Jews accused.","refs":["DAN 3:1-12"],"scenes":[{"t":"A golden image on the plain of Dura","r":"DAN 3:1-3","b":["Nebuchadnezzar makes an image of gold, sixty cubits high and six cubits wide, and sets it up on the plain of Dura.","He summons the satraps, prefects, governors, advisers, treasurers, judges and all the provincial officials to its dedication."]},{"t":"Bow or burn","r":"DAN 3:4-7","b":["A herald proclaims: when people of every nation and language hear the horn, flute, zither, lyre, harp, pipe and all kinds of music, they must fall down and worship the image.","Whoever does not fall down and worship will immediately be thrown into a blazing furnace.","As soon as the music sounds, all the peoples fall down and worship."]},{"t":"Three Jews are accused","r":"DAN 3:8-12","b":["Some Chaldeans come forward and denounce the Jews.","“There are some Jews whom you have set over the affairs of the province of Babylon: Shadrach, Meshach and Abednego. They pay no attention to you, O king. They do not serve your gods or worship the image of gold.”"]}],"y":592,"note":"The chapter does not give a year, and Daniel himself is not mentioned in it. The text does not say where he was. It is placed here because it follows chapter 2 in Nebuchadnezzar’s reign."},{"id":"dan3b","g":"g2","date":"Year not given","yr":"c. 590s","tag":"Daniel 3","ch":3,"sub":1,"subs":4,"title":"“But even if he does not”","hook":"Given a second chance, the three refuse to bow, whatever God chooses to do.","refs":["DAN 3:13-18"],"scenes":[{"t":"One more chance","r":"DAN 3:13-15","b":["In a furious rage Nebuchadnezzar has the three men brought before him and asks, “Is it true?”","He offers them another chance to bow when the music plays.","If they refuse, they will be thrown into the furnace at once. “Then what god will be able to rescue you from my hand?”"]},{"t":"“But even if he does not”","r":"DAN 3:16-18","b":["They reply that they do not need to defend themselves before him in this matter.","“The God we serve is able to deliver us from the blazing furnace, and he will deliver us from your hand, O king.”","“But even if he does not, we want you to know that we will not serve your gods or worship the image of gold you have set up.”"]}],"y":591.6},{"id":"dan3c","g":"g2","date":"Year not given","yr":"c. 590s","tag":"Daniel 3","ch":3,"sub":2,"subs":4,"title":"Four men in the fire","hook":"Thrown into a furnace seven times hotter, they walk free with a fourth who looks like a son of the gods.","refs":["DAN 3:19-27"],"scenes":[{"t":"Seven times hotter","r":"DAN 3:19-23","b":["Nebuchadnezzar is filled with fury, and his face changes toward them. He orders the furnace heated seven times hotter than usual.","The strongest soldiers in his army tie them up, and they are thrown in wearing their robes, trousers, turbans and other clothes.","The furnace is so hot that the flames kill the soldiers who carry them. The three men fall, bound, into the fire."]},{"t":"Four men walking in the fire","r":"DAN 3:24-25","b":["The king leaps to his feet in amazement and asks his advisers, “Did we not throw three men, bound, into the fire?”","“Look! I see four men walking around in the fire, unbound and unharmed, and the fourth looks like a son of the gods.”"]},{"t":"“Come out!”","r":"DAN 3:26-27","b":["Nebuchadnezzar goes to the opening of the furnace and shouts, “Servants of the Most High God, come out!”","The officials crowd around them and see that the fire had no power over their bodies.","Not a hair of their heads is singed, their robes are not scorched, and there is no smell of fire on them."]}],"y":591.3},{"id":"dan3d","g":"g2","date":"Year not given","yr":"c. 590s","tag":"Daniel 3","ch":3,"sub":3,"subs":4,"title":"A king’s decree for the God of Israel","hook":"Nebuchadnezzar praises their God, protects his name by law, and promotes the three.","refs":["DAN 3:28-30"],"scenes":[{"t":"The king’s decree","r":"DAN 3:28-30","b":["“Praise be to the God of Shadrach, Meshach and Abednego, who has sent his angel and rescued his servants.”","They trusted in him, defied the king’s command, and were willing to give up their lives rather than serve or worship any god except their own.","He decrees that anyone who speaks against their God will be cut to pieces, “for no other god can rescue in this way.” Then he promotes the three men in the province of Babylon."]}],"y":591},{"id":"fall586","g":"g2","date":"588 – 586 BC","yr":"586","tag":"Meanwhile","title":"Jerusalem falls and the temple burns","hook":"The city Daniel prays toward is destroyed, and the seventy years of rest for the land begin.","refs":["2KI 25:1-21","2CH 36:11-21","JER 39:1-10"],"thread":"These are the ruins Daniel confesses and pleads over in Daniel 9.","scenes":[{"t":"Zedekiah will not humble himself","r":"2CH 36:11-16","b":["Zedekiah is twenty-one when he becomes king, and he reigns eleven years.","He does not humble himself before Jeremiah the prophet, and he rebels against Nebuchadnezzar, who had made him swear an oath by God.","The leaders, the priests and the people become more and more unfaithful and defile the temple.","The Lord sends his messengers again and again because he has compassion on his people. They mock them and despise his words, until there is no remedy."]},{"t":"The siege","r":"2KI 25:1-3","b":["In the ninth year of Zedekiah, on the tenth day of the tenth month, Nebuchadnezzar comes with his whole army and builds siege works all around Jerusalem.","The city is under siege until Zedekiah’s eleventh year.","By the ninth day of the fourth month the famine is so severe that there is no food for the people."]},{"t":"The wall is broken through","r":"2KI 25:4-7","b":["The city wall is breached, and the whole army flees at night.","The Chaldeans pursue the king and overtake him in the plains of Jericho. He is taken to the king of Babylon at Riblah.","They kill Zedekiah’s sons before his eyes. Then they put out his eyes, bind him with bronze chains, and take him to Babylon."]},{"t":"The temple burns","r":"2KI 25:8-10","b":["In the fifth month, in the nineteenth year of Nebuchadnezzar, Nebuzaradan the commander of the guard comes to Jerusalem.","He burns the house of the Lord, the king’s palace and all the houses of Jerusalem.","The army breaks down the walls around the city."]},{"t":"The people are carried away","r":"2KI 25:11-12","b":["Nebuzaradan takes into exile the people who remained in the city, along with those who had deserted to the king of Babylon.","He leaves some of the poorest of the land to work the vineyards and fields."]},{"t":"The temple is stripped","r":"2KI 25:13-17","b":["The Chaldeans break up the bronze pillars, the stands and the bronze Sea and carry the bronze to Babylon.","They take the pots, shovels, dishes and everything of gold and silver."]},{"t":"The land keeps its sabbaths","r":"2CH 36:20-21","b":["Those who escape the sword are carried to Babylon and become servants to the king and his sons until the kingdom of Persia comes to power.","The land enjoys its sabbath rests. All the days of its desolation it rests, until seventy years are complete, fulfilling the word of the Lord spoken by Jeremiah."]}],"y":586},{"id":"dan4a","g":"g2","date":"Year not given, late in the reign","yr":"c. 570s","tag":"Daniel 4","ch":4,"sub":0,"subs":4,"title":"The dream of the great tree","hook":"In an open letter, the king tells of a tree that reached the sky and a watcher who ordered it cut down.","refs":["DAN 4:1-17"],"scenes":[{"t":"A king’s open letter","r":"DAN 4:1-3","b":["Nebuchadnezzar writes to the peoples, nations and languages of the whole earth.","He wants to tell them about the signs and wonders the Most High God has done for him.","“His kingdom is an eternal kingdom; his dominion endures from generation to generation.”"]},{"t":"Fear in the palace","r":"DAN 4:4-9","b":["He is at home in his palace, contented and prosperous, when a dream terrifies him.","The magicians, enchanters, Chaldeans and diviners come, but they cannot interpret it.","Finally Daniel comes in, the one called Belteshazzar. The king says that the spirit of the holy gods is in him and that no mystery is too hard for him."]},{"t":"The great tree","r":"DAN 4:10-12","b":["He saw a tree in the middle of the earth, enormous and strong, its top touching the sky and visible to the ends of the earth.","Its leaves were beautiful and its fruit abundant, with food for all.","Wild animals found shade under it, and birds lived in its branches."]},{"t":"The watcher’s decree","r":"DAN 4:13-17","b":["A holy one, a watcher, comes down from heaven and calls out: “Cut down the tree and trim off its branches. Strip its leaves and scatter its fruit.”","The stump and its roots are to stay in the ground, bound with iron and bronze, in the grass of the field.","He is to be drenched with the dew of heaven and live with the animals. His mind is to be changed from a man’s to an animal’s until seven times pass over him.","The purpose is stated: that the living may know that the Most High rules the kingdoms of men and gives them to anyone he wishes."]}],"y":570},{"id":"dan4b","g":"g2","date":"Year not given, late in the reign","yr":"c. 570s","tag":"Daniel 4","ch":4,"sub":1,"subs":4,"title":"Daniel’s hard word and his counsel","hook":"Daniel tells the king he is the tree, and urges him to break off his sins by doing right.","refs":["DAN 4:19-27"],"scenes":[{"t":"Daniel is shaken","r":"DAN 4:19","b":["Daniel is greatly perplexed for a time, and his thoughts alarm him.","The king tells him not to let the dream or its meaning alarm him.","Daniel answers, “My lord, if only the dream applied to your enemies and its meaning to your adversaries!”"]},{"t":"“You, O king, are that tree”","r":"DAN 4:20-26","b":["The tree is the king: he has become great and strong, and his dominion reaches the ends of the earth.","He will be driven away from people and live with the wild animals. He will eat grass like an ox and be drenched with dew.","Seven times will pass over him until he acknowledges that the Most High rules the kingdoms of men.","The stump was left: his kingdom will be restored to him when he acknowledges that Heaven rules."]},{"t":"Daniel’s counsel","r":"DAN 4:27","b":["“Therefore, O king, be pleased to accept my advice.”","He is to break off his sins by doing what is right, and his wickedness by being kind to the oppressed.","Perhaps then his prosperity will continue."]}],"y":569.6},{"id":"dan4c","g":"g2","date":"Year not given, late in the reign","yr":"c. 570s","tag":"Daniel 4","ch":4,"sub":2,"subs":4,"title":"Twelve months later: the fall","hook":"As the king boasts over the Babylon he built, a voice from heaven takes his kingdom from him.","refs":["DAN 4:28-33"],"scenes":[{"t":"Twelve months later","r":"DAN 4:28-33","b":["The king is walking on the roof of the royal palace of Babylon.","He says, “Is not this the great Babylon I have built as the royal residence, by my mighty power and for the glory of my majesty?”","While the words are still on his lips, a voice comes from heaven: “The kingdom has been taken from you.”","Immediately it is fulfilled. He is driven from people and eats grass like an ox. His body is wet with dew, his hair grows like eagles’ feathers and his nails like birds’ claws."]}],"y":569.2},{"id":"dan4d","g":"g2","date":"Year not given, late in the reign","yr":"c. 570s","tag":"Daniel 4","ch":4,"sub":3,"subs":4,"title":"Restored and humbled","hook":"The king lifts his eyes to heaven, his reason returns, and he praises the King of heaven.","refs":["DAN 4:34-37"],"scenes":[{"t":"He lifts his eyes to heaven","r":"DAN 4:34-35","b":["At the end of that time Nebuchadnezzar raises his eyes toward heaven, and his sanity is restored.","He praises the Most High and honours him who lives for ever.","“He does as he pleases with the powers of heaven and the peoples of the earth. No one can hold back his hand or say to him, ‘What have you done?’”"]},{"t":"Restored and humbled","r":"DAN 4:36-37","b":["His reason, his honour and his splendour return. His advisers and nobles seek him out, and he is restored to his throne, greater than before.","“Now I, Nebuchadnezzar, praise and exalt and glorify the King of heaven, because everything he does is right and all his ways are just.”","“And those who walk in pride he is able to humble.”"]}],"y":568.8},{"id":"jehoiachin","g":"g3","date":"c. 561 BC","yr":"561","tag":"Meanwhile","title":"A new king lifts up Jehoiachin","hook":"After Nebuchadnezzar, Judah’s captive king is brought out of prison.","refs":["2KI 25:27-30","JER 52:31-34"],"note":"History records that Nebuchadnezzar died in 562 BC and was followed by his son Evil-merodach. The book of Daniel is silent about the years between chapter 4 and the reign of Belshazzar.","scenes":[{"t":"Released from prison","r":"2KI 25:27","b":["In the thirty-seventh year of the exile of Jehoiachin king of Judah, Evil-merodach becomes king of Babylon.","In that year he releases Jehoiachin from prison."]},{"t":"A seat above the other kings","r":"2KI 25:28-30","b":["He speaks kindly to him and gives him a seat of honour higher than the other kings who are with him in Babylon.","Jehoiachin puts aside his prison clothes and eats regularly at the king’s table for the rest of his life.","The king gives him a regular allowance, a portion for each day, as long as he lives."]}],"y":561},{"id":"dan7a","g":"g3","date":"c. 553 BC","yr":"553","tag":"Daniel 7","ch":7,"sub":0,"subs":3,"title":"Four beasts from the sea","hook":"A lion, a bear, a leopard, and a fourth beast with iron teeth and ten horns.","refs":["DAN 7:1-8"],"scenes":[{"t":"A dream written down","r":"DAN 7:1","b":["In the first year of Belshazzar king of Babylon, Daniel has a dream, and visions pass through his mind as he lies in bed.","He writes down the substance of the dream."]},{"t":"Four beasts rise from the sea","r":"DAN 7:2-3","b":["The four winds of heaven are churning up the great sea.","Four great beasts come up out of the sea, each different from the others."]},{"t":"The lion, the bear and the leopard","r":"DAN 7:4-6","b":["The first is like a lion with the wings of an eagle. Its wings are torn off, it is lifted to stand on two feet like a man, and a human mind is given to it.","The second looks like a bear, raised up on one side, with three ribs in its mouth. It is told, “Get up and eat your fill of flesh!”","The third looks like a leopard with four wings like a bird’s on its back and four heads. It is given authority to rule."]},{"t":"The fourth beast","r":"DAN 7:7-8","b":["The fourth is terrifying, frightening and very powerful, with large iron teeth. It crushes and devours and tramples what is left.","It is different from all the others, and it has ten horns.","A little horn comes up among them, and three of the first horns are uprooted before it. It has eyes like a man’s and a mouth that speaks boastfully."]}],"y":553},{"id":"dan7b","g":"g3","date":"c. 553 BC","yr":"553","tag":"Daniel 7","ch":7,"sub":1,"subs":3,"title":"The Ancient of Days and one like a son of man","hook":"Thrones are set, the books are opened, and an everlasting kingdom is given.","refs":["DAN 7:9-14"],"scenes":[{"t":"The Ancient of Days takes his seat","r":"DAN 7:9-10","b":["Thrones are set in place, and the Ancient of Days takes his seat. His clothing is white as snow, and the hair of his head is like pure wool.","His throne is flaming with fire and its wheels are ablaze. A river of fire flows out from before him.","Thousands upon thousands attend him, and ten thousand times ten thousand stand before him. The court is seated, and the books are opened."]},{"t":"The beast is judged","r":"DAN 7:11-12","b":["Daniel keeps watching because of the boastful words the horn is speaking.","The beast is slain and its body is destroyed and thrown into the blazing fire.","The other beasts are stripped of their authority but are allowed to live for a period of time."]},{"t":"One like a son of man","r":"DAN 7:13-14","b":["Daniel sees one like a son of man, coming with the clouds of heaven. He approaches the Ancient of Days and is led into his presence.","He is given authority, glory and sovereign power, and all peoples, nations and languages serve him.","His dominion is everlasting and will not pass away, and his kingdom will never be destroyed."]}],"y":552.8},{"id":"dan7c","g":"g3","date":"c. 553 BC","yr":"553","tag":"Daniel 7","ch":7,"sub":2,"subs":3,"title":"The holy people receive the kingdom","hook":"An attendant explains the beasts, and Daniel keeps the matter to himself.","refs":["DAN 7:15-28"],"scenes":[{"t":"Daniel asks what it means","r":"DAN 7:15-18","b":["Daniel is troubled in spirit, and the visions disturb him. He approaches one of those standing there and asks the meaning.","The four great beasts are four kings that will rise from the earth.","But the holy people of the Most High will receive the kingdom and possess it for ever."]},{"t":"More about the fourth beast","r":"DAN 7:19-25","b":["Daniel wants to know about the fourth beast, its ten horns, and the other horn that looked greater than the rest.","As he watched, this horn was waging war against the holy people and defeating them, until the Ancient of Days came and judgment was given in their favour.","The fourth beast is a fourth kingdom, different from the others, that will devour the whole earth. The ten horns are ten kings, and another will rise after them and subdue three.","He will speak against the Most High, oppress his holy people, and try to change the set times and the law. They will be given into his hand for a time, times and half a time."]},{"t":"The court’s final verdict","r":"DAN 7:26-28","b":["The court will sit, and his power will be taken away and completely destroyed for ever.","The sovereignty, power and greatness of all the kingdoms under heaven will be handed over to the holy people of the Most High.","Daniel is deeply troubled by his thoughts and his face turns pale, but he keeps the matter to himself."]}],"y":552.6,"vision":{"text":"The four beasts are four kings, or kingdoms, that rise from the earth (7:17, 23). The court takes away the last ruler’s power, and the kingdom is given to the holy people of the Most High for ever (7:26–27).","hist":"Most conservative teachers read this as the same four empires as the statue in chapter 2: Babylon, Medo-Persia, Greece and Rome. The leopard’s four heads fit the four-way division of the Greek empire after Alexander. The little horn is widely understood as a final ruler who opposes God, though views differ on the details. In the Gospels Jesus applies the title “Son of Man coming on the clouds of heaven” to himself (Matthew 26:64)."}},{"id":"dan8a","g":"g3","date":"c. 551 BC","yr":"551","tag":"Daniel 8","ch":8,"sub":0,"subs":3,"title":"The ram and the goat","hook":"At Susa, a two-horned ram is trampled by a goat from the west, whose great horn breaks into four.","refs":["DAN 8:1-8"],"scenes":[{"t":"A vision at Susa","r":"DAN 8:1-2","b":["In the third year of King Belshazzar, Daniel has another vision, after the one that had already appeared to him.","In the vision he sees himself in the citadel of Susa in the province of Elam, beside the Ulai Canal."]},{"t":"A ram with two horns","r":"DAN 8:3-4","b":["A ram stands beside the canal with two long horns. One is longer than the other, and the longer one grew up later.","It charges toward the west, the north and the south. No animal can stand against it, and none can rescue from its power.","It does as it pleases and becomes great."]},{"t":"A goat from the west","r":"DAN 8:5-7","b":["A goat with a prominent horn between its eyes comes from the west, crossing the whole earth without touching the ground.","It charges at the ram in great rage, strikes it and shatters its two horns.","The ram is powerless. The goat knocks it to the ground and tramples it, and no one can rescue the ram."]},{"t":"The great horn breaks","r":"DAN 8:8","b":["The goat becomes very great, but at the height of its power the large horn is broken off.","In its place four prominent horns grow up toward the four winds of heaven."]}],"y":551},{"id":"dan8b","g":"g3","date":"c. 551 BC","yr":"551","tag":"Daniel 8","ch":8,"sub":1,"subs":3,"title":"The small horn and the sanctuary","hook":"A horn takes away the daily sacrifice, and a holy one asks, “How long?”","refs":["DAN 8:9-14"],"scenes":[{"t":"A small horn grows","r":"DAN 8:9-12","b":["Out of one of them comes a small horn that grows in power toward the south, the east and the Beautiful Land.","It grows until it reaches the host of heaven, throws some of the starry host down to the earth and tramples on them.","It sets itself up to be as great as the Prince of the host. It takes away the daily sacrifice, and the sanctuary is thrown down.","Truth is thrown to the ground, and it prospers in everything it does."]},{"t":"“How long?”","r":"DAN 8:13-14","b":["Daniel hears one holy one ask another how long the vision will take: the daily sacrifice, the rebellion that causes desolation, and the trampling of the sanctuary.","The answer is given: 2,300 evenings and mornings. Then the sanctuary will be restored."]}],"y":550.8},{"id":"dan8c","g":"g3","date":"c. 551 BC","yr":"551","tag":"Daniel 8","ch":8,"sub":2,"subs":3,"title":"Gabriel names the kingdoms","hook":"Media and Persia, then Greece, then a fierce king broken without human hand. Daniel lies sick for days.","refs":["DAN 8:15-27"],"scenes":[{"t":"Gabriel is sent","r":"DAN 8:15-19","b":["While Daniel is trying to understand, one who looks like a man stands before him.","A man’s voice calls from the Ulai, “Gabriel, tell this man the meaning of the vision.”","Daniel is terrified and falls face down. Gabriel says, “Son of man, understand that the vision concerns the time of the end.”","Daniel falls into a deep sleep with his face to the ground. Gabriel touches him and raises him to his feet."]},{"t":"The kingdoms are named","r":"DAN 8:20-22","b":["The two-horned ram represents the kings of Media and Persia.","The shaggy goat is the king of Greece, and the large horn between its eyes is the first king.","The four horns that replaced it are four kingdoms that will come from his nation, but without his power."]},{"t":"The fierce king","r":"DAN 8:23-25","b":["In the latter part of their reign, a fierce-looking king, a master of intrigue, will arise.","He will become very strong, but not by his own power. He will cause astounding devastation and destroy mighty men and the holy people.","He will make deceit prosper and consider himself superior. He will even stand against the Prince of princes.","Yet he will be destroyed, but not by human power."]},{"t":"Daniel is overwhelmed","r":"DAN 8:26-27","b":["The vision of the evenings and mornings is true, but Daniel is to seal it up, for it concerns the distant future.","Daniel is worn out and lies sick for several days. Then he gets up and goes about the king’s business.","He is appalled by the vision. It is beyond understanding."]}],"y":550.6,"vision":{"text":"Gabriel names the kingdoms: the two-horned ram is the kings of Media and Persia, the goat is the king of Greece, and its large horn is the first king (8:20–21). The four horns are four kingdoms that come from his nation (8:22).","hist":"Alexander the Great conquered Persia between 334 and 331 BC and died in 323 BC at the height of his power. His empire was divided among four of his generals. The small horn is widely identified as Antiochus IV Epiphanes (175–164 BC), who stopped the temple sacrifices and desecrated the sanctuary in 167 BC. The temple was rededicated in 164 BC, and Antiochus died of illness, not in battle."}},{"id":"dan5a","g":"g3","date":"539 BC","yr":"539","tag":"Daniel 5","ch":5,"sub":0,"subs":4,"title":"A feast with the temple vessels","hook":"Belshazzar drinks from the goblets taken from Jerusalem’s temple and praises gods of gold and stone.","refs":["DAN 5:1-4"],"scenes":[{"t":"A feast for a thousand","r":"DAN 5:1-4","b":["King Belshazzar gives a great banquet for a thousand of his nobles and drinks wine with them.","While he drinks, he orders the gold and silver goblets that Nebuchadnezzar had taken from the temple in Jerusalem to be brought in.","The king, his nobles, his wives and his concubines drink from them and praise the gods of gold, silver, bronze, iron, wood and stone."]}],"y":539.45,"note":"History dates the fall of Babylon to October 539 BC. Babylonian records show Belshazzar ruling the city on behalf of his father Nabonidus, which fits the offer of third place in the kingdom. “Father” in this chapter can mean ancestor or predecessor."},{"id":"dan5b","g":"g3","date":"539 BC","yr":"539","tag":"Daniel 5","ch":5,"sub":1,"subs":4,"title":"The hand on the wall","hook":"Fingers write on the plaster, the wise men fail, and the queen remembers Daniel.","refs":["DAN 5:5-12"],"scenes":[{"t":"The hand","r":"DAN 5:5-6","b":["Suddenly the fingers of a human hand appear and write on the plaster of the wall, near the lampstand in the royal palace.","The king watches the hand as it writes.","His face turns pale, his legs give way and his knees knock together."]},{"t":"The wise men fail","r":"DAN 5:7-9","b":["The king calls out for the enchanters, Chaldeans and diviners.","Whoever reads the writing and explains it will be clothed in purple, wear a gold chain around his neck, and be made the third highest ruler in the kingdom.","None of the wise men can read the writing or tell its meaning. Belshazzar becomes even more terrified, and his nobles are baffled."]},{"t":"The queen remembers Daniel","r":"DAN 5:10-12","b":["The queen hears the voices and comes into the banquet hall.","“There is a man in your kingdom who has the spirit of the holy gods in him.” In Nebuchadnezzar’s time he was found to have insight, intelligence and wisdom.","Nebuchadnezzar made him chief of the magicians. “Call for Daniel, and he will tell you what the writing means.”"]}],"y":539.42},{"id":"dan5c","g":"g3","date":"539 BC","yr":"539","tag":"Daniel 5","ch":5,"sub":2,"subs":4,"title":"Daniel refuses the gifts","hook":"Daniel turns down the rewards and reminds Belshazzar of the lesson he ignored.","refs":["DAN 5:13-23"],"scenes":[{"t":"Daniel refuses the reward","r":"DAN 5:13-17","b":["The king asks, “Are you Daniel, one of the exiles my father the king brought from Judah?”","He repeats the offer of purple, the gold chain and third place in the kingdom.","Daniel answers, “You may keep your gifts for yourself and give your rewards to someone else. Nevertheless, I will read the writing for the king.”"]},{"t":"The lesson Belshazzar ignored","r":"DAN 5:18-23","b":["The Most High God gave Nebuchadnezzar sovereignty, greatness, glory and splendour.","When his heart became arrogant, he was deposed from his throne, driven from people and fed grass like an ox, until he acknowledged that the Most High God rules.","“But you, Belshazzar, his son, have not humbled yourself, though you knew all this.”","He has set himself against the Lord of heaven, drunk from the vessels of his temple, and praised gods that cannot see or hear. He has not honoured the God who holds his life and all his ways in his hand."]}],"y":539.4},{"id":"dan5d","g":"g3","date":"539 BC","yr":"539","tag":"Daniel 5","ch":5,"sub":3,"subs":4,"title":"Weighed and found wanting: that very night","hook":"Mene, Tekel, Peres. That night Belshazzar is killed and Darius the Mede receives the kingdom.","refs":["DAN 5:24-31"],"scenes":[{"t":"Mene, Mene, Tekel, Parsin","r":"DAN 5:24-28","b":["Mene: God has numbered the days of his reign and brought it to an end.","Tekel: he has been weighed on the scales and found wanting.","Peres: his kingdom is divided and given to the Medes and Persians."]},{"t":"That very night","r":"DAN 5:29-31","b":["At Belshazzar’s command Daniel is clothed in purple, a gold chain is placed around his neck, and he is proclaimed the third highest ruler in the kingdom.","That very night Belshazzar, king of the Chaldeans, is killed.","Darius the Mede receives the kingdom, at about sixty-two years of age."]}],"y":539.38},{"id":"dan9a","g":"g4","date":"c. 539 – 538 BC","yr":"538","tag":"Daniel 9","ch":9,"sub":0,"subs":3,"title":"Daniel reads Jeremiah","hook":"In the first year of Darius, Daniel understands from the Scriptures that the desolation will last seventy years.","refs":["DAN 9:1-4"],"scenes":[{"t":"Daniel reads Jeremiah","r":"DAN 9:1-2","b":["It is the first year of Darius son of Ahasuerus, a Mede by descent, who was made ruler over the kingdom of the Chaldeans.","Daniel understands from the Scriptures, according to the word of the Lord given to Jeremiah, that the desolation of Jerusalem would last seventy years."]},{"t":"Fasting, sackcloth and ashes","r":"DAN 9:3-4","b":["So Daniel turns to the Lord God and pleads with him in prayer and petition, in fasting, sackcloth and ashes.","He prays and confesses: “Lord, the great and awesome God, who keeps his covenant of love with those who love him and keep his commandments.”"]}],"y":538.5},{"id":"dan9b","g":"g4","date":"c. 539 – 538 BC","yr":"538","tag":"Daniel 9","ch":9,"sub":1,"subs":3,"title":"A prayer of confession","hook":"With fasting and sackcloth, Daniel confesses his people’s sin and pleads for Jerusalem.","refs":["DAN 9:5-19"],"scenes":[{"t":"“We have sinned”","r":"DAN 9:5-11","b":["“We have sinned and done wrong. We have been wicked and have rebelled.” They have not listened to the prophets who spoke in God’s name.","“Lord, you are righteous, but this day we are covered with shame”: the people of Judah, Jerusalem and all Israel, near and far.","All Israel has broken his law, so the curses written in the Law of Moses have been poured out on them."]},{"t":"God did what he said","r":"DAN 9:12-14","b":["He has fulfilled the words spoken against them by bringing great disaster. Nothing like what was done to Jerusalem has ever been done under heaven.","Yet they have not sought the Lord’s favour by turning from their sins and giving attention to his truth.","“The Lord our God is righteous in everything he does.”"]},{"t":"A plea for the city","r":"DAN 9:15-19","b":["Daniel appeals to the God who brought his people out of Egypt with a mighty hand: turn your anger away from Jerusalem, your holy mountain.","“Look with favour on your desolate sanctuary.”","“We do not make requests of you because we are righteous, but because of your great mercy.”","“Lord, listen! Lord, forgive! Lord, hear and act! For your sake, my God, do not delay.”"]}],"y":538.45},{"id":"dan9c","g":"g4","date":"c. 539 – 538 BC","yr":"538","tag":"Daniel 9","ch":9,"sub":2,"subs":3,"title":"Gabriel and the seventy sevens","hook":"Gabriel arrives while Daniel is still praying, with a timeline that reaches to the Anointed One.","refs":["DAN 9:20-27"],"scenes":[{"t":"Gabriel arrives mid-prayer","r":"DAN 9:20-23","b":["While Daniel is still speaking, praying and confessing, Gabriel comes to him in swift flight, about the time of the evening sacrifice.","“Daniel, I have now come to give you insight and understanding.”","“As soon as you began to pray, a word went out, and I have come to tell you, for you are highly esteemed.”"]},{"t":"Seventy sevens are decreed","r":"DAN 9:24","b":["Seventy “sevens” are decreed for Daniel’s people and his holy city.","Their purpose: to finish transgression, to put an end to sin, to atone for wickedness, to bring in everlasting righteousness, to seal up vision and prophecy, and to anoint the Most Holy Place."]},{"t":"Until the Anointed One","r":"DAN 9:25","b":["From the time the word goes out to restore and rebuild Jerusalem until the Anointed One, the ruler, comes, there will be seven sevens and sixty-two sevens.","The city will be rebuilt with streets and a trench, but in times of trouble."]},{"t":"Cut off, and a city destroyed","r":"DAN 9:26-27","b":["After the sixty-two sevens, the Anointed One will be put to death and will have nothing.","The people of the ruler who will come will destroy the city and the sanctuary. The end will come like a flood, and war and desolations will continue.","He will confirm a covenant with many for one seven, and in the middle of the seven he will put an end to sacrifice and offering.","He will set up an abomination that causes desolation, until the end that is decreed is poured out on him."]}],"y":538.4,"vision":{"text":"Seventy “sevens” are decreed for Daniel’s people and the holy city, with six purposes that end in everlasting righteousness (9:24). The Anointed One comes after sixty-nine sevens and is then cut off, and the city and sanctuary are destroyed (9:25–26).","hist":"The sevens are generally understood as sevens of years, 490 in all. Many conservative teachers count the sixty-nine sevens from a Persian decree to rebuild Jerusalem (Ezra 7 or Nehemiah 2) to the coming of Jesus the Messiah, see his crucifixion in the Anointed One being cut off, and see the Roman destruction of Jerusalem in AD 70 in the ruin of the city and sanctuary. Views differ on the final seven: some see it fulfilled in the first century, and many see it as still future. Jesus speaks of “the abomination that causes desolation, spoken of through the prophet Daniel” (Matthew 24:15)."}},{"id":"dan6a","g":"g4","date":"c. 538 BC, year not given","yr":"538","tag":"Daniel 6","ch":6,"sub":0,"subs":4,"title":"No fault to be found","hook":"Daniel excels under Darius, and his rivals can find nothing against him except the law of his God.","refs":["DAN 6:1-5"],"scenes":[{"t":"Daniel stands out","r":"DAN 6:1-3","b":["Darius appoints 120 satraps to rule throughout the kingdom, with three administrators over them. Daniel is one of the three.","Daniel so di
